<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #131722; overflow: hidden; }
  #chart { width: 100%; height: 100%; position: relative; }
</style>
<script src="lightweight-charts.js"></script>
</head>
<body>
<div id="chart"></div>
<div id="hints" style="position:absolute; left:0; right:0; bottom:4px; text-align:center; pointer-events:none; z-index:5; font: 12px sans-serif; color:#3cd070;">
  <div id="hintTLine"></div>
  <div id="hintDailyBounce"></div>
</div>
<!-- Premarket Bollinger-exposure banner (15m RTH panel only) — see showExposureBanner/
     hideExposureBanner below. Plain overlay text, not a canvas primitive: no time/price anchor,
     no selection, just a static top-of-chart notice. -->
<div id="exposureBanner" style="position:absolute; left:0; right:0; top:4px; text-align:center; pointer-events:none; z-index:5; font: bold 13px sans-serif; color:#ffeb3b; display:none;"></div>
<script>
  const container = document.getElementById('chart');

  const chart = LightweightCharts.createChart(container, {
    width: container.clientWidth,
    height: container.clientHeight,
    layout: {
      background: { color: '#131722' },
      textColor: '#d1d4dc',
    },
    grid: {
      vertLines: { color: '#1f2530' },
      horzLines: { color: '#1f2530' },
    },
    timeScale: {
      timeVisible: true,
      secondsVisible: false,
      borderColor: '#2a2e39',
      rightOffset: 3, // leaves room for ~3 empty candles to the right, so the latest one isn't jammed against the edge
    },
    rightPriceScale: {
      borderColor: '#2a2e39',
    },
    crosshair: {
      mode: LightweightCharts.CrosshairMode.Normal,
    },
  });

  const candleSeries = chart.addCandlestickSeries({
    upColor: '#26a69a',
    downColor: '#ef5350',
    borderVisible: false,
    wickUpColor: '#26a69a',
    wickDownColor: '#ef5350',
    // Keeps the current price roughly centered vertically: instead of Lightweight Charts'
    // default autoscale (which just fits min/max of the visible candles), force a price range
    // symmetric around the LAST close — same margin above and below it, sized to whichever side
    // needs more room to fit the visible data.
    autoscaleInfoProvider: original => {
      const res = original();
      if (!res || !res.priceRange || allCandles.length === 0) return res;
      const lastClose = allCandles[allCandles.length - 1].close;
      const { minValue, maxValue } = res.priceRange;
      const halfRange = Math.max(maxValue - lastClose, lastClose - minValue);
      if (!(halfRange > 0)) return res;
      return { priceRange: { minValue: lastClose - halfRange, maxValue: lastClose + halfRange } };
    },
  });

  window.addEventListener('resize', () => {
    chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
  });

  // ---- Default visible time window (optional — set via configureVisibleDays) ----
  // Historical data is always loaded in full (SMA/Bollinger need the full lookback), but the
  // chart's initial zoom only shows the most recent N calendar days by default — the user can
  // still scroll/zoom out manually to see more.
  let visibleDays = null;
  function configureVisibleDays(days) { visibleDays = days; }

  // Tracks whether the user has manually changed the visible range (pan OR zoom) since we last
  // set it ourselves — once true, we stop touching their view entirely, forever (for this chart
  // instance). Comparing against "is the right edge still near now" isn't enough on its own: a
  // zoom-out to see more history still has its right edge near now, but must NOT get overridden.
  let userHasInteracted = false;
  let lastAppliedRange = null;

  chart.timeScale().subscribeVisibleTimeRangeChange(range => {
    if (userHasInteracted || !lastAppliedRange || !range) return;
    const matches = Math.abs(range.from - lastAppliedRange.from) < 1 && Math.abs(range.to - lastAppliedRange.to) < 1;
    if (!matches) userHasInteracted = true;
  });

  function applyVisibleRange() {
    const series = displaySeries();
    if (!visibleDays || series.length === 0) return;
    const days = [...new Set(series.map(c => dayStartOf(c.time)))].sort((a, b) => a - b);
    if (days.length === 0) return;
    const cutoffIdx = Math.max(0, days.length - visibleDays);

    // setVisibleRange is an EXACT range — it overrides timeScale.rightOffset's usual empty-space
    // margin, so the last candle would sit flush against the edge. Pad "to" by ~3 bars' worth of
    // time ourselves (bar spacing taken from the last two candles of whichever series is
    // currently displayed — hourly or daily) to leave that same margin.
    const barDuration = series.length > 1
      ? series[series.length - 1].time - series[series.length - 2].time
      : 900;
    const range = {
      from: days[cutoffIdx],
      to: series[series.length - 1].time + barDuration * 3,
    };
    lastAppliedRange = range;
    chart.timeScale().setVisibleRange(range);
  }

  // Reapplies the default range (refreshing the right-edge margin as new candles arrive) only if
  // the user hasn't manually panned/zoomed since the last time we set it — see userHasInteracted.
  function reapplyVisibleRangeIfLive() {
    if (!visibleDays || userHasInteracted) return;
    applyVisibleRange();
  }

  // ---- DZ/SZ (Demand Zone / Supply Zone) partial lines ----
  // toggleDzSz() arms the next 2 clicks: first click -> green line (Demand Zone) from the click
  // point to the right edge, second click -> red line (Supply Zone), same. The price value shows
  // on the right axis (no text label). createPriceLine always spans the FULL width, so it's only
  // used here for the axis label (lineVisible:false); the visible line segment itself is drawn by
  // a custom primitive anchored to the clicked time, so it stays correct across pan/zoom.
  // Every activation ADDS a new pair — previous ones are kept, not replaced.
  let dzSzArmed = false;
  let dzSzNextIsSupply = false; // false = next click draws Demand (green), true = Supply (red)
  const dzSzAxisLabels = []; // all createPriceLine handles, one per drawn line
  let dzSzAttached = false;

  class ZoneLinesPrimitive {
    constructor() { this._segments = []; this._chart = null; } // [{ time, price, color, selected }, ...] — pairs at (2i, 2i+1) = (demand, supply)
    attached(param) { this._chart = param.chart; }
    updateAllViews() {}
    paneViews() {
      const self = this;
      return [{
        renderer() {
          return {
            draw(target) {
              if (!self._chart) return;
              target.useBitmapCoordinateSpace(scope => {
                const ctx = scope.context;
                const ts = self._chart.timeScale();

                // Fill between each completed demand/supply pair — light red if supply (2nd
                // click) ended up above demand, light green if demand ended up above supply.
                for (let i = 0; i + 1 < self._segments.length; i += 2) {
                  const demand = self._segments[i];
                  const supply = self._segments[i + 1];
                  const xd = ts.timeToCoordinate(demand.time);
                  const xs = ts.timeToCoordinate(supply.time);
                  const yd = candleSeries.priceToCoordinate(demand.price);
                  const ys = candleSeries.priceToCoordinate(supply.price);
                  if (xd == null || xs == null || yd == null || ys == null) continue;

                  const left   = Math.max(xd, xs) * scope.horizontalPixelRatio;
                  const top    = Math.min(yd, ys) * scope.verticalPixelRatio;
                  const bottom = Math.max(yd, ys) * scope.verticalPixelRatio;
                  ctx.fillStyle = supply.price > demand.price
                    ? 'rgba(239, 83, 80, 0.15)'   // supply above demand -> light red
                    : 'rgba(38, 166, 154, 0.15)'; // demand above supply -> light green
                  ctx.fillRect(left, top, scope.bitmapSize.width - left, bottom - top);
                }

                self._segments.forEach(seg => {
                  const x = ts.timeToCoordinate(seg.time);
                  const y = candleSeries.priceToCoordinate(seg.price);
                  if (x == null || y == null) return;
                  ctx.strokeStyle = seg.color;
                  ctx.lineWidth = 2 * scope.horizontalPixelRatio;
                  ctx.beginPath();
                  ctx.moveTo(x * scope.horizontalPixelRatio, y * scope.verticalPixelRatio);
                  ctx.lineTo(scope.bitmapSize.width, y * scope.verticalPixelRatio);
                  ctx.stroke();

                  // Selected = yellow dashed overlay, same convention as gray Rect/T-Line/H-Line.
                  if (seg.selected) {
                    ctx.save();
                    ctx.strokeStyle = '#ffeb3b';
                    ctx.setLineDash([6 * scope.horizontalPixelRatio, 4 * scope.horizontalPixelRatio]);
                    ctx.beginPath();
                    ctx.moveTo(x * scope.horizontalPixelRatio, y * scope.verticalPixelRatio);
                    ctx.lineTo(scope.bitmapSize.width, y * scope.verticalPixelRatio);
                    ctx.stroke();
                    ctx.restore();
                  }
                });
              });
            }
          };
        }
      }];
    }
  }

  const zoneLinesPrimitive = new ZoneLinesPrimitive();

  // Toggle: one click on the button turns drawing mode ON — every 2 clicks on the chart from then
  // on draws a new demand+supply pair, forever, until the button is pressed again to turn it OFF.
  function toggleDzSz() {
    if (!dzSzAttached) { candleSeries.attachPrimitive(zoneLinesPrimitive); dzSzAttached = true; }
    dzSzArmed = !dzSzArmed;
    dzSzNextIsSupply = false;
    return dzSzArmed;
  }

  // Simulator only: SimulatorForm calls this on the 15m RTH chart whenever a DZ/SZ line is drawn
  // on the RTH+Overnight chart, so the same zone shows on both. Never armed here (no click
  // handling needed) — just pushes the line C# already decided the time/price for.
  function addMirroredZoneLine(time, price, color) {
    if (!dzSzAttached) { candleSeries.attachPrimitive(zoneLinesPrimitive); dzSzAttached = true; }
    zoneLinesPrimitive._segments.push({ time, price, color, selected: false });
    dzSzAxisLabels.push(candleSeries.createPriceLine({
      price, color, lineWidth: 1, lineVisible: false, axisLabelVisible: true, title: '',
    }));
    forceRepaint();
  }

  function clearMirroredZoneLines() {
    zoneLinesPrimitive._segments = [];
    dzSzAxisLabels.forEach(l => candleSeries.removePriceLine(l));
    dzSzAxisLabels.length = 0;
    forceRepaint();
  }

  // Removes the demand+supply pair starting at pairStart (always even — 2i/2i+1) from both
  // _segments and the matching right-axis price-line labels. Shared by the Delete-key handler and
  // removeMirroredZonePair below.
  function removeZonePairAtIndex(pairStart) {
    zoneLinesPrimitive._segments.splice(pairStart + 1, 1);
    zoneLinesPrimitive._segments.splice(pairStart, 1);
    const removedLabels = dzSzAxisLabels.splice(pairStart, 2);
    removedLabels.forEach(l => candleSeries.removePriceLine(l));
    forceRepaint();
  }

  // Simulator only: called on the SIBLING chart when a mirrored zone gets deleted on the other one
  // (either direction — RTH+Overnight is the "source" but the mirror on RTH is independently
  // selectable/deletable too) — matched by price since that's shared between the original and its
  // mirror, unlike time (mirrored lines can clamp to a different anchor on the RTH-only chart).
  function removeMirroredZonePair(price1, price2) {
    const idx = zoneLinesPrimitive._segments.findIndex(s => s.price === price1 || s.price === price2);
    if (idx === -1) return;
    removeZonePairAtIndex(idx % 2 === 0 ? idx : idx - 1);
  }

  // ---- Rect tool: sky-blue rectangle between 2 clicks (opposite corners, no value labels) ----

  class RectanglesPrimitive {
    constructor() { this._rects = []; this._preview = null; this._chart = null; } // [{ t1, p1, t2, p2, selected }, ...]
    attached(param) { this._chart = param.chart; }
    updateAllViews() {}
    paneViews() {
      const self = this;
      return [{
        renderer() {
          return {
            draw(target) {
              if (!self._chart) return;
              target.useBitmapCoordinateSpace(scope => {
                const ctx = scope.context;
                const ts = self._chart.timeScale();
                const drawRect = (r, alpha, selected) => {
                  const x1 = ts.timeToCoordinate(r.t1);
                  const x2 = ts.timeToCoordinate(r.t2);
                  const y1 = candleSeries.priceToCoordinate(r.p1);
                  const y2 = candleSeries.priceToCoordinate(r.p2);
                  if (x1 == null || x2 == null || y1 == null || y2 == null) return;
                  const left  = Math.min(x1, x2) * scope.horizontalPixelRatio;
                  const right = Math.max(x1, x2) * scope.horizontalPixelRatio;
                  const top    = Math.min(y1, y2) * scope.verticalPixelRatio;
                  const bottom = Math.max(y1, y2) * scope.verticalPixelRatio;
                  ctx.fillStyle = `rgba(135, 206, 235, ${alpha})`; // sky blue
                  ctx.fillRect(left, top, right - left, bottom - top);
                  if (selected) {
                    ctx.strokeStyle = '#ffeb3b'; // yellow outline = selected, ready to delete
                    ctx.lineWidth = 2 * scope.horizontalPixelRatio;
                    ctx.strokeRect(left, top, right - left, bottom - top);
                  }
                };
                self._rects.forEach(r => drawRect(r, 0.35, r.selected));
                if (self._preview) drawRect(self._preview, 0.18, false); // lighter while still dragging
              });
            }
          };
        }
      }];
    }
  }

  const rectanglesPrimitive = new RectanglesPrimitive();
  let rectAttached = false;
  let rectArmed = false;
  let rectPending = null; // { time, price } of the first click of the current rectangle

  // Same toggle pattern as DZ/SZ: one click arms it, every 2 chart clicks draws a new rectangle,
  // forever, until pressed again to disarm.
  function toggleRect() {
    if (!rectAttached) { candleSeries.attachPrimitive(rectanglesPrimitive); rectAttached = true; }
    rectArmed = !rectArmed;
    rectPending = null;
    return rectArmed;
  }

  // ---- Gray Rect tool (1h panel): filled gray rectangle marking sideways/consolidation ranges
  // around price+SMAs. Same 2-click draw as the sky-blue Rect above, but each rectangle can also
  // be SELECTED by clicking its border (works whether or not the tool is currently armed) and
  // removed by pressing Delete — the sky-blue Rect tool has no such selection/delete. ----

  class GrayRectPrimitive {
    constructor() { this._rects = []; this._preview = null; this._chart = null; } // [{ t1, p1, t2, p2, selected }, ...]
    attached(param) { this._chart = param.chart; }
    updateAllViews() {}
    paneViews() {
      const self = this;
      return [{
        renderer() {
          return {
            draw(target) {
              if (!self._chart) return;
              target.useBitmapCoordinateSpace(scope => {
                const ctx = scope.context;
                const ts = self._chart.timeScale();
                const drawRect = (r, alpha, selected) => {
                  const x1 = ts.timeToCoordinate(r.t1);
                  const x2 = ts.timeToCoordinate(r.t2);
                  const y1 = candleSeries.priceToCoordinate(r.p1);
                  const y2 = candleSeries.priceToCoordinate(r.p2);
                  if (x1 == null || x2 == null || y1 == null || y2 == null) return;
                  const left   = Math.min(x1, x2) * scope.horizontalPixelRatio;
                  const right  = Math.max(x1, x2) * scope.horizontalPixelRatio;
                  const top    = Math.min(y1, y2) * scope.verticalPixelRatio;
                  const bottom = Math.max(y1, y2) * scope.verticalPixelRatio;
                  ctx.fillStyle = `rgba(150, 150, 150, ${alpha})`;
                  ctx.fillRect(left, top, right - left, bottom - top);
                  if (selected) {
                    ctx.strokeStyle = '#ffeb3b'; // yellow outline = selected, ready to delete
                    ctx.lineWidth = 2 * scope.horizontalPixelRatio;
                    ctx.strokeRect(left, top, right - left, bottom - top);
                  }
                };
                self._rects.forEach(r => drawRect(r, 0.35, r.selected));
                if (self._preview) drawRect(self._preview, 0.18, false); // lighter while still dragging
              });
            }
          };
        }
      }];
    }
  }

  const grayRectPrimitive = new GrayRectPrimitive();
  let grayRectAttached = false;
  let grayRectArmed = false;
  let grayRectPending = null; // { time, price } of the first click of the current rectangle

  function toggleGrayRect() {
    if (!grayRectAttached) { candleSeries.attachPrimitive(grayRectPrimitive); grayRectAttached = true; }
    grayRectArmed = !grayRectArmed;
    grayRectPending = null;
    return grayRectArmed;
  }

  // Shortest distance from point (px,py) to the line segment (x1,y1)-(x2,y2), in CSS pixels.
  function distToSegment(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const lenSq = dx * dx + dy * dy;
    let t = lenSq === 0 ? 0 : ((px - x1) * dx + (py - y1) * dy) / lenSq;
    t = Math.max(0, Math.min(1, t));
    const cx = x1 + t * dx, cy = y1 + t * dy;
    return Math.hypot(px - cx, py - cy);
  }

  // Returns the index of the gray rect whose BORDER (not interior) is within a few pixels of
  // (px,py), or -1. Checked in CSS-pixel space (param.point from chart.subscribeClick), which is
  // what timeToCoordinate/priceToCoordinate already return outside of the bitmap draw() context.
  // Generic border-click hit-test shared by both rectangle tools (gray + sky blue) — returns the
  // index of the topmost rect (in `rects`) whose border is within a few pixels of (px,py), or -1.
  function findRectBorderIndex(rects, px, py) {
    const ts = chart.timeScale();
    const tolerance = 6;
    for (let i = rects.length - 1; i >= 0; i--) {
      const r = rects[i];
      const x1 = ts.timeToCoordinate(r.t1), x2 = ts.timeToCoordinate(r.t2);
      const y1 = candleSeries.priceToCoordinate(r.p1), y2 = candleSeries.priceToCoordinate(r.p2);
      if (x1 == null || x2 == null || y1 == null || y2 == null) continue;
      const left = Math.min(x1, x2), right = Math.max(x1, x2);
      const top = Math.min(y1, y2), bottom = Math.max(y1, y2);
      const edges = [
        [left, top, right, top], [right, top, right, bottom],
        [right, bottom, left, bottom], [left, bottom, left, top],
      ];
      if (edges.some(([ex1, ey1, ex2, ey2]) => distToSegment(px, py, ex1, ey1, ex2, ey2) <= tolerance)) return i;
    }
    return -1;
  }

  function findGrayRectByBorderClick(px, py) { return findRectBorderIndex(grayRectPrimitive._rects, px, py); }
  function findBlueRectByBorderClick(px, py) { return findRectBorderIndex(rectanglesPrimitive._rects, px, py); }

  // Returns the index of the T-Line whose segment is within a few pixels of (px,py), or -1.
  // Same distToSegment helper as the gray rect border check above.
  function findTLineByClick(px, py) {
    const ts = chart.timeScale();
    const tolerance = 6;
    for (let i = tLinePrimitive._lines.length - 1; i >= 0; i--) {
      const l = tLinePrimitive._lines[i];
      const x1 = ts.timeToCoordinate(l.t1), x2 = ts.timeToCoordinate(l.t2);
      const y1 = candleSeries.priceToCoordinate(l.p1), y2 = candleSeries.priceToCoordinate(l.p2);
      if (x1 == null || x2 == null || y1 == null || y2 == null) continue;
      if (distToSegment(px, py, x1, y1, x2, y2) <= tolerance) return i;
    }
    return -1;
  }

  // Returns the index of the H-Line whose horizontal segment (click point -> right edge) is
  // within a few pixels of (px,py), or -1. Same distToSegment helper as gray rect/T-Line above.
  function findHLineByClick(px, py) {
    const ts = chart.timeScale();
    const tolerance = 6;
    for (let i = hLinePrimitive._segments.length - 1; i >= 0; i--) {
      const seg = hLinePrimitive._segments[i];
      const x = ts.timeToCoordinate(seg.time);
      const y = candleSeries.priceToCoordinate(seg.price);
      if (x == null || y == null) continue;
      if (distToSegment(px, py, x, y, chart.timeScale().width(), y) <= tolerance) return i;
    }
    return -1;
  }

  // Returns the index of the DZ/SZ line (demand or supply, click point -> right edge, same shape
  // as H-Line) within a few pixels of (px,py), or -1.
  function findDzSzByClick(px, py) {
    const ts = chart.timeScale();
    const tolerance = 6;
    for (let i = zoneLinesPrimitive._segments.length - 1; i >= 0; i--) {
      const seg = zoneLinesPrimitive._segments[i];
      const x = ts.timeToCoordinate(seg.time);
      const y = candleSeries.priceToCoordinate(seg.price);
      if (x == null || y == null) continue;
      if (distToSegment(px, py, x, y, chart.timeScale().width(), y) <= tolerance) return i;
    }
    return -1;
  }

  // Delete removes whichever gray rect, T-Line, H-Line, or vertical arrow is currently selected
  // (click on its border/line). A deleted T-Line is also reported to C# (TLineStore) so it
  // doesn't come back on the next session.
  window.addEventListener('keydown', e => {
    if (e.key !== 'Delete') return;

    const rectIdx = grayRectPrimitive._rects.findIndex(r => r.selected);
    if (rectIdx !== -1) {
      grayRectPrimitive._rects.splice(rectIdx, 1);
      forceRepaint();
      return;
    }

    const blueRectIdx = rectanglesPrimitive._rects.findIndex(r => r.selected);
    if (blueRectIdx !== -1) {
      rectanglesPrimitive._rects.splice(blueRectIdx, 1);
      forceRepaint();
      return;
    }

    const lineIdx = tLinePrimitive._lines.findIndex(l => l.selected);
    if (lineIdx !== -1) {
      const removed = tLinePrimitive._lines[lineIdx];
      tLinePrimitive._lines.splice(lineIdx, 1);
      forceRepaint();
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage({ type: 'tline_delete', t1: removed.t1, p1: removed.p1, t2: removed.t2, p2: removed.p2 });
      }
      return;
    }

    // H-Line: removed here AND reported to C# (ChartPanel.CoreWebView2_WebMessageReceived), which
    // relays it (by price) to the other 2 panels' removeHLine — covers both manually-drawn H-Lines
    // and the auto-drawn prev-day High/Low (markPrevDayHiLo draws the same price on all 3 panels).
    const hLineIdx = hLinePrimitive._segments.findIndex(s => s.selected);
    if (hLineIdx !== -1) {
      const removed = hLinePrimitive._segments[hLineIdx];
      hLinePrimitive._segments.splice(hLineIdx, 1);
      forceRepaint();
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage({ type: 'hline_delete', price: removed.price });
      }
      return;
    }

    // DZ/SZ: removes the WHOLE zone (both demand+supply lines of the pair the selected line
    // belongs to), not just the one line clicked — pairs are strictly consecutive (2i, 2i+1), so
    // splicing only one would shift the pairing of every zone drawn after it.
    const dzSzIdx = zoneLinesPrimitive._segments.findIndex(s => s.selected);
    if (dzSzIdx !== -1) {
      const pairStart = dzSzIdx % 2 === 0 ? dzSzIdx : dzSzIdx - 1;
      const removedPrice1 = zoneLinesPrimitive._segments[pairStart].price;
      const removedPrice2 = zoneLinesPrimitive._segments[pairStart + 1].price;
      removeZonePairAtIndex(pairStart);
      // Simulator only (SimulatorForm mirrors each DZ/SZ zone onto the sibling RTH/RTH+Overnight
      // chart) — harmless on the live chart, nothing listens for it there. Reported by price
      // (not time) since a mirrored pair shares the same price but not necessarily the same
      // fake-UTC anchor time as the original.
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage({ type: 'dzsz_delete', price1: removedPrice1, price2: removedPrice2 });
      }
      return;
    }

    const deltaSIdx = deltaSPrimitive._labels.findIndex(l => l.selected);
    if (deltaSIdx !== -1) {
      deltaSPrimitive._labels.splice(deltaSIdx, 1);
      forceRepaint();
      return;
    }

    // Stk line: removed here AND reported to C# (ChartPanel.CoreWebView2_WebMessageReceived),
    // which relays it to the other 2 panels' removeStrikeLine so deleting from any one chart
    // removes it from all 3 — markStrike draws the same line on all 3 panels at trade open.
    const strikeIdx = strikeLinesPrimitive._lines.findIndex(l => l.selected);
    if (strikeIdx !== -1) {
      const removed = strikeLinesPrimitive._lines[strikeIdx];
      strikeLinesPrimitive._lines.splice(strikeIdx, 1);
      forceRepaint();
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage({ type: 'strike_delete', price: removed.price });
      }
      return;
    }

    const refLineIdx = pisoTechoRefLinePrimitive._lines.findIndex(l => l.selected);
    if (refLineIdx !== -1) {
      pisoTechoRefLinePrimitive._lines.splice(refLineIdx, 1);
      forceRepaint();
      return;
    }

    const arrowIdx = verticalArrowPrimitive._arrows.findIndex(a => a.selected);
    if (arrowIdx !== -1) {
      const removed = verticalArrowPrimitive._arrows[arrowIdx];
      verticalArrowPrimitive._arrows.splice(arrowIdx, 1);
      forceRepaint();
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage({ type: 'arrow_delete', time: removed.time, price: removed.price, up: removed.up });
      }
    }
  });

  function clearDrawings() {
    zoneLinesPrimitive._segments = [];
    dzSzAxisLabels.forEach(l => candleSeries.removePriceLine(l));
    dzSzAxisLabels.length = 0;
    dzSzArmed = false;
    dzSzNextIsSupply = false;

    rectanglesPrimitive._rects = [];
    rectanglesPrimitive._preview = null;
    rectArmed = false;
    rectPending = null;

    grayRectPrimitive._rects = [];
    grayRectPrimitive._preview = null;
    grayRectArmed = false;
    grayRectPending = null;

    tLinePrimitive._lines = [];
    tLinePrimitive._preview = null;
    tLineArmed = false;
    tLinePending = null;

    hLinePrimitive._segments = [];
    hLineArmed = false;

    arrowPrimitive._arrows = [];
    arrowPrimitive._preview = null;
    arrowArmed = false;
    arrowPending = null;

    textLabelsPrimitive._labels = [];

    verticalArrowPrimitive._arrows = [];
    greenArrowArmed = false;
    redArrowArmed = false;

    forceRepaint();
  }

  // Primitives don't repaint just because their backing data changed — only on an actual chart
  // interaction/data update. This no-op options change forces one without altering anything visible.
  function forceRepaint() {
    candleSeries.applyOptions({});
  }

  chart.subscribeClick(param => {
    if (!param.point) return;
    // Arrow tool handled here, BEFORE the clickTime/price guard below — clickTime falls back to
    // coordinateToTime, which (unlike coordinateToLogical) still returns null in truly empty
    // space (e.g. right of the last candle), which used to make the whole handler return early
    // and silently swallow the 2nd click of an arrow drawn into that space. Self-contained: uses
    // its own logical/price and returns immediately, without falling through to the rest of the
    // click handler (hit-testing for other tools, which arrow doesn't need).
    if (arrowArmed) {
      const logicalX = chart.timeScale().coordinateToLogical(param.point.x);
      const arrowPrice = candleSeries.coordinateToPrice(param.point.y);
      if (arrowPrice == null) return;
      if (!arrowPending) {
        arrowPending = { logical: logicalX, price: arrowPrice };
      } else {
        const red = arrowPending.price > arrowPrice; // 1st click above (higher price than) 2nd -> red
        arrowPrimitive._arrows.push({ l1: arrowPending.logical, p1: arrowPending.price, l2: logicalX, p2: arrowPrice, red });
        arrowPrimitive._preview = null;
        arrowPending = null;
        forceRepaint();
      }
      return;
    }

    // Stk line click selection — handled here, BEFORE the clickTime/price guard below, same
    // reason as the arrow tool above: the Stk= line is drawn from its anchor candle all the way
    // to the right edge of the chart (see markStrike/StrikeLinesPrimitive), so a large part of its
    // clickable length sits in truly empty space where coordinateToTime returns null — the guard
    // below used to swallow those clicks before ever reaching the hit test further down.
    // findStrikeLineByClick only needs the raw pixel coordinates, not clickTime/price.
    if (strikeLinesPrimitive._lines.length > 0) {
      const hitIdx = findStrikeLineByClick(param.point.x, param.point.y);
      if (hitIdx !== -1) {
        strikeLinesPrimitive._lines.forEach((l, i) => { l.selected = i === hitIdx; });
        forceRepaint();
        return;
      }
      const hadStrikeSelection = strikeLinesPrimitive._lines.some(l => l.selected);
      if (hadStrikeSelection) {
        strikeLinesPrimitive._lines.forEach(l => { l.selected = false; });
        forceRepaint();
      }
    }

    // param.time is only set when the click lands exactly on a rendered bar — during the
    // overnight/pre-market session (15m RTH+Overnight panel) real data is sparse, so large
    // stretches of the gray band have no bar under the cursor and param.time comes back
    // undefined, silently swallowing every click there. Fall back to converting the raw x pixel
    // to a time via the time scale so every drawing tool (DZ/SZ, T-Line, H-Line, Rect, etc.)
    // works anywhere on the chart, not just where a candle happens to sit.
    const clickTime = param.time !== undefined ? param.time : chart.timeScale().coordinateToTime(param.point.x);
    if (clickTime == null) return;
    const price = candleSeries.coordinateToPrice(param.point.y);
    if (price == null) return;

    // Gray rect border-click selection works regardless of whether the tool is currently armed
    // for drawing — clicking an existing rect's edge selects it (Delete key removes it) and
    // consumes the click so it doesn't also start a new rectangle.
    if (grayRectPrimitive._rects.length > 0) {
      const hitIdx = findGrayRectByBorderClick(param.point.x, param.point.y);
      if (hitIdx !== -1) {
        grayRectPrimitive._rects.forEach((r, i) => { r.selected = i === hitIdx; });
        forceRepaint();
        return;
      }
      const hadSelection = grayRectPrimitive._rects.some(r => r.selected);
      if (hadSelection) {
        grayRectPrimitive._rects.forEach(r => { r.selected = false; });
        forceRepaint();
      }
    }

    // Sky-blue rect border-click selection (15m RTH+Overnight panel) — same idea as gray rect.
    if (rectanglesPrimitive._rects.length > 0) {
      const hitIdx = findBlueRectByBorderClick(param.point.x, param.point.y);
      if (hitIdx !== -1) {
        rectanglesPrimitive._rects.forEach((r, i) => { r.selected = i === hitIdx; });
        forceRepaint();
        return;
      }
      const hadBlueSelection = rectanglesPrimitive._rects.some(r => r.selected);
      if (hadBlueSelection) {
        rectanglesPrimitive._rects.forEach(r => { r.selected = false; });
        forceRepaint();
      }
    }

    // T-Line click selection (1h panel) — same idea as the gray rect above: clicking near an
    // existing line selects it (Delete key removes it), regardless of whether T-Line drawing is
    // currently armed.
    if (tLinePrimitive._lines.length > 0) {
      const hitIdx = findTLineByClick(param.point.x, param.point.y);
      if (hitIdx !== -1) {
        tLinePrimitive._lines.forEach((l, i) => { l.selected = i === hitIdx; });
        forceRepaint();
        return;
      }
      const hadLineSelection = tLinePrimitive._lines.some(l => l.selected);
      if (hadLineSelection) {
        tLinePrimitive._lines.forEach(l => { l.selected = false; });
        forceRepaint();
      }
    }

    // H-Line click selection — same idea as gray rect/T-Line above: clicking near an existing
    // line selects it (Delete key removes it), regardless of whether H-Line drawing is armed.
    if (hLinePrimitive._segments.length > 0) {
      const hitIdx = findHLineByClick(param.point.x, param.point.y);
      if (hitIdx !== -1) {
        hLinePrimitive._segments.forEach((s, i) => { s.selected = i === hitIdx; });
        forceRepaint();
        return;
      }
      const hadHLineSelection = hLinePrimitive._segments.some(s => s.selected);
      if (hadHLineSelection) {
        hLinePrimitive._segments.forEach(s => { s.selected = false; });
        forceRepaint();
      }
    }

    // DZ/SZ click selection — same idea as above, regardless of whether DZ/SZ drawing is armed.
    // Delete removes the whole zone (both the demand and supply line of the pair), not just the
    // one line clicked — see the keydown handler below.
    if (zoneLinesPrimitive._segments.length > 0) {
      const hitIdx = findDzSzByClick(param.point.x, param.point.y);
      if (hitIdx !== -1) {
        zoneLinesPrimitive._segments.forEach((s, i) => { s.selected = i === hitIdx; });
        forceRepaint();
        return;
      }
      const hadDzSzSelection = zoneLinesPrimitive._segments.some(s => s.selected);
      if (hadDzSzSelection) {
        zoneLinesPrimitive._segments.forEach(s => { s.selected = false; });
        forceRepaint();
      }
    }

    // ΔS label click selection — same idea as above.
    if (deltaSPrimitive._labels.length > 0) {
      const hitIdx = findDeltaSByClick(param.point.x, param.point.y);
      if (hitIdx !== -1) {
        deltaSPrimitive._labels.forEach((l, i) => { l.selected = i === hitIdx; });
        forceRepaint();
        return;
      }
      const hadDeltaSSelection = deltaSPrimitive._labels.some(l => l.selected);
      if (hadDeltaSSelection) {
        deltaSPrimitive._labels.forEach(l => { l.selected = false; });
        forceRepaint();
      }
    }

    // Piso/Techo reference line click selection — same idea as above.
    if (pisoTechoRefLinePrimitive._lines.length > 0) {
      const hitIdx = findPisoTechoRefLineByClick(param.point.x, param.point.y);
      if (hitIdx !== -1) {
        pisoTechoRefLinePrimitive._lines.forEach((l, i) => { l.selected = i === hitIdx; });
        forceRepaint();
        return;
      }
      const hadRefLineSelection = pisoTechoRefLinePrimitive._lines.some(l => l.selected);
      if (hadRefLineSelection) {
        pisoTechoRefLinePrimitive._lines.forEach(l => { l.selected = false; });
        forceRepaint();
      }
    }

    // Vertical arrow click selection (1h panel) — same idea as gray rect/T-Line above.
    if (verticalArrowPrimitive._arrows.length > 0) {
      const hitIdx = findVerticalArrowByClick(param.point.x, param.point.y);
      if (hitIdx !== -1) {
        verticalArrowPrimitive._arrows.forEach((a, i) => { a.selected = i === hitIdx; });
        forceRepaint();
        return;
      }
      const hadArrowSelection = verticalArrowPrimitive._arrows.some(a => a.selected);
      if (hadArrowSelection) {
        verticalArrowPrimitive._arrows.forEach(a => { a.selected = false; });
        forceRepaint();
      }
    }

    if (dzSzArmed) {
      const color = dzSzNextIsSupply ? '#ef5350' : '#26a69a';

      zoneLinesPrimitive._segments.push({ time: clickTime, price, color, selected: false });

      dzSzAxisLabels.push(candleSeries.createPriceLine({
        price, color, lineWidth: 1, lineVisible: false, axisLabelVisible: true, title: '',
      }));

      dzSzNextIsSupply = !dzSzNextIsSupply;

      // Simulator only (SimulatorForm mirrors each line onto the 15m RTH chart at the same
      // price) — harmless on the live chart, nothing listens for it there.
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage({ type: 'dzsz', time: clickTime, price, color });
      }
    }

    if (rectArmed) {
      if (!rectPending) {
        rectPending = { time: clickTime, price };
      } else {
        rectanglesPrimitive._rects.push({ t1: rectPending.time, p1: rectPending.price, t2: clickTime, p2: price });
        rectanglesPrimitive._preview = null;
        rectPending = null;
        forceRepaint();
      }
    }

    if (grayRectArmed) {
      if (!grayRectPending) {
        grayRectPending = { time: clickTime, price };
      } else {
        grayRectPrimitive._rects.push({ t1: grayRectPending.time, p1: grayRectPending.price, t2: clickTime, p2: price, selected: false });
        grayRectPrimitive._preview = null;
        grayRectPending = null;
        forceRepaint();
      }
    }

    if (tLineArmed) {
      if (!tLinePending) {
        tLinePending = { time: clickTime, price };
      } else {
        const line = { t1: tLinePending.time, p1: tLinePending.price, t2: clickTime, p2: price };
        tLinePrimitive._lines.push(line);
        tLinePrimitive._preview = null;
        tLinePending = null;
        forceRepaint();
        // Persisted per-symbol by C# (TLineStore) so it reappears at the same point after
        // closing and reopening the app — see ChartPanel.CoreWebView2_WebMessageReceived.
        if (window.chrome && window.chrome.webview) {
          window.chrome.webview.postMessage({ type: 'tline', ...line });
        }
      }
    }

    if (hLineArmed) {
      hLinePrimitive._segments.push({ time: clickTime, price, selected: false });
      forceRepaint();
    }

    if (greenArrowArmed) {
      const arrow = { time: clickTime, price, up: true, selected: false };
      verticalArrowPrimitive._arrows.push(arrow);
      forceRepaint();
      // Persisted per-symbol by C# (VerticalArrowStore) — see ChartPanel.CoreWebView2_WebMessageReceived.
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage({ type: 'arrow_add', time: arrow.time, price: arrow.price, up: arrow.up });
      }
    }
    if (redArrowArmed) {
      const arrow = { time: clickTime, price, up: false, selected: false };
      verticalArrowPrimitive._arrows.push(arrow);
      forceRepaint();
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage({ type: 'arrow_add', time: arrow.time, price: arrow.price, up: arrow.up });
      }
    }
  });

  // Live preview of the rectangle/T-Line while the mouse moves between the 1st and 2nd click.
  chart.subscribeCrosshairMove(param => {
    if (!rectArmed || !rectPending) {
      if (rectanglesPrimitive._preview) { rectanglesPrimitive._preview = null; forceRepaint(); }
    } else if (param.point && param.time !== undefined) {
      const price = candleSeries.coordinateToPrice(param.point.y);
      if (price != null) {
        rectanglesPrimitive._preview = { t1: rectPending.time, p1: rectPending.price, t2: param.time, p2: price };
        forceRepaint();
      }
    }

    if (!grayRectArmed || !grayRectPending) {
      if (grayRectPrimitive._preview) { grayRectPrimitive._preview = null; forceRepaint(); }
    } else if (param.point && param.time !== undefined) {
      const price = candleSeries.coordinateToPrice(param.point.y);
      if (price != null) {
        grayRectPrimitive._preview = { t1: grayRectPending.time, p1: grayRectPending.price, t2: param.time, p2: price };
        forceRepaint();
      }
    }

    if (!tLineArmed || !tLinePending) {
      if (tLinePrimitive._preview) { tLinePrimitive._preview = null; forceRepaint(); }
    } else if (param.point && param.time !== undefined) {
      const price = candleSeries.coordinateToPrice(param.point.y);
      if (price != null) {
        tLinePrimitive._preview = { t1: tLinePending.time, p1: tLinePending.price, t2: param.time, p2: price };
        forceRepaint();
      }
    }

    if (!arrowArmed || !arrowPending) {
      if (arrowPrimitive._preview) { arrowPrimitive._preview = null; forceRepaint(); }
    } else if (param.point) {
      // No param.time !== undefined gate here (unlike the other tools' previews) — the preview
      // must keep following the cursor into the empty space beyond the last candle too.
      const price = candleSeries.coordinateToPrice(param.point.y);
      if (price != null) {
        const logicalX = chart.timeScale().coordinateToLogical(param.point.x);
        const red = arrowPending.price > price;
        arrowPrimitive._preview = { l1: arrowPending.logical, p1: arrowPending.price, l2: logicalX, p2: price, red };
        forceRepaint();
      }
    }
  });

  // ---- T-Line tool: orange line segment between 2 clicks (not extended to the edges) ----

  class TLinePrimitive {
    constructor() { this._lines = []; this._preview = null; this._chart = null; } // [{ t1, p1, t2, p2 }, ...]
    attached(param) { this._chart = param.chart; }
    updateAllViews() {}
    paneViews() {
      const self = this;
      return [{
        renderer() {
          return {
            draw(target) {
              if (!self._chart) return;
              target.useBitmapCoordinateSpace(scope => {
                const ctx = scope.context;
                const ts = self._chart.timeScale();
                const drawLine = (l, alpha) => {
                  const x1 = ts.timeToCoordinate(l.t1);
                  const x2 = ts.timeToCoordinate(l.t2);
                  const y1 = candleSeries.priceToCoordinate(l.p1);
                  const y2 = candleSeries.priceToCoordinate(l.p2);
                  if (x1 == null || x2 == null || y1 == null || y2 == null) return;
                  ctx.strokeStyle = `rgba(255, 152, 0, ${alpha})`; // orange
                  ctx.lineWidth = 2 * scope.horizontalPixelRatio;
                  ctx.beginPath();
                  ctx.moveTo(x1 * scope.horizontalPixelRatio, y1 * scope.verticalPixelRatio);
                  ctx.lineTo(x2 * scope.horizontalPixelRatio, y2 * scope.verticalPixelRatio);
                  ctx.stroke();

                  if (l.selected) {
                    ctx.strokeStyle = '#ffeb3b'; // yellow dashed overlay = selected, ready to delete
                    ctx.lineWidth = 1 * scope.horizontalPixelRatio;
                    ctx.setLineDash([4 * scope.horizontalPixelRatio, 4 * scope.horizontalPixelRatio]);
                    ctx.beginPath();
                    ctx.moveTo(x1 * scope.horizontalPixelRatio, y1 * scope.verticalPixelRatio);
                    ctx.lineTo(x2 * scope.horizontalPixelRatio, y2 * scope.verticalPixelRatio);
                    ctx.stroke();
                    ctx.setLineDash([]);
                  }
                };
                self._lines.forEach(l => drawLine(l, 1));
                if (self._preview) drawLine(self._preview, 0.6);
              });
            }
          };
        }
      }];
    }
  }

  const tLinePrimitive = new TLinePrimitive();
  let tLineAttached = false;
  let tLineArmed = false;
  let tLinePending = null; // { time, price } of the first click of the current segment

  function toggleTLine() {
    if (!tLineAttached) { candleSeries.attachPrimitive(tLinePrimitive); tLineAttached = true; }
    tLineArmed = !tLineArmed;
    tLinePending = null;
    return tLineArmed;
  }

  // Only 1 T-Line is allowed at a time (ChartPanel.cs enforces this and calls this to undo a
  // 2nd one just drawn, after warning the user with a MessageBox).
  function removeLastTLine() {
    tLinePrimitive._lines.pop();
    forceRepaint();
  }

  // ---- H-Line tool: red line from the click point to the right edge of the chart ----

  class HLinePrimitive {
    constructor() { this._segments = []; this._chart = null; } // [{ time, price }, ...]
    attached(param) { this._chart = param.chart; }
    updateAllViews() {}
    paneViews() {
      const self = this;
      return [{
        renderer() {
          return {
            draw(target) {
              if (!self._chart) return;
              target.useBitmapCoordinateSpace(scope => {
                const ctx = scope.context;
                const ts = self._chart.timeScale();
                self._segments.forEach(seg => {
                  const x = ts.timeToCoordinate(seg.time);
                  const y = candleSeries.priceToCoordinate(seg.price);
                  if (x == null || y == null) return;
                  ctx.strokeStyle = '#ef5350'; // red
                  ctx.lineWidth = 2 * scope.horizontalPixelRatio;
                  ctx.beginPath();
                  ctx.moveTo(x * scope.horizontalPixelRatio, y * scope.verticalPixelRatio);
                  ctx.lineTo(scope.bitmapSize.width, y * scope.verticalPixelRatio);
                  ctx.stroke();

                  if (seg.selected) {
                    ctx.strokeStyle = '#ffeb3b'; // yellow dashed overlay = selected, ready to delete
                    ctx.lineWidth = 1 * scope.horizontalPixelRatio;
                    ctx.setLineDash([4 * scope.horizontalPixelRatio, 4 * scope.horizontalPixelRatio]);
                    ctx.beginPath();
                    ctx.moveTo(x * scope.horizontalPixelRatio, y * scope.verticalPixelRatio);
                    ctx.lineTo(scope.bitmapSize.width, y * scope.verticalPixelRatio);
                    ctx.stroke();
                    ctx.setLineDash([]);
                  }
                });
              });
            }
          };
        }
      }];
    }
  }

  const hLinePrimitive = new HLinePrimitive();
  let hLineAttached = false;
  let hLineArmed = false;

  function toggleHLine() {
    if (!hLineAttached) { candleSeries.attachPrimitive(hLinePrimitive); hLineAttached = true; }
    hLineArmed = !hLineArmed;
    return hLineArmed;
  }

  // Called by C# to remove an H-Line at the given price as the ECHO of a deletion that happened
  // on a SIBLING panel (see the 'hline_delete' postMessage above) — no postMessage sent back out
  // from here, so the 3 panels don't ping-pong the same delete forever. Removes every matching
  // line at that price (there's normally at most one, but this stays correct even if two happen
  // to coincide, e.g. a manual H-Line drawn at the same price as the auto prev-day high/low).
  function removeHLine(price) {
    hLinePrimitive._segments = hLinePrimitive._segments.filter(s => s.price !== price);
    forceRepaint();
  }

  // Auto-drawn previous-day High/Low — same red H-Line primitive as the manual tool above (same
  // color, same "anchor to right edge" rendering, same click-select + Delete behavior), just
  // pushed programmatically by C# instead of via a user click. Either argument can be null (the
  // reference price already broke through that side, e.g. a gap-open above yesterday's high), in
  // which case that line is simply not added.
  function markPrevDayHiLo(highTime, highPrice, lowTime, lowPrice) {
    if (!hLineAttached) { candleSeries.attachPrimitive(hLinePrimitive); hLineAttached = true; }
    if (highTime != null && highPrice != null) hLinePrimitive._segments.push({ time: highTime, price: highPrice, selected: false });
    if (lowTime != null && lowPrice != null) hLinePrimitive._segments.push({ time: lowTime, price: lowPrice, selected: false });
    forceRepaint();
  }

  // ---- Pre-market line (1h and 15m RTH panels): blue line from the LAST candle currently
  // loaded (yesterday's close, since the market hasn't opened today yet) to the right edge,
  // following the live price tick by tick until the market opens at 9:30 — after that C# simply
  // stops sending updates, so it freezes in place on its own. Same "anchor at the last loaded
  // candle" convention as markStrike's green Stk= line. Not persisted anywhere; a fresh
  // startPreMarketLine() call replaces it entirely. ----

  class PreMarketLinePrimitive {
    constructor() { this._armed = false; this._price = null; this._chart = null; }
    attached(param) { this._chart = param.chart; }
    updateAllViews() {}
    paneViews() {
      const self = this;
      return [{
        renderer() {
          return {
            draw(target) {
              if (!self._chart || !self._armed || self._price == null || allCandles.length === 0) return;
              target.useBitmapCoordinateSpace(scope => {
                const ctx = scope.context;
                const ts = self._chart.timeScale();
                const y = candleSeries.priceToCoordinate(self._price);
                if (y == null) return;
                const xRaw = ts.timeToCoordinate(allCandles[allCandles.length - 1].time);
                const x = xRaw == null ? 0 : xRaw;
                ctx.strokeStyle = '#2196f3'; // blue
                ctx.lineWidth = 2 * scope.horizontalPixelRatio;
                ctx.beginPath();
                ctx.moveTo(x * scope.horizontalPixelRatio, y * scope.verticalPixelRatio);
                ctx.lineTo(scope.bitmapSize.width, y * scope.verticalPixelRatio);
                ctx.stroke();
              });
            }
          };
        }
      }];
    }
  }

  const preMarketLinePrimitive = new PreMarketLinePrimitive();
  let preMarketLineAttached = false;

  // Called once, right when the chart opens, only if it's before 9:30 AM ET that day.
  function startPreMarketLine() {
    if (!preMarketLineAttached) { candleSeries.attachPrimitive(preMarketLinePrimitive); preMarketLineAttached = true; }
    preMarketLinePrimitive._armed = true;
    preMarketLinePrimitive._price = null;
    forceRepaint();
  }

  // Called on every pre-market tick until 9:30 AM ET; C# stops calling this once the market
  // opens, which is what makes the line freeze in place with no extra logic needed here.
  function updatePreMarketLine(price) {
    if (!preMarketLinePrimitive._armed) return; // startPreMarketLine wasn't called this session
    preMarketLinePrimitive._price = price;
    forceRepaint();
  }

  // ---- Arrow tool: line + arrowhead between 2 clicks — red if the 1st click is ABOVE (higher
  // price than) the 2nd click, green otherwise ----

  class ArrowPrimitive {
    constructor() { this._arrows = []; this._preview = null; this._chart = null; } // [{ l1, p1, l2, p2, red }, ...]
    attached(param) { this._chart = param.chart; }
    updateAllViews() {}
    paneViews() {
      const self = this;
      return [{
        renderer() {
          return {
            draw(target) {
              if (!self._chart) return;
              target.useBitmapCoordinateSpace(scope => {
                const ctx = scope.context;
                const ts = self._chart.timeScale();
                const drawArrow = (a, alpha) => {
                  // logicalToCoordinate (not timeToCoordinate) — extrapolates past the last/first
                  // candle, so the arrow renders correctly even into space with no bar underneath.
                  const x1 = ts.logicalToCoordinate(a.l1);
                  const x2 = ts.logicalToCoordinate(a.l2);
                  const y1 = candleSeries.priceToCoordinate(a.p1);
                  const y2 = candleSeries.priceToCoordinate(a.p2);
                  if (x1 == null || x2 == null || y1 == null || y2 == null) return;

                  const X1 = x1 * scope.horizontalPixelRatio, Y1 = y1 * scope.verticalPixelRatio;
                  const X2 = x2 * scope.horizontalPixelRatio, Y2 = y2 * scope.verticalPixelRatio;
                  const color = a.red ? `rgba(239, 83, 80, ${alpha})` : `rgba(38, 166, 154, ${alpha})`;

                  ctx.strokeStyle = color;
                  ctx.fillStyle = color;
                  ctx.lineWidth = 2 * scope.horizontalPixelRatio;
                  ctx.beginPath();
                  ctx.moveTo(X1, Y1);
                  ctx.lineTo(X2, Y2);
                  ctx.stroke();

                  // Arrowhead at the 2nd click, pointing along the line's direction.
                  const angle = Math.atan2(Y2 - Y1, X2 - X1);
                  const headLen = 10 * scope.horizontalPixelRatio;
                  const headAngle = Math.PI / 7;
                  ctx.beginPath();
                  ctx.moveTo(X2, Y2);
                  ctx.lineTo(X2 - headLen * Math.cos(angle - headAngle), Y2 - headLen * Math.sin(angle - headAngle));
                  ctx.lineTo(X2 - headLen * Math.cos(angle + headAngle), Y2 - headLen * Math.sin(angle + headAngle));
                  ctx.closePath();
                  ctx.fill();
                };
                self._arrows.forEach(a => drawArrow(a, 1));
                if (self._preview) drawArrow(self._preview, 0.6);
              });
            }
          };
        }
      }];
    }
  }

  const arrowPrimitive = new ArrowPrimitive();
  let arrowAttached = false;
  let arrowArmed = false;
  let arrowPending = null; // { time, price } of the first click of the current arrow

  function toggleArrow() {
    if (!arrowAttached) { candleSeries.attachPrimitive(arrowPrimitive); arrowAttached = true; }
    arrowArmed = !arrowArmed;
    arrowPending = null;
    return arrowArmed;
  }

  // ---- Vertical arrow tool (1h panel): single click places a fixed-length vertical arrow, tip
  // at the clicked point — green pointing UP (tail below), red pointing DOWN (tail above).
  // Selectable by clicking the shaft, removable with Delete (same pattern as gray Rect/T-Line). ----

  const VERTICAL_ARROW_LENGTH = 40; // CSS pixels, fixed regardless of zoom

  class VerticalArrowPrimitive {
    constructor() { this._arrows = []; this._chart = null; } // [{ time, price, up, selected }, ...]
    attached(param) { this._chart = param.chart; }
    updateAllViews() {}
    paneViews() {
      const self = this;
      return [{
        renderer() {
          return {
            draw(target) {
              if (!self._chart) return;
              target.useBitmapCoordinateSpace(scope => {
                const ctx = scope.context;
                const ts = self._chart.timeScale();
                self._arrows.forEach(a => {
                  const x = ts.timeToCoordinate(a.time);
                  const yTip = candleSeries.priceToCoordinate(a.price);
                  if (x == null || yTip == null) return;

                  const X = x * scope.horizontalPixelRatio;
                  const YTip = yTip * scope.verticalPixelRatio;
                  const lengthPx = VERTICAL_ARROW_LENGTH * scope.verticalPixelRatio;
                  const YTail = a.up ? YTip + lengthPx : YTip - lengthPx;
                  const color = a.up ? '#26a69a' : '#ef5350';

                  ctx.strokeStyle = color;
                  ctx.fillStyle = color;
                  ctx.lineWidth = 2 * scope.horizontalPixelRatio;
                  ctx.beginPath();
                  ctx.moveTo(X, YTail);
                  ctx.lineTo(X, YTip);
                  ctx.stroke();

                  const headLen = 8 * scope.verticalPixelRatio;
                  const headWidth = 5 * scope.horizontalPixelRatio;
                  const headBackY = a.up ? YTip + headLen : YTip - headLen;
                  ctx.beginPath();
                  ctx.moveTo(X, YTip);
                  ctx.lineTo(X - headWidth, headBackY);
                  ctx.lineTo(X + headWidth, headBackY);
                  ctx.closePath();
                  ctx.fill();

                  if (a.selected) {
                    ctx.strokeStyle = '#ffeb3b';
                    ctx.lineWidth = 1 * scope.horizontalPixelRatio;
                    ctx.setLineDash([4 * scope.horizontalPixelRatio, 4 * scope.horizontalPixelRatio]);
                    ctx.beginPath();
                    ctx.moveTo(X, YTail);
                    ctx.lineTo(X, YTip);
                    ctx.stroke();
                    ctx.setLineDash([]);
                  }
                });
              });
            }
          };
        }
      }];
    }
  }

  const verticalArrowPrimitive = new VerticalArrowPrimitive();
  let verticalArrowAttached = false;
  let greenArrowArmed = false;
  let redArrowArmed = false;

  function toggleGreenArrow() {
    if (!verticalArrowAttached) { candleSeries.attachPrimitive(verticalArrowPrimitive); verticalArrowAttached = true; }
    greenArrowArmed = !greenArrowArmed;
    return greenArrowArmed;
  }

  function toggleRedArrow() {
    if (!verticalArrowAttached) { candleSeries.attachPrimitive(verticalArrowPrimitive); verticalArrowAttached = true; }
    redArrowArmed = !redArrowArmed;
    return redArrowArmed;
  }

  // CSS-pixel endpoints of a vertical arrow's shaft, for hit-testing (same space as
  // chart.subscribeClick's param.point). Returns null if either coordinate is off-screen.
  function verticalArrowEndpoints(a) {
    const ts = chart.timeScale();
    const x = ts.timeToCoordinate(a.time);
    const yTip = candleSeries.priceToCoordinate(a.price);
    if (x == null || yTip == null) return null;
    const yTail = a.up ? yTip + VERTICAL_ARROW_LENGTH : yTip - VERTICAL_ARROW_LENGTH;
    return { x, yTip, yTail };
  }

  function findVerticalArrowByClick(px, py) {
    const tolerance = 6;
    for (let i = verticalArrowPrimitive._arrows.length - 1; i >= 0; i--) {
      const pts = verticalArrowEndpoints(verticalArrowPrimitive._arrows[i]);
      if (!pts) continue;
      if (distToSegment(px, py, pts.x, pts.yTip, pts.x, pts.yTail) <= tolerance) return i;
    }
    return -1;
  }

  // ---- Dragging a selected vertical arrow ----
  // mousedown on an already-selected arrow's shaft starts a drag instead of letting the chart pan;
  // mousemove while dragging updates the arrow's tip (time/price) to follow the cursor;
  // mouseup ends it and restores normal chart pan/zoom.
  let draggingArrowIdx = -1;
  let draggingArrowOriginal = null; // { time, price, up } captured at mousedown, to report the move

  container.addEventListener('mousedown', ev => {
    const idx = verticalArrowPrimitive._arrows.findIndex(a => a.selected);
    if (idx === -1) return;
    const rect = container.getBoundingClientRect();
    const px = ev.clientX - rect.left, py = ev.clientY - rect.top;
    const pts = verticalArrowEndpoints(verticalArrowPrimitive._arrows[idx]);
    if (!pts || distToSegment(px, py, pts.x, pts.yTip, pts.x, pts.yTail) > 6) return;

    draggingArrowIdx = idx;
    const a = verticalArrowPrimitive._arrows[idx];
    draggingArrowOriginal = { time: a.time, price: a.price, up: a.up };
    chart.applyOptions({ handleScroll: false, handleScale: false }); // don't pan/zoom the chart while dragging
    ev.preventDefault();
    ev.stopPropagation();
  });

  container.addEventListener('mousemove', ev => {
    if (draggingArrowIdx === -1) return;
    const rect = container.getBoundingClientRect();
    const px = ev.clientX - rect.left, py = ev.clientY - rect.top;
    const time = chart.timeScale().coordinateToTime(px);
    const price = candleSeries.coordinateToPrice(py);
    if (time == null || price == null) return;
    verticalArrowPrimitive._arrows[draggingArrowIdx].time = time;
    verticalArrowPrimitive._arrows[draggingArrowIdx].price = price;
    forceRepaint();
  });

  window.addEventListener('mouseup', () => {
    if (draggingArrowIdx === -1) return;
    const a = verticalArrowPrimitive._arrows[draggingArrowIdx];
    const moved = draggingArrowOriginal && (a.time !== draggingArrowOriginal.time || a.price !== draggingArrowOriginal.price);
    if (moved && window.chrome && window.chrome.webview) {
      window.chrome.webview.postMessage({
        type: 'arrow_move',
        oldTime: draggingArrowOriginal.time, oldPrice: draggingArrowOriginal.price, up: draggingArrowOriginal.up,
        newTime: a.time, newPrice: a.price,
      });
    }
    draggingArrowIdx = -1;
    draggingArrowOriginal = null;
    chart.applyOptions({ handleScroll: true, handleScale: true });
  });

  // ---- Piso/Techo tool: writes orange text at the clicked point (1h panel) — single click per
  // label, no pairing (unlike the 2-click tools above) ----

  class TextLabelsPrimitive {
    constructor() { this._labels = []; this._chart = null; } // [{ time, price, text }, ...]
    attached(param) { this._chart = param.chart; }
    updateAllViews() {}
    paneViews() {
      const self = this;
      return [{
        renderer() {
          return {
            draw(target) {
              if (!self._chart) return;
              target.useBitmapCoordinateSpace(scope => {
                const ctx = scope.context;
                const ts = self._chart.timeScale();
                ctx.font = `${12 * scope.verticalPixelRatio}px sans-serif`;
                ctx.textBaseline = 'middle';
                self._labels.forEach(l => {
                  ctx.fillStyle = l.color || '#ff9800'; // orange default (Piso/Techo)
                  const size = l.fontSize || (l.bold ? 14 : 12);
                  ctx.font = l.bold ? `bold ${size * scope.verticalPixelRatio}px sans-serif` : `${size * scope.verticalPixelRatio}px sans-serif`;

                  // Fixed at the top-center of the chart pane, ignoring pan/zoom/price entirely —
                  // used for markExpired, which needs to stay put and readable regardless of where
                  // the last candle's price happens to be.
                  if (l.fixedTop) {
                    ctx.textAlign = 'center';
                    ctx.fillText(l.text, scope.bitmapSize.width / 2, 70 * scope.verticalPixelRatio);
                    ctx.textAlign = 'left';
                    return;
                  }

                  // Same idea as fixedTop, but anchored near the bottom-center instead — used for
                  // the "PM" (Punto Medio / SMA20 slope) live indicator, which needs to stay put
                  // and readable regardless of price/pan/zoom, same as Expired!!! does up top.
                  if (l.fixedBottom) {
                    ctx.textAlign = 'center';
                    ctx.fillText(l.text, scope.bitmapSize.width / 2, scope.bitmapSize.height - 16 * scope.verticalPixelRatio);
                    ctx.textAlign = 'left';
                    return;
                  }

                  // Same idea, bottom-RIGHT instead — used for "1er Rebote: 90%".
                  if (l.fixedBottomRight) {
                    ctx.textAlign = 'right';
                    ctx.fillText(l.text, scope.bitmapSize.width - 10 * scope.horizontalPixelRatio, scope.bitmapSize.height - 16 * scope.verticalPixelRatio);
                    ctx.textAlign = 'left';
                    return;
                  }

                  const x = ts.timeToCoordinate(l.time);
                  const y = candleSeries.priceToCoordinate(l.price);
                  if (x == null || y == null) return;
                  if (l.above) {
                    // Anchored at/near the LAST candle (e.g. markExpired) sits right where
                    // Lightweight Charts draws its own "last price" label box, on the same y —
                    // the default right-of-point placement below gets hidden behind it. Draw
                    // above and ending AT the point instead, clear of that label.
                    ctx.textAlign = 'right';
                    ctx.fillText(l.text, x * scope.horizontalPixelRatio, y * scope.verticalPixelRatio - 14 * scope.verticalPixelRatio);
                    ctx.textAlign = 'left';
                  } else {
                    ctx.fillText(l.text, x * scope.horizontalPixelRatio + 4, y * scope.verticalPixelRatio);
                  }
                });
              });
            }
          };
        }
      }];
    }
  }

  const textLabelsPrimitive = new TextLabelsPrimitive();
  let textLabelsAttached = false;

  // ---- Piso/Techo AUTO label (1h panel only): programmatic (markPisoTecho, called once by C#
  // from the pre-market SMA pair analysis — independently for the 20/40 pair and the 100/200
  // pair) and tracks the CURRENT last point of each SMA line on every repaint — via smaLastPoint,
  // updated by recalculateSmas() — so each label moves right alongside its SMA all session long
  // instead of staying pinned to where it was first drawn. ----

  class PisoTechoAutoLabelPrimitive {
    constructor() { this._entries = []; this._chart = null; } // [{ period, text }, ...]
    attached(param) { this._chart = param.chart; }
    updateAllViews() {}
    paneViews() {
      const self = this;
      return [{
        renderer() {
          return {
            draw(target) {
              if (!self._chart || self._entries.length === 0) return;
              target.useBitmapCoordinateSpace(scope => {
                const ctx = scope.context;
                const ts = self._chart.timeScale();
                ctx.fillStyle = '#ff9800'; // orange
                ctx.font = `${12 * scope.verticalPixelRatio}px sans-serif`;
                ctx.textBaseline = 'middle';
                self._entries.forEach(({ period, text }) => {
                  const pt = smaLastPoint[period];
                  if (!pt) return;
                  const x = ts.timeToCoordinate(pt.time);
                  const y = candleSeries.priceToCoordinate(pt.value);
                  if (x == null || y == null) return;
                  ctx.fillText(text, x * scope.horizontalPixelRatio + 4, y * scope.verticalPixelRatio);
                });
              });
            }
          };
        }
      }];
    }
  }

  const pisoTechoAutoLabelPrimitive = new PisoTechoAutoLabelPrimitive();
  let pisoTechoAutoLabelAttached = false;

  // Green hint lines overlaid at the bottom of the chart itself (not a WinForms Label docked
  // below it) — so an empty hint reserves no layout space and every panel stays the same height
  // regardless of which hints are active. Called by ChartPanel via ExecuteScriptAsync.
  function setTLineHint(text) { document.getElementById('hintTLine').textContent = text || ''; }
  function setDailyBounceHint(text) { document.getElementById('hintDailyBounce').textContent = text || ''; }

  // Premarket Bollinger-exposure banner — shown when C# (MultiChartForm) determines the premarket
  // price broke the SAME side of the Bollinger band (upper or lower) on Daily, 1h, AND 15m RTH
  // simultaneously. Re-evaluated on every premarket tick, so hideExposureBanner is called just as
  // often once the condition stops holding.
  function showExposureBanner(text) {
    const el = document.getElementById('exposureBanner');
    el.textContent = text;
    el.style.display = 'block';
  }
  function hideExposureBanner() {
    document.getElementById('exposureBanner').style.display = 'none';
  }

  // Called once per SMA pair by C# after the pre-market read (see ChartPanel's one-time
  // analysis) — periodA/periodB identify which pair (20+40 or 100+200). textA/textB are each
  // independently 'Piso', 'Techo', or null (no signal for THAT specific SMA — e.g. price opened
  // between the two, so only the slower one still counts) — no longer forced to match each other.
  // Safe to call again on every Live Chart reopen with the SAME remembered text — it just
  // re-renders, the position always comes from smaLastPoint at draw time.
  function markPisoTecho(periodA, textA, periodB, textB) {
    if (!pisoTechoAutoLabelAttached) { candleSeries.attachPrimitive(pisoTechoAutoLabelPrimitive); pisoTechoAutoLabelAttached = true; }
    pisoTechoAutoLabelPrimitive._entries = pisoTechoAutoLabelPrimitive._entries.filter(e => e.period !== periodA && e.period !== periodB);
    if (textA) pisoTechoAutoLabelPrimitive._entries.push({ period: periodA, text: textA });
    if (textB) pisoTechoAutoLabelPrimitive._entries.push({ period: periodB, text: textB });
    forceRepaint();
  }

  // Called by C# (ValidatePisoTechoAgainstOpen) when the actual market-open price already broke
  // a single SMA's Piso/Techo label — removes just that one period's entry, leaving the other
  // SMA of the pair (if any) untouched.
  function removePisoTechoLabel(period) {
    pisoTechoAutoLabelPrimitive._entries = pisoTechoAutoLabelPrimitive._entries.filter(e => e.period !== period);
    forceRepaint();
  }

  // Programmatic (not click-driven) red "Expired!!!" marker — fixed at the top-center of the
  // chart pane (see TextLabelsPrimitive's fixedTop handling), triggered from C# when a trade
  // auto-closes at 4pm ET because it expired today. Not anchored to price/time, so it stays
  // readable regardless of where the last candle happens to sit.
  function markExpired() {
    if (!textLabelsAttached) { candleSeries.attachPrimitive(textLabelsPrimitive); textLabelsAttached = true; }
    if (allCandles.length === 0) return false;
    textLabelsPrimitive._labels.push({ text: 'Expired!!!', color: '#ff0000', bold: true, fixedTop: true });
    forceRepaint();
    return true;
  }

  // "PM" (Punto Medio / SMA20 slope) live indicator — 1h and 15m RTH panels only, updated on every
  // live tick from C# (EvaluatePuntoMedioSlope). Green when the SMA20 is tilting up, red when
  // tilting down. Unlike markExpired's one-shot label, this REPLACES its own previous entry each
  // call instead of accumulating — only ever one "PM" label showing at a time.
  // `large` (set by MultiChartForm when BOTH panels' PM currently agree) bumps the font size —
  // otherwise same normal size as any other bold fixed label.
  function updatePuntoMedio(bullish, large) {
    if (!textLabelsAttached) { candleSeries.attachPrimitive(textLabelsPrimitive); textLabelsAttached = true; }
    textLabelsPrimitive._labels = textLabelsPrimitive._labels.filter(l => l.id !== 'pm');
    textLabelsPrimitive._labels.push({
      id: 'pm', text: 'PM', color: bullish ? '#4caf50' : '#ef5350', bold: true, fixedBottom: true,
      fontSize: large ? 20 : 14
    });
    forceRepaint();
  }

  // "1er Rebote: 90%" — 1h panel only, bottom-right, yellow. Shown while SMA20 and SMA40 are both
  // Techo and SMA20 hasn't been touched/resolved yet (see ChartPanel.EvaluateFirstReboundLabel).
  // Same replace-not-accumulate pattern as updatePuntoMedio.
  function updateFirstRebound(show) {
    if (!textLabelsAttached) { candleSeries.attachPrimitive(textLabelsPrimitive); textLabelsAttached = true; }
    textLabelsPrimitive._labels = textLabelsPrimitive._labels.filter(l => l.id !== 'firstRebound');
    if (show) {
      textLabelsPrimitive._labels.push({
        id: 'firstRebound', text: '1er Rebote: 90%', color: '#ffeb3b', bold: true, fixedBottomRight: true
      });
    }
    forceRepaint();
  }

  // ---- Strike marker: full-width green line + "Stk=xxx" label, drawn programmatically when a
  // trade (demo or real) opens — see markStrike below. Accumulates, one per trade, never removed
  // automatically (stays as a historical reference even after the trade closes). ----

  class StrikeLinesPrimitive {
    constructor() { this._lines = []; this._chart = null; } // [{ time, price, label, selected }, ...]
    attached(param) { this._chart = param.chart; }
    updateAllViews() {}
    paneViews() {
      const self = this;
      return [{
        renderer() {
          return {
            draw(target) {
              if (!self._chart) return;
              target.useBitmapCoordinateSpace(scope => {
                const ctx = scope.context;
                const ts = self._chart.timeScale();
                self._lines.forEach(l => {
                  const y = candleSeries.priceToCoordinate(l.price);
                  // xRaw is null once the entry candle scrolls out of the loaded range (e.g. a
                  // multi-day context) — start from the left edge instead of skipping the line.
                  const xRaw = ts.timeToCoordinate(l.time);
                  const x = xRaw == null ? 0 : xRaw;
                  if (y == null) return;
                  ctx.strokeStyle = '#00c853'; // green
                  ctx.lineWidth = 2 * scope.horizontalPixelRatio;
                  ctx.beginPath();
                  ctx.moveTo(x * scope.horizontalPixelRatio, y * scope.verticalPixelRatio);
                  ctx.lineTo(scope.bitmapSize.width, y * scope.verticalPixelRatio);
                  ctx.stroke();

                  ctx.fillStyle = '#00c853';
                  ctx.font = `bold ${12 * scope.verticalPixelRatio}px sans-serif`;
                  ctx.textBaseline = 'bottom';
                  ctx.textAlign = 'right';
                  ctx.fillText(l.label, scope.bitmapSize.width - 4, y * scope.verticalPixelRatio - 2);
                  ctx.textAlign = 'left'; // reset — other primitives assume the default

                  if (l.selected) {
                    ctx.save();
                    ctx.strokeStyle = '#ffeb3b';
                    ctx.lineWidth = 2 * scope.horizontalPixelRatio;
                    ctx.setLineDash([6 * scope.horizontalPixelRatio, 4 * scope.horizontalPixelRatio]);
                    ctx.beginPath();
                    ctx.moveTo(x * scope.horizontalPixelRatio, y * scope.verticalPixelRatio + 3 * scope.verticalPixelRatio);
                    ctx.lineTo(scope.bitmapSize.width, y * scope.verticalPixelRatio + 3 * scope.verticalPixelRatio);
                    ctx.stroke();
                    ctx.restore();
                  }
                });
              });
            }
          };
        }
      }];
    }
  }

  const strikeLinesPrimitive = new StrikeLinesPrimitive();
  let strikeLinesAttached = false;

  // Anchors at the LAST candle currently loaded (i.e. "now", the moment the trade opened) instead
  // of the left edge — same "current candle to the right edge" convention as the H-Line tool.
  // label is optional — defaults to "Stk={price}"; TimeframeViewerForm's "5 OTM strikes on
  // rebote" feature passes a custom "Stk={price}   Ask={ask}" label instead.
  function markStrike(price, label) {
    if (!strikeLinesAttached) { candleSeries.attachPrimitive(strikeLinesPrimitive); strikeLinesAttached = true; }
    if (allCandles.length === 0) return;
    const anchorTime = allCandles[allCandles.length - 1].time;
    strikeLinesPrimitive._lines.push({ time: anchorTime, price, label: label || `Stk=${price}`, selected: false });
    forceRepaint();
  }

  // Called by C# to remove a Stk line pushed here as the ECHO of a deletion that happened on a
  // SIBLING panel (see the 'strike_delete' postMessage in the keydown handler below) — no
  // postMessage sent back out from here, so the 3 panels don't ping-pong the same delete forever.
  function removeStrikeLine(price) {
    strikeLinesPrimitive._lines = strikeLinesPrimitive._lines.filter(l => l.price !== price);
    forceRepaint();
  }

  // Appends text to an existing Stk line's label in place (doesn't remove/redraw the line) — used
  // by TimeframeViewerForm to add "   Bid=xxx" to the "Stk=xxx   Ask=xxx" label once the SpotPrice
  // cross confirms, keeping the original line exactly where it was.
  function appendStrikeLineLabel(price, extraText) {
    strikeLinesPrimitive._lines.forEach(l => { if (l.price === price) l.label += extraText; });
    forceRepaint();
  }

  // Returns the index of the Stk line (full-width, click point -> right edge, same shape as
  // H-Line) within a few pixels of (px,py), or -1.
  function findStrikeLineByClick(px, py) {
    const ts = chart.timeScale();
    const tolerance = 6;
    for (let i = strikeLinesPrimitive._lines.length - 1; i >= 0; i--) {
      const l = strikeLinesPrimitive._lines[i];
      const xRaw = ts.timeToCoordinate(l.time);
      const x = xRaw == null ? 0 : xRaw;
      const y = candleSeries.priceToCoordinate(l.price);
      if (y == null) continue;
      if (distToSegment(px, py, x, y, chart.timeScale().width(), y) <= tolerance) return i;
    }
    return -1;
  }

  // ---- "ΔS=value" label at trade close — own dedicated primitive (not TextLabelsPrimitive,
  // which has no selection) so it can be click-selected and removed with Delete, same as the
  // other drawing tools. value is the absolute move of the underlying between entry and close (no
  // sign, magnitude only). Δ is the actual Greek delta character (a triangle), per request,
  // instead of spelling out "Delta". Anchored at the trade's STRIKE price (same y as its green
  // "Stk=xxx" line) and drawn right-aligned at the right edge, just BELOW that line — mirrors
  // StrikeLinesPrimitive's own label, which sits just above it. ----

  class DeltaSPrimitive {
    constructor() { this._labels = []; this._chart = null; } // [{ price, text, selected }, ...]
    attached(param) { this._chart = param.chart; }
    updateAllViews() {}
    paneViews() {
      const self = this;
      return [{
        renderer() {
          return {
            draw(target) {
              if (!self._chart) return;
              target.useBitmapCoordinateSpace(scope => {
                const ctx = scope.context;
                self._labels.forEach(l => {
                  const y = candleSeries.priceToCoordinate(l.price);
                  if (y == null) return;

                  ctx.font = `bold ${12 * scope.verticalPixelRatio}px sans-serif`;
                  ctx.textBaseline = 'top';
                  ctx.textAlign = 'right';
                  const textX = scope.bitmapSize.width - 4 * scope.horizontalPixelRatio;
                  const textY = y * scope.verticalPixelRatio + 2 * scope.verticalPixelRatio;

                  if (l.selected) {
                    const width = ctx.measureText(l.text).width;
                    const height = 14 * scope.verticalPixelRatio;
                    ctx.save();
                    ctx.strokeStyle = '#ffeb3b';
                    ctx.setLineDash([6 * scope.horizontalPixelRatio, 4 * scope.horizontalPixelRatio]);
                    ctx.strokeRect(textX - width - 2, textY - 2, width + 4, height + 4);
                    ctx.restore();
                  }

                  ctx.fillStyle = '#ffeb3b';
                  ctx.fillText(l.text, textX, textY);
                  ctx.textAlign = 'left';
                });
              });
            }
          };
        }
      }];
    }
  }

  const deltaSPrimitive = new DeltaSPrimitive();
  let deltaSAttached = false;

  function markDeltaS(entrySpot, closeSpot, strike) {
    if (!deltaSAttached) { candleSeries.attachPrimitive(deltaSPrimitive); deltaSAttached = true; }
    const delta = Math.abs(closeSpot - entrySpot);
    deltaSPrimitive._labels.push({ price: strike, text: `ΔS=${delta.toFixed(2)}`, selected: false });
    forceRepaint();
  }

  // Approximate CSS-pixel hit box for a right-aligned ΔS label (no exact ctx.measureText
  // available outside the bitmap draw() context) — same tolerance-based approach as the other
  // click hit-tests in this file.
  function findDeltaSByClick(px, py) {
    const chartWidthCss = chart.timeScale().width();
    const tolerance = 4;
    for (let i = deltaSPrimitive._labels.length - 1; i >= 0; i--) {
      const l = deltaSPrimitive._labels[i];
      const y = candleSeries.priceToCoordinate(l.price);
      if (y == null) continue;
      const approxWidth = l.text.length * 7 + 8;
      if (px >= chartWidthCss - 4 - approxWidth - tolerance && px <= chartWidthCss + tolerance &&
          py >= y + 2 - tolerance && py <= y + 2 + 14 + tolerance) {
        return i;
      }
    }
    return -1;
  }

  // ---- Piso/Techo reference line (15m RTH / 15m RTH+Overnight panels only) — dashed horizontal
  // line at a Piso/Techo SMA's pre-market level, same color as that SMA on the 1h panel
  // (smaColors), so it's visible on the RTH charts as "how far price could go and bounce" without
  // needing the 1h panel open. Drawn once pre-market by ChartPanel (1h) pushing the value here via
  // MultiChartForm, removed either by the user (click + Delete, same as every other tool) or
  // automatically if the market-open gap invalidates that SMA's Piso/Techo (removePisoTechoRefLine,
  // called from ChartPanel.ValidatePisoTechoAgainstOpen). Anchored at the last loaded candle (same
