<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #131722; overflow: hidden; }
  #chart { width: 100%; height: 100%; position: relative; }
</style>
<script src="lightweight-charts.js"></script>
</head>
<body>
<div id="chart"></div>
<script>
  const container = document.getElementById('chart');

  const chart = LightweightCharts.createChart(container, {
    width: container.clientWidth,
    height: container.clientHeight,
    layout: {
      background: { color: '#131722' },
      textColor: '#d1d4dc',
    },
    grid: {
      vertLines: { color: '#1f2530' },
      horzLines: { color: '#1f2530' },
    },
    timeScale: {
      timeVisible: true,
      secondsVisible: false,
      borderColor: '#2a2e39',
      rightOffset: 3, // leaves room for ~3 empty candles to the right, so the latest one isn't jammed against the edge
    },
    rightPriceScale: {
      borderColor: '#2a2e39',
    },
    crosshair: {
      mode: LightweightCharts.CrosshairMode.Normal,
    },
  });

  const candleSeries = chart.addCandlestickSeries({
    upColor: '#26a69a',
    downColor: '#ef5350',
    borderVisible: false,
    wickUpColor: '#26a69a',
    wickDownColor: '#ef5350',
    // Keeps the current price roughly centered vertically: instead of Lightweight Charts'
    // default autoscale (which just fits min/max of the visible candles), force a price range
    // symmetric around the LAST close — same margin above and below it, sized to whichever side
    // needs more room to fit the visible data.
    autoscaleInfoProvider: original => {
      const res = original();
      if (!res || !res.priceRange || allCandles.length === 0) return res;
      const lastClose = allCandles[allCandles.length - 1].close;
      const { minValue, maxValue } = res.priceRange;
      const halfRange = Math.max(maxValue - lastClose, lastClose - minValue);
      if (!(halfRange > 0)) return res;
      return { priceRange: { minValue: lastClose - halfRange, maxValue: lastClose + halfRange } };
    },
  });

  window.addEventListener('resize', () => {
    chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
  });

  // ---- Default visible time window (optional — set via configurarDiasVisibles) ----
  // Historical data is always loaded in full (SMA/Bollinger need the full lookback), but the
  // chart's initial zoom only shows the most recent N calendar days by default — the user can
  // still scroll/zoom out manually to see more.
  let diasVisibles = null;
  function configurarDiasVisibles(dias) { diasVisibles = dias; }

  function aplicarRangoVisible() {
    if (!diasVisibles || allCandles.length === 0) return;
    const dayStart = t => {
      const d = new Date(t * 1000);
      return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) / 1000;
    };
    const days = [...new Set(allCandles.map(c => dayStart(c.time)))].sort((a, b) => a - b);
    if (days.length === 0) return;
    const cutoffIdx = Math.max(0, days.length - diasVisibles);

    // setVisibleRange is an EXACT range — it overrides timeScale.rightOffset's usual empty-space
    // margin, so the last candle would sit flush against the edge. Pad "to" by ~3 bars' worth of
    // time ourselves (bar spacing taken from the last two candles) to leave that same margin.
    const barDuration = allCandles.length > 1
      ? allCandles[allCandles.length - 1].time - allCandles[allCandles.length - 2].time
      : 900;
    chart.timeScale().setVisibleRange({
      from: days[cutoffIdx],
      to: allCandles[allCandles.length - 1].time + barDuration * 3,
    });
  }

  // ---- DZ/SZ (Demand Zone / Supply Zone) partial lines ----
  // activarDZSZ() arms the next 2 clicks: first click -> green line (Demand Zone) from the click
  // point to the right edge, second click -> red line (Supply Zone), same. The price value shows
  // on the right axis (no text label). createPriceLine always spans the FULL width, so it's only
  // used here for the axis label (lineVisible:false); the visible line segment itself is drawn by
  // a custom primitive anchored to the clicked time, so it stays correct across pan/zoom.
  // Every activation ADDS a new pair — previous ones are kept, not replaced.
  let dzSzArmed = false;
  let dzSzNextIsSupply = false; // false = next click draws Demand (green), true = Supply (red)
  const dzSzAxisLabels = []; // all createPriceLine handles, one per drawn line
  let dzSzAttached = false;

  class ZoneLinesPrimitive {
    constructor() { this._segments = []; this._chart = null; } // [{ time, price, color }, ...] — pairs at (2i, 2i+1) = (demand, supply)
    attached(param) { this._chart = param.chart; }
    updateAllViews() {}
    paneViews() {
      const self = this;
      return [{
        renderer() {
          return {
            draw(target) {
              if (!self._chart) return;
              target.useBitmapCoordinateSpace(scope => {
                const ctx = scope.context;
                const ts = self._chart.timeScale();

                // Fill between each completed demand/supply pair — light red if supply (2nd
                // click) ended up above demand, light green if demand ended up above supply.
                for (let i = 0; i + 1 < self._segments.length; i += 2) {
                  const demand = self._segments[i];
                  const supply = self._segments[i + 1];
                  const xd = ts.timeToCoordinate(demand.time);
                  const xs = ts.timeToCoordinate(supply.time);
                  const yd = candleSeries.priceToCoordinate(demand.price);
                  const ys = candleSeries.priceToCoordinate(supply.price);
                  if (xd == null || xs == null || yd == null || ys == null) continue;

                  const left   = Math.max(xd, xs) * scope.horizontalPixelRatio;
                  const top    = Math.min(yd, ys) * scope.verticalPixelRatio;
                  const bottom = Math.max(yd, ys) * scope.verticalPixelRatio;
                  ctx.fillStyle = supply.price > demand.price
                    ? 'rgba(239, 83, 80, 0.15)'   // supply above demand -> light red
                    : 'rgba(38, 166, 154, 0.15)'; // demand above supply -> light green
                  ctx.fillRect(left, top, scope.bitmapSize.width - left, bottom - top);
                }

                self._segments.forEach(seg => {
                  const x = ts.timeToCoordinate(seg.time);
                  const y = candleSeries.priceToCoordinate(seg.price);
                  if (x == null || y == null) return;
                  ctx.strokeStyle = seg.color;
                  ctx.lineWidth = 2 * scope.horizontalPixelRatio;
                  ctx.beginPath();
                  ctx.moveTo(x * scope.horizontalPixelRatio, y * scope.verticalPixelRatio);
                  ctx.lineTo(scope.bitmapSize.width, y * scope.verticalPixelRatio);
                  ctx.stroke();
                });
              });
            }
          };
        }
      }];
    }
  }

  const zoneLinesPrimitive = new ZoneLinesPrimitive();

  // Toggle: one click on the button turns drawing mode ON — every 2 clicks on the chart from then
  // on draws a new demand+supply pair, forever, until the button is pressed again to turn it OFF.
  function activarDZSZ() {
    if (!dzSzAttached) { candleSeries.attachPrimitive(zoneLinesPrimitive); dzSzAttached = true; }
    dzSzArmed = !dzSzArmed;
    dzSzNextIsSupply = false;
    return dzSzArmed;
  }

  // ---- Rect tool: sky-blue rectangle between 2 clicks (opposite corners, no value labels) ----

  class RectanglesPrimitive {
    constructor() { this._rects = []; this._preview = null; this._chart = null; } // [{ t1, p1, t2, p2 }, ...]
    attached(param) { this._chart = param.chart; }
    updateAllViews() {}
    paneViews() {
      const self = this;
      return [{
        renderer() {
          return {
            draw(target) {
              if (!self._chart) return;
              target.useBitmapCoordinateSpace(scope => {
                const ctx = scope.context;
                const ts = self._chart.timeScale();
                const drawRect = (r, alpha) => {
                  const x1 = ts.timeToCoordinate(r.t1);
                  const x2 = ts.timeToCoordinate(r.t2);
                  const y1 = candleSeries.priceToCoordinate(r.p1);
                  const y2 = candleSeries.priceToCoordinate(r.p2);
                  if (x1 == null || x2 == null || y1 == null || y2 == null) return;
                  const left  = Math.min(x1, x2) * scope.horizontalPixelRatio;
                  const right = Math.max(x1, x2) * scope.horizontalPixelRatio;
                  const top    = Math.min(y1, y2) * scope.verticalPixelRatio;
                  const bottom = Math.max(y1, y2) * scope.verticalPixelRatio;
                  ctx.fillStyle = `rgba(135, 206, 235, ${alpha})`; // sky blue
                  ctx.fillRect(left, top, right - left, bottom - top);
                };
                self._rects.forEach(r => drawRect(r, 0.35));
                if (self._preview) drawRect(self._preview, 0.18); // lighter while still dragging
              });
            }
          };
        }
      }];
    }
  }

  const rectanglesPrimitive = new RectanglesPrimitive();
  let rectAttached = false;
  let rectArmed = false;
  let rectPending = null; // { time, price } of the first click of the current rectangle

  // Same toggle pattern as DZ/SZ: one click arms it, every 2 chart clicks draws a new rectangle,
  // forever, until pressed again to disarm.
  function activarRect() {
    if (!rectAttached) { candleSeries.attachPrimitive(rectanglesPrimitive); rectAttached = true; }
    rectArmed = !rectArmed;
    rectPending = null;
    return rectArmed;
  }

  function limpiarDibujos() {
    zoneLinesPrimitive._segments = [];
    dzSzAxisLabels.forEach(l => candleSeries.removePriceLine(l));
    dzSzAxisLabels.length = 0;
    dzSzArmed = false;
    dzSzNextIsSupply = false;

    rectanglesPrimitive._rects = [];
    rectanglesPrimitive._preview = null;
    rectArmed = false;
    rectPending = null;

    tLinePrimitive._lines = [];
    tLinePrimitive._preview = null;
    tLineArmed = false;
    tLinePending = null;

    hLinePrimitive._segments = [];
    hLineArmed = false;

    forceRepaint();
  }

  // Primitives don't repaint just because their backing data changed — only on an actual chart
  // interaction/data update. This no-op options change forces one without altering anything visible.
  function forceRepaint() {
    candleSeries.applyOptions({});
  }

  chart.subscribeClick(param => {
    if (!param.point || param.time === undefined) return;
    const price = candleSeries.coordinateToPrice(param.point.y);
    if (price == null) return;

    if (dzSzArmed) {
      const color = dzSzNextIsSupply ? '#ef5350' : '#26a69a';

      zoneLinesPrimitive._segments.push({ time: param.time, price, color });

      dzSzAxisLabels.push(candleSeries.createPriceLine({
        price, color, lineWidth: 1, lineVisible: false, axisLabelVisible: true, title: '',
      }));

      dzSzNextIsSupply = !dzSzNextIsSupply;
    }

    if (rectArmed) {
      if (!rectPending) {
        rectPending = { time: param.time, price };
      } else {
        rectanglesPrimitive._rects.push({ t1: rectPending.time, p1: rectPending.price, t2: param.time, p2: price });
        rectanglesPrimitive._preview = null;
        rectPending = null;
        forceRepaint();
      }
    }

    if (tLineArmed) {
      if (!tLinePending) {
        tLinePending = { time: param.time, price };
      } else {
        tLinePrimitive._lines.push({ t1: tLinePending.time, p1: tLinePending.price, t2: param.time, p2: price });
        tLinePrimitive._preview = null;
        tLinePending = null;
        forceRepaint();
      }
    }

    if (hLineArmed) {
      hLinePrimitive._segments.push({ time: param.time, price });
      forceRepaint();
    }
  });

  // Live preview of the rectangle/T-Line while the mouse moves between the 1st and 2nd click.
  chart.subscribeCrosshairMove(param => {
    if (!rectArmed || !rectPending) {
      if (rectanglesPrimitive._preview) { rectanglesPrimitive._preview = null; forceRepaint(); }
    } else if (param.point && param.time !== undefined) {
      const price = candleSeries.coordinateToPrice(param.point.y);
      if (price != null) {
        rectanglesPrimitive._preview = { t1: rectPending.time, p1: rectPending.price, t2: param.time, p2: price };
        forceRepaint();
      }
    }

    if (!tLineArmed || !tLinePending) {
      if (tLinePrimitive._preview) { tLinePrimitive._preview = null; forceRepaint(); }
    } else if (param.point && param.time !== undefined) {
      const price = candleSeries.coordinateToPrice(param.point.y);
      if (price != null) {
        tLinePrimitive._preview = { t1: tLinePending.time, p1: tLinePending.price, t2: param.time, p2: price };
        forceRepaint();
      }
    }
  });

  // ---- T-Line tool: orange line segment between 2 clicks (not extended to the edges) ----

  class TLinePrimitive {
    constructor() { this._lines = []; this._preview = null; this._chart = null; } // [{ t1, p1, t2, p2 }, ...]
    attached(param) { this._chart = param.chart; }
    updateAllViews() {}
    paneViews() {
      const self = this;
      return [{
        renderer() {
          return {
            draw(target) {
              if (!self._chart) return;
              target.useBitmapCoordinateSpace(scope => {
                const ctx = scope.context;
                const ts = self._chart.timeScale();
                const drawLine = (l, alpha) => {
                  const x1 = ts.timeToCoordinate(l.t1);
                  const x2 = ts.timeToCoordinate(l.t2);
                  const y1 = candleSeries.priceToCoordinate(l.p1);
                  const y2 = candleSeries.priceToCoordinate(l.p2);
                  if (x1 == null || x2 == null || y1 == null || y2 == null) return;
                  ctx.strokeStyle = `rgba(255, 152, 0, ${alpha})`; // orange
                  ctx.lineWidth = 2 * scope.horizontalPixelRatio;
                  ctx.beginPath();
                  ctx.moveTo(x1 * scope.horizontalPixelRatio, y1 * scope.verticalPixelRatio);
                  ctx.lineTo(x2 * scope.horizontalPixelRatio, y2 * scope.verticalPixelRatio);
                  ctx.stroke();
                };
                self._lines.forEach(l => drawLine(l, 1));
                if (self._preview) drawLine(self._preview, 0.6);
              });
            }
          };
        }
      }];
    }
  }

  const tLinePrimitive = new TLinePrimitive();
  let tLineAttached = false;
  let tLineArmed = false;
  let tLinePending = null; // { time, price } of the first click of the current segment

  function activarTLine() {
    if (!tLineAttached) { candleSeries.attachPrimitive(tLinePrimitive); tLineAttached = true; }
    tLineArmed = !tLineArmed;
    tLinePending = null;
    return tLineArmed;
  }

  // ---- H-Line tool: red line from the click point to the right edge of the chart ----

  class HLinePrimitive {
    constructor() { this._segments = []; this._chart = null; } // [{ time, price }, ...]
    attached(param) { this._chart = param.chart; }
    updateAllViews() {}
    paneViews() {
      const self = this;
      return [{
        renderer() {
          return {
            draw(target) {
              if (!self._chart) return;
              target.useBitmapCoordinateSpace(scope => {
                const ctx = scope.context;
                const ts = self._chart.timeScale();
                self._segments.forEach(seg => {
                  const x = ts.timeToCoordinate(seg.time);
                  const y = candleSeries.priceToCoordinate(seg.price);
                  if (x == null || y == null) return;
                  ctx.strokeStyle = '#ef5350'; // red
                  ctx.lineWidth = 2 * scope.horizontalPixelRatio;
                  ctx.beginPath();
                  ctx.moveTo(x * scope.horizontalPixelRatio, y * scope.verticalPixelRatio);
                  ctx.lineTo(scope.bitmapSize.width, y * scope.verticalPixelRatio);
                  ctx.stroke();
                });
              });
            }
          };
        }
      }];
    }
  }

  const hLinePrimitive = new HLinePrimitive();
  let hLineAttached = false;
  let hLineArmed = false;

  function activarHLine() {
    if (!hLineAttached) { candleSeries.attachPrimitive(hLinePrimitive); hLineAttached = true; }
    hLineArmed = !hLineArmed;
    return hLineArmed;
  }

  // ---- SMA overlay (optional — only enabled on panels that call configurarSMAs) ----

  let allCandles = [];           // mirrors what's on the candle series, kept sorted by time
  let smaSeries = {};            // period -> LineSeries
  let smaPeriods = [];

  const smaColors = { 20: '#f5a623', 40: '#ef5350', 100: '#26a69a', 200: '#a259ff' };
  const smaWidths = { 20: 1, 40: 1, 100: 2, 200: 2 };

  function configurarSMAs(periodos) {
    periodos.forEach(p => {
      if (!smaSeries[p]) {
        smaSeries[p] = chart.addLineSeries({
          color: smaColors[p] || '#888888',
          lineWidth: smaWidths[p] || 1,
          priceLineVisible: false,
          lastValueVisible: false,
        });
      }
    });
    smaPeriods = periodos;
    recalcularSMAs();
  }

  function recalcularSMAs() {
    smaPeriods.forEach(p => {
      if (allCandles.length < p) { smaSeries[p].setData([]); return; }
      const data = [];
      let sum = 0;
      for (let i = 0; i < allCandles.length; i++) {
        sum += allCandles[i].close;
        if (i >= p) sum -= allCandles[i - p].close;
        if (i >= p - 1) data.push({ time: allCandles[i].time, value: sum / p });
      }
      smaSeries[p].setData(data);
    });
  }

  function upsertCandle(vela) {
    const idx = allCandles.findIndex(c => c.time === vela.time);
    if (idx >= 0) allCandles[idx] = vela;
    else allCandles.push(vela);
  }

  // ---- Bollinger Bands overlay (optional — only enabled on panels that call configurarBollinger) ----

  let bollingerConfig = null; // { period, mult }
  let bollingerSeries = null; // { upper, middle, lower }

  function configurarBollinger(periodo, desviaciones) {
    bollingerConfig = { period: periodo, mult: desviaciones };
    if (!bollingerSeries) {
      const opts = { lineWidth: 1, priceLineVisible: false, lastValueVisible: false };
      bollingerSeries = {
        upper:  chart.addLineSeries({ ...opts, color: '#787b86' }),
        middle: chart.addLineSeries({ ...opts, color: '#787b86', lineStyle: LightweightCharts.LineStyle.Dashed }),
        lower:  chart.addLineSeries({ ...opts, color: '#787b86' }),
      };
    }
    recalcularBollinger();
  }

  function recalcularBollinger() {
    if (!bollingerConfig || !bollingerSeries) return;
    const { period: p, mult } = bollingerConfig;
    if (allCandles.length < p) {
      bollingerSeries.upper.setData([]);
      bollingerSeries.middle.setData([]);
      bollingerSeries.lower.setData([]);
      return;
    }
    const upperData = [], midData = [], lowerData = [];
    for (let i = p - 1; i < allCandles.length; i++) {
      let sum = 0;
      for (let j = i - p + 1; j <= i; j++) sum += allCandles[j].close;
      const mean = sum / p;
      let variance = 0;
      for (let j = i - p + 1; j <= i; j++) variance += Math.pow(allCandles[j].close - mean, 2);
      const stdDev = Math.sqrt(variance / p);
      const t = allCandles[i].time;
      upperData.push({ time: t, value: mean + mult * stdDev });
      midData.push({ time: t, value: mean });
      lowerData.push({ time: t, value: mean - mult * stdDev });
    }
    bollingerSeries.upper.setData(upperData);
    bollingerSeries.middle.setData(midData);
    bollingerSeries.lower.setData(lowerData);
  }

  // ---- Overnight shading (optional — only enabled on panels that call configurarOvernightBands) ----
  // Draws a gray rectangle behind the candles for each gap between one day's RTH close (4:00 PM
  // ET) and the next available day's RTH open (9:30 AM ET) — highlights overnight/weekend gaps,
  // like the reference screenshot. Uses the Series Primitives API (custom canvas overlay), since
  // Lightweight Charts has no built-in "shade this time range" feature.
  let overnightBandsEnabled = false;

  class OvernightBandsPrimitive {
    constructor() { this._bands = []; this._chart = null; }
    attached(param) { this._chart = param.chart; }
    updateAllViews() {}
    paneViews() {
      const self = this;
      return [{
        renderer() {
          return {
            draw(target) {
              if (!self._chart) return;
              target.useBitmapCoordinateSpace(scope => {
                const ctx = scope.context;
                const ts = self._chart.timeScale();
                ctx.fillStyle = 'rgba(150, 150, 150, 0.18)';
                self._bands.forEach(b => {
                  const x1 = ts.timeToCoordinate(b.from);
                  if (x1 == null) return;
                  // b.to can be a still-future time (the in-progress overnight band's end, before
                  // any candle at/after that point exists) — timeToCoordinate returns null for
                  // anything outside the currently visible range, so clip to the chart's right
                  // edge instead of silently skipping the whole band (same pattern H-Line uses).
                  const x2 = ts.timeToCoordinate(b.to);
                  const leftPx  = x1 * scope.horizontalPixelRatio;
                  const rightPx = x2 == null ? scope.bitmapSize.width : x2 * scope.horizontalPixelRatio;
                  const left  = Math.min(leftPx, rightPx);
                  const width = Math.abs(rightPx - leftPx);
                  ctx.fillRect(left, 0, width, scope.bitmapSize.height);
                });
              });
            }
          };
        }
      }];
    }
  }

  const overnightPrimitive = new OvernightBandsPrimitive();

  function configurarOvernightBands() {
    overnightBandsEnabled = true;
    candleSeries.attachPrimitive(overnightPrimitive);
    recalcularOvernightBands();
  }

  // Real current time, converted to the same "ET digits disguised as UTC" seconds scheme the
  // candle data uses (see ToChartJson in ChartPanel.cs), so it can be compared directly against
  // dayStart()/candle.time values.
  function nowAsFakeUtcSeconds() {
    const parts = new Intl.DateTimeFormat('en-US', {
      timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
    }).formatToParts(new Date());
    const get = type => parseInt(parts.find(p => p.type === type).value, 10);
    let hour = get('hour');
    if (hour === 24) hour = 0; // some locales report midnight as "24"
    return Date.UTC(get('year'), get('month') - 1, get('day'), hour, get('minute'), get('second')) / 1000;
  }

  // Next 9:30 AM (in the same "ET digits disguised as UTC" seconds as dayStart()/candle.time)
  // strictly after the given day-start, skipping Saturday/Sunday.
  function next930(dayStartSec) {
    let next = dayStartSec + 24 * 3600;
    let day = new Date(next * 1000).getUTCDay(); // 0=Sun, 6=Sat
    while (day === 0 || day === 6) {
      next += 24 * 3600;
      day = new Date(next * 1000).getUTCDay();
    }
    return next + 9.5 * 3600;
  }

  function recalcularOvernightBands() {
    if (!overnightBandsEnabled || allCandles.length === 0) return;

    // Each candle's "time" is already ET wall-clock digits disguised as UTC (see C# ToChartJson)
    // — read it back with the UTC getters to recover the real ET date/hour cheaply, no library.
    const dayStart = t => {
      const d = new Date(t * 1000);
      return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) / 1000;
    };

    const days = [...new Set(allCandles.map(c => dayStart(c.time)))].sort((a, b) => a - b);
    const bands = [];
    for (let i = 0; i < days.length - 1; i++) {
      bands.push({
        from: days[i] + 16 * 3600,        // 4:00 PM ET that day
        to:   days[i + 1] + 9.5 * 3600,   // 9:30 AM ET the next available day
      });
    }

    // The overnight session currently in progress (last day's close -> the next 9:30 AM RTH
    // open) has no "next day" candle yet, so the loop above never covers it — draw it up front
    // using the computed next session boundary instead of waiting for that candle to arrive.
    // Once real candles land there, the next redraw's day-pair loop takes over identically.
    //
    // Only add it once that day's session has ACTUALLY closed (real now >= that day's 4:00 PM
    // ET) — otherwise, as soon as the first candle of a new day arrives, this would immediately
    // shade a "closing gap" for that day stretching over the rest of TODAY's still-forming RTH
    // candles, hours before the market has even closed.
    const lastDay = days[days.length - 1];
    const lastClose = lastDay + 16 * 3600;
    if (nowAsFakeUtcSeconds() >= lastClose) {
      // Never start the shading earlier than the actual last plotted candle — whatever the
      // cause of a mismatch between the assumed 16:00 close and where real data actually ends
      // (DST edge case, a slightly-late last tick, etc.), this guarantees the band can't cover
      // real candles regardless.
      const lastCandleTime = allCandles[allCandles.length - 1].time;
      const from = Math.max(lastClose, lastCandleTime);
      bands.push({ from, to: next930(lastDay) });
    }

    overnightPrimitive._bands = bands;
  }

  // ---- Functions called from C# via WebView2.ExecuteScriptAsync ----

  // Replaces the whole dataset (used once at startup to seed historical candles).
  function cargarHistorial(velas) {
    allCandles = velas.slice().sort((a, b) => a.time - b.time);
    candleSeries.setData(allCandles);
    if (diasVisibles) aplicarRangoVisible(); else chart.timeScale().fitContent();
    recalcularSMAs();
    recalcularBollinger();
    recalcularOvernightBands();
  }

  // Updates the still-forming candle (same Time as the last one) without redrawing everything.
  function actualizarUltimaVela(vela) {
    upsertCandle(vela);
    candleSeries.update(vela);
    recalcularSMAs();
    recalcularBollinger();
    recalcularOvernightBands();
  }

  // A new candle period started — same call as update; Lightweight Charts appends automatically
  // when the Time is newer than the last point.
  function agregarVelaCompleta(vela) {
    upsertCandle(vela);
    candleSeries.update(vela);
    recalcularSMAs();
    recalcularBollinger();
    recalcularOvernightBands();
  }
</script>
</body>
</html>
