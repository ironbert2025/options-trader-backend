<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #131722; overflow: hidden; }
  #chart { width: 100%; height: 100%; position: relative; }
</style>
<script src="lightweight-charts.js"></script>
</head>
<body>
<div id="chart"></div>
<div id="hints" style="position:absolute; left:0; right:0; bottom:4px; text-align:center; pointer-events:none; z-index:5; font: 12px sans-serif; color:#3cd070;">
  <div id="hintTLine"></div>
  <div id="hintDailyBounce"></div>
</div>
<!-- Premarket Bollinger-exposure banner (15m RTH panel only) — see showExposureBanner/
     hideExposureBanner below. Plain overlay text, not a canvas primitive: no time/price anchor,
     no selection, just a static top-of-chart notice. -->
<div id="exposureBanner" style="position:absolute; left:0; right:0; top:4px; text-align:center; pointer-events:none; z-index:5; font: bold 13px sans-serif; color:#ffeb3b; display:none;"></div>
<script>
  const container = document.getElementById('chart');

  const chart = LightweightCharts.createChart(container, {
    width: container.clientWidth,
    height: container.clientHeight,
    layout: {
      background: { color: '#131722' },
      textColor: '#d1d4dc',
    },
    grid: {
      vertLines: { color: '#1f2530' },
      horzLines: { color: '#1f2530' },
    },
    timeScale: {
      timeVisible: true,
      secondsVisible: false,
      borderColor: '#2a2e39',
      rightOffset: 8, // leaves room for ~8 empty candles to the right, so today's candles have visible room to form
    },
    rightPriceScale: {
      borderColor: '#2a2e39',
    },
    crosshair: {
      mode: LightweightCharts.CrosshairMode.Normal,
    },
  });

  // timeScale().timeToCoordinate(t) can THROW (not just return null) for a time that doesn't land
  // on a loaded bar/business-day boundary — confirmed live (AAPL, Daily tab: a stale saved Rect's
  // time crashed inside the library's own convertHorzItemToInternal). Every custom primitive's
  // draw() below calls this every animation frame, so ANY one of them throwing uncaught silently
  // wedges the whole chart's rendering (candles keep drawing via a separate path, but SMA lines,
  // Bollinger, and every primitive attached AFTER the throwing one in the pane stop painting) —
  // this single wrapper replaces every direct safeTimeToCoordinate(ts, ...) call in the file so one bad
  // time can never take the rest of the chart down with it.
  function safeTimeToCoordinate(ts, t) {
    try { return ts.timeToCoordinate(t); } catch { return null; }
  }

  // Keeps the current price roughly centered vertically: instead of Lightweight Charts' default
  // autoscale (which just fits min/max of the visible candles), force a price range symmetric
  // around the LAST close — same margin above and below it, sized to whichever side needs more
  // room to fit the visible data.
  //
  // Computed directly from displaySeries() sliced to lastAppliedRange (the window WE last told the
  // chart to show — see applyVisibleRange), not from original()'s own priceRange — relying on
  // Lightweight Charts to have already re-scoped its autoscale to only the visible bars turned out
  // to be unreliable (e.g. right after toggling Daily mode, an old outlier bar far outside the
  // visible window was still leaking into the price range, blowing the chart out to a near-empty
  // box).
  // displaySeries(), so whichever one is actually visible reports the correct range regardless.
  function sharedAutoscaleInfoProvider(original) {
    const series = displaySeries();
    if (series.length === 0) return original();

    let visible = series;
    if (lastAppliedRange) {
      const from = Math.max(0, Math.floor(lastAppliedRange.from));
      const to = Math.min(series.length - 1, Math.ceil(lastAppliedRange.to));
      if (to >= from) visible = series.slice(from, to + 1);
    }
    if (visible.length === 0) return original();

    // Genuinely the most-recent bar's close, by time — not just series[series.length - 1], which
    // assumes the array is already correctly ordered (see aggregateToDaily's own note on why that
    // assumption isn't trusted anymore).
    const lastClose = series.reduce((a, b) => (b.time > a.time ? b : a)).close;
    let minValue = Infinity, maxValue = -Infinity;
    for (const c of visible) {
      if (c.low < minValue) minValue = c.low;
      if (c.high > maxValue) maxValue = c.high;
    }
    if (!(maxValue > minValue)) return original();

    const halfRange = Math.max(maxValue - lastClose, lastClose - minValue);
    if (!(halfRange > 0)) return original();
    return { priceRange: { minValue: lastClose - halfRange, maxValue: lastClose + halfRange } };
  }

  const candleSeriesOpts = {
    upColor: '#26a69a',
    downColor: '#ef5350',
    borderVisible: false,
    wickUpColor: '#26a69a',
    wickDownColor: '#ef5350',
    autoscaleInfoProvider: sharedAutoscaleInfoProvider,
    priceLineVisible: false, // built-in dashed "current price" line, disabled per explicit request
  };
  const candleSeries = chart.addCandlestickSeries(candleSeriesOpts);

  window.addEventListener('resize', () => {
    chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
  });

  // ---- Default visible time window (optional — set via configureVisibleDays) ----
  // Historical data is always loaded in full (SMA/Bollinger need the full lookback), but the
  // chart's initial zoom only shows the most recent N calendar days by default — the user can
  // still scroll/zoom out manually to see more.
  let visibleDays = null;
  function configureVisibleDays(days) { visibleDays = days; }

  // 15m RTH panel only, per explicit request: once today's RTH session has actually started, keep
  // a window whose LEFT edge is FIXED (today's first RTH bar, minus a bit of yesterday's context)
  // while the RIGHT edge grows with each new candle — so the frame doesn't slide as the day goes,
  // it just gradually reveals more of today until, by market close, exactly today's 26 candles
  // plus the configured amount of yesterday's context are visible (matching a manually-adjusted
  // end-of-day view). A pure trailing fixed-width window (the previous version here) kept
  // re-including MORE of yesterday relative to today early in the session and less as the day
  // wore on, changing composition every tick instead of just filling in left-to-right — confirmed
  // live (NFLX) looking visibly different mid-session vs. the same chart manually fit at end of
  // day. An even earlier attempt before that (reverted) re-fit tightly to "just today's candles
  // so far" every tick, which was worse — a handful of candles stretched to fill the whole pane,
  // extreme zoom-in early in the day. Before today's first RTH bar exists, this stays inactive and
  // the panel's normal visibleDays zoom applies, so a manual pre-market pan/zoom is left alone.
  const RTH_BARS_PER_DAY = 26; // 9:30-16:00 ET in 15-minute bars — fixed regardless of how busy the session was
  let rthSlideWindowBars = null;
  function configureRthSlideWindow(bars) { rthSlideWindowBars = bars; }

  // Panel 2's INITIAL zoom, before today's RTH session starts (computeRthSlideRange returns null
  // until then) — a fixed bar count instead of the calendar-day window other panels use, per
  // explicit request. Once RTH starts, rthSlideWindowBars above takes over.
  let initialBarCount = null;
  function configureInitialBarCount(bars) { initialBarCount = bars; }

  function computeRthSlideRange(series) {
    if (!rthSlideWindowBars || series.length === 0) return null;
    const last = series[series.length - 1];
    const lastDay = dayStartOf(last.time);
    const todayStartIdx = series.findIndex(c => dayStartOf(c.time) === lastDay && isRthTime(c.time));
    if (todayStartIdx === -1) return null; // today's RTH session hasn't started yet
    const contextBars = Math.max(0, rthSlideWindowBars - RTH_BARS_PER_DAY);
    const from = Math.max(0, todayStartIdx - contextBars);
    const to = series.length - 1;
    return { from, to };
  }

  // Tracks whether the user has manually changed the visible range (pan OR zoom) since we last
  // set it ourselves — once true, we stop touching their view entirely, forever (for this chart
  // instance). Comparing against "is the right edge still near now" isn't enough on its own: a
  // zoom-out to see more history still has its right edge near now, but must NOT get overridden.
  let userHasInteracted = false;
  let lastAppliedRange = null;

  // Logical (bar-index) range instead of a time range — setVisibleRange's exact "to" time, once
  // padded past the last real candle for the right-edge margin, gets silently clamped/rounded by
  // Lightweight Charts when it reports the range back through this same event, which made EVERY
  // reapply look like a user pan/zoom and permanently disable the margin the very first time it
  // was ever applied. Logical indices don't have that problem — "to" can cleanly point past the
  // last bar with no clamping.
  chart.timeScale().subscribeVisibleLogicalRangeChange(range => {
    if (userHasInteracted || !lastAppliedRange || !range) return;
    const matches = Math.abs(range.from - lastAppliedRange.from) < 0.5;
    if (!matches) userHasInteracted = true;
  });

  // Split out from applyVisibleRange so toggleDaily can update lastAppliedRange to the NEW
  // (dailyMode-aware) indices BEFORE calling renderCandles() — candleSeries.setData() triggers
  // Lightweight Charts' own autoscale/price-range computation immediately, synchronously, which
  // calls autoscaleInfoProvider using WHATEVER lastAppliedRange currently holds. Applying the range
  // only afterward (the old order) meant that first autoscale pass ran against the previous mode's
  // stale indices — logical positions that meant something for the ~1500-bar hourly array but not
  // for the much shorter daily one — and that bad price range stuck visually, since nothing forces
  // a second autoscale pass afterward.
  // isInitialLoad: true only for the very FIRST range applied to a freshly-opened chart — always
  // prefers initialBarCount (50) over the RTH slide window, even if RTH has already started by the
  // time the Live Chart is opened, per explicit request ("deben ser 50 velas cuando hago live
  // chart [aunque sea] en premarket [o ya en RTH]"). Every later reapply (new candle forming live)
  // passes false, letting the 36-bar slide window take over from there once RTH is under way.
  function computeVisibleRange(isInitialLoad) {
    const series = displaySeries();
    if (series.length === 0) return null;
    if (!isInitialLoad && rthSlideWindowBars) {
      const slideRange = computeRthSlideRange(series);
      if (slideRange) return slideRange;
    }
    if (initialBarCount) {
      const to = series.length - 1;
      const from = Math.max(0, to - (initialBarCount - 1));
      return { from, to };
    }
    if (!visibleDays) return null;
    const days = [...new Set(series.map(c => dayStartOf(c.time)))].sort((a, b) => a - b);
    if (days.length === 0) return null;
    const cutoffIdx = Math.max(0, days.length - visibleDays);
    const cutoffTime = days[cutoffIdx];
    const fromIdx = series.findIndex(c => c.time >= cutoffTime);
    // The right-edge margin (8 bars past the real last index) is skipped in Daily mode as a test —
    // suspected of breaking something internally when combined with a small array (~50 bars) and
    // from=0 (the whole array visible, no hidden portion to the left) — a combination that never
    // came up in Hourly mode (from is deep inside a ~1500-bar array there), where the padding is
    // confirmed working fine.
    const rightPad = dailyMode ? 0 : 8;
    return {
      from: fromIdx >= 0 ? fromIdx : 0,
      to: series.length - 1 + rightPad,
    };
  }

  function applyVisibleRange(isInitialLoad) {
    const range = computeVisibleRange(isInitialLoad);
    if (!range) return;
    lastAppliedRange = range;
    chart.timeScale().setVisibleLogicalRange(range);
  }

  // Reapplies the default range (refreshing the right-edge margin as new candles arrive) only if
  // the user hasn't manually panned/zoomed since the last time we set it — see userHasInteracted.
  function reapplyVisibleRangeIfLive() {
    if ((!visibleDays && !rthSlideWindowBars && !initialBarCount) || userHasInteracted) return;
    applyVisibleRange(false);
  }

  // ---- DZ/SZ (Demand Zone / Supply Zone) partial lines ----
  // toggleDzSz() arms the next 2 clicks: first click -> green line (Demand Zone) from the click
  // point to the right edge, second click -> red line (Supply Zone), same. The price value shows
  // on the right axis (no text label). createPriceLine always spans the FULL width, so it's only
  // used here for the axis label (lineVisible:false); the visible line segment itself is drawn by
  // a custom primitive anchored to the clicked time, so it stays correct across pan/zoom.
  // Every activation ADDS a new pair — previous ones are kept, not replaced.
  let dzSzArmed = false;
  let dzSzNextIsSupply = false; // false = next click draws Demand (green), true = Supply (red)
  const dzSzAxisLabels = []; // all createPriceLine handles, one per drawn line
  let dzSzAttached = false;

  class ZoneLinesPrimitive {
    constructor() { this._segments = []; this._chart = null; } // [{ time, price, color, selected }, ...] — pairs at (2i, 2i+1) = (demand, supply)
    attached(param) { this._chart = param.chart; }
    updateAllViews() {}
    paneViews() {
      const self = this;
      return [{
        renderer() {
          return {
            draw(target) {
              if (!self._chart) return;
              target.useBitmapCoordinateSpace(scope => {
                const ctx = scope.context;
                const ts = self._chart.timeScale();

                // Fill between each completed demand/supply pair — light red if supply (2nd
                // click) ended up above demand, light green if demand ended up above supply.
                for (let i = 0; i + 1 < self._segments.length; i += 2) {
                  const demand = self._segments[i];
                  const supply = self._segments[i + 1];
                  const xd = safeTimeToCoordinate(ts, demand.time);
                  const xs = safeTimeToCoordinate(ts, supply.time);
                  const yd = candleSeries.priceToCoordinate(demand.price);
                  const ys = candleSeries.priceToCoordinate(supply.price);
                  if (xd == null || xs == null || yd == null || ys == null) continue;

                  const left   = Math.max(xd, xs) * scope.horizontalPixelRatio;
                  const top    = Math.min(yd, ys) * scope.verticalPixelRatio;
                  const bottom = Math.max(yd, ys) * scope.verticalPixelRatio;
                  ctx.fillStyle = supply.price > demand.price
                    ? 'rgba(239, 83, 80, 0.15)'   // supply above demand -> light red
                    : 'rgba(38, 166, 154, 0.15)'; // demand above supply -> light green
                  ctx.fillRect(left, top, scope.bitmapSize.width - left, bottom - top);
                }

                self._segments.forEach(seg => {
                  const x = safeTimeToCoordinate(ts, seg.time);
                  const y = candleSeries.priceToCoordinate(seg.price);
                  if (x == null || y == null) return;
                  ctx.strokeStyle = seg.color;
                  ctx.lineWidth = 2 * scope.horizontalPixelRatio;
                  ctx.beginPath();
                  ctx.moveTo(x * scope.horizontalPixelRatio, y * scope.verticalPixelRatio);
                  ctx.lineTo(scope.bitmapSize.width, y * scope.verticalPixelRatio);
                  ctx.stroke();

                  // Selected = yellow dashed overlay, same convention as gray Rect/T-Line/H-Line.
                  if (seg.selected) {
                    ctx.save();
                    ctx.strokeStyle = '#ffeb3b';
                    ctx.setLineDash([6 * scope.horizontalPixelRatio, 4 * scope.horizontalPixelRatio]);
                    ctx.beginPath();
                    ctx.moveTo(x * scope.horizontalPixelRatio, y * scope.verticalPixelRatio);
                    ctx.lineTo(scope.bitmapSize.width, y * scope.verticalPixelRatio);
                    ctx.stroke();
                    ctx.restore();
                  }
                });
              });
            }
          };
        }
      }];
    }
  }

  const zoneLinesPrimitive = new ZoneLinesPrimitive();

  // Toggle: one click on the button turns drawing mode ON — every 2 clicks on the chart from then
  // on draws a new demand+supply pair, forever, until the button is pressed again to turn it OFF.
  function toggleDzSz() {
    if (!dzSzAttached) { candleSeries.attachPrimitive(zoneLinesPrimitive); dzSzAttached = true; }
    dzSzArmed = !dzSzArmed;
    dzSzNextIsSupply = false;
    return dzSzArmed;
  }

  // Simulator only: SimulatorForm calls this on the 15m RTH chart whenever a DZ/SZ line is drawn
  // on the RTH+Overnight chart, so the same zone shows on both. Never armed here (no click
  // handling needed) — just pushes the line C# already decided the time/price for.
  function addMirroredZoneLine(time, price, color) {
    if (!dzSzAttached) { candleSeries.attachPrimitive(zoneLinesPrimitive); dzSzAttached = true; }
    zoneLinesPrimitive._segments.push({ time, price, color, selected: false });
    dzSzAxisLabels.push(candleSeries.createPriceLine({
      price, color, lineWidth: 1, lineVisible: false, axisLabelVisible: true, title: '',
    }));
    forceRepaint();
  }

  function clearMirroredZoneLines() {
    zoneLinesPrimitive._segments = [];
    dzSzAxisLabels.forEach(l => candleSeries.removePriceLine(l));
    dzSzAxisLabels.length = 0;
    forceRepaint();
  }

  // Removes the demand+supply pair starting at pairStart (always even — 2i/2i+1) from both
  // _segments and the matching right-axis price-line labels. Shared by the Delete-key handler and
  // removeMirroredZonePair below.
  function removeZonePairAtIndex(pairStart) {
    zoneLinesPrimitive._segments.splice(pairStart + 1, 1);
    zoneLinesPrimitive._segments.splice(pairStart, 1);
    const removedLabels = dzSzAxisLabels.splice(pairStart, 2);
    removedLabels.forEach(l => candleSeries.removePriceLine(l));
    forceRepaint();
  }

  // Simulator only: called on the SIBLING chart when a mirrored zone gets deleted on the other one
  // (either direction — RTH+Overnight is the "source" but the mirror on RTH is independently
  // selectable/deletable too) — matched by price since that's shared between the original and its
  // mirror, unlike time (mirrored lines can clamp to a different anchor on the RTH-only chart).
  function removeMirroredZonePair(price1, price2) {
    const idx = zoneLinesPrimitive._segments.findIndex(s => s.price === price1 || s.price === price2);
    if (idx === -1) return;
    removeZonePairAtIndex(idx % 2 === 0 ? idx : idx - 1);
  }

  // ---- Rect tool: sky-blue rectangle between 2 clicks (opposite corners, no value labels) ----

  class RectanglesPrimitive {
    constructor() { this._rects = []; this._preview = null; this._chart = null; } // [{ t1, p1, t2, p2, selected }, ...]
    attached(param) { this._chart = param.chart; }
    updateAllViews() {}
    paneViews() {
      const self = this;
      return [{
        renderer() {
          return {
            draw(target) {
              if (!self._chart) return;
              target.useBitmapCoordinateSpace(scope => {
                const ctx = scope.context;
                const ts = self._chart.timeScale();
                // Snap each corner's time to the nearest real candle at/before it before asking
                // timeToCoordinate — an exact-but-stale t1/t2 (e.g. saved on a different timeframe
                // tab, or just not landing on a loaded bar) makes the library throw internally
                // instead of returning null, which — since this runs every animation frame via
                // self._rects.forEach — permanently wedges the WHOLE chart's rendering (candles
                // keep drawing via a different path, but SMA/Bollinger/other primitives stop).
                // Same fallback PrevDayCloseLinePrimitive/DailyPmLinePrimitive/HLine already use.
                // timeToCoordinate can THROW (not just return null) for a time that doesn't land
                // on a loaded bar — wrapped in try/catch, not just an == null check, for that reason.
                const safeX = (t) => {
                  try {
                    const x = safeTimeToCoordinate(ts, t);
                    if (x != null) return x;
                  } catch { /* fall through to snap */ }
                  if (allCandles.length === 0) return null;
                  let floor = null;
                  for (let i = allCandles.length - 1; i >= 0; i--) {
                    if (allCandles[i].time <= t) { floor = allCandles[i].time; break; }
                  }
                  try { return safeTimeToCoordinate(ts, floor ?? allCandles[0].time); } catch { return null; }
                };
                const drawRect = (r, alpha, selected) => {
                  const x1 = safeX(r.t1);
                  const x2 = safeX(r.t2);
                  const y1 = candleSeries.priceToCoordinate(r.p1);
                  const y2 = candleSeries.priceToCoordinate(r.p2);
                  if (x1 == null || x2 == null || y1 == null || y2 == null) return;
                  const left  = Math.min(x1, x2) * scope.horizontalPixelRatio;
                  const right = Math.max(x1, x2) * scope.horizontalPixelRatio;
                  const top    = Math.min(y1, y2) * scope.verticalPixelRatio;
                  const bottom = Math.max(y1, y2) * scope.verticalPixelRatio;
                  ctx.fillStyle = `rgba(150, 150, 150, ${alpha})`; // gray
                  ctx.fillRect(left, top, right - left, bottom - top);
                  if (selected) {
                    ctx.strokeStyle = '#ffeb3b'; // yellow outline = selected, ready to delete
                    ctx.lineWidth = 2 * scope.horizontalPixelRatio;
                    ctx.strokeRect(left, top, right - left, bottom - top);
                  }
                };
                self._rects.forEach(r => drawRect(r, 0.35, r.selected));
                if (self._preview) drawRect(self._preview, 0.18, false); // lighter while still dragging
              });
            }
          };
        }
      }];
    }
  }

  // ---- Color Rect tool (Daily tab): same 2-click rectangle as the gray Rect above, but filled
  // red or green depending on drag direction — red if the 1st click is ABOVE (higher price than)
  // the 2nd (drawn top-to-bottom), green otherwise (bottom-to-top) — same convention the Arrow
  // tool already uses (see ArrowPrimitive), for consistency. Color is derived from p1 vs p2 at
  // draw time, not stored separately. ----

  class ColorRectPrimitive {
    constructor() { this._rects = []; this._preview = null; this._chart = null; } // [{ t1, p1, t2, p2, selected }, ...]
    attached(param) { this._chart = param.chart; }
    updateAllViews() {}
    paneViews() {
      const self = this;
      return [{
        renderer() {
          return {
            draw(target) {
              if (!self._chart) return;
              target.useBitmapCoordinateSpace(scope => {
                const ctx = scope.context;
                const ts = self._chart.timeScale();
                // Same safe-snap wrapper as the gray Rect above — timeToCoordinate can throw for a
                // stale/off-bar time, which would otherwise wedge the whole chart's rendering.
                const safeX = (t) => {
                  try {
                    const x = safeTimeToCoordinate(ts, t);
                    if (x != null) return x;
                  } catch { /* fall through to snap */ }
                  if (allCandles.length === 0) return null;
                  let floor = null;
                  for (let i = allCandles.length - 1; i >= 0; i--) {
                    if (allCandles[i].time <= t) { floor = allCandles[i].time; break; }
                  }
                  try { return safeTimeToCoordinate(ts, floor ?? allCandles[0].time); } catch { return null; }
                };
                const drawRect = (r, alpha, selected) => {
                  const x1 = safeX(r.t1);
                  const x2 = safeX(r.t2);
                  const y1 = candleSeries.priceToCoordinate(r.p1);
                  const y2 = candleSeries.priceToCoordinate(r.p2);
                  if (x1 == null || x2 == null || y1 == null || y2 == null) return;
                  const left  = Math.min(x1, x2) * scope.horizontalPixelRatio;
                  const right = Math.max(x1, x2) * scope.horizontalPixelRatio;
                  const top    = Math.min(y1, y2) * scope.verticalPixelRatio;
                  const bottom = Math.max(y1, y2) * scope.verticalPixelRatio;
                  const red = r.p1 > r.p2; // 1st click above 2nd -> red, otherwise green
                  // Green lightened further (was a muted teal that barely read against the dark
                  // background) — per explicit request, higher alpha too so the fill itself reads
                  // as light green instead of just a brighter dark green.
                  ctx.fillStyle = red ? `rgba(239, 83, 80, ${alpha})` : `rgba(180, 245, 195, ${alpha * 1.7})`;
                  ctx.fillRect(left, top, right - left, bottom - top);
                  // Dark same-hue border, per explicit request — always visible (not just when
                  // selected), so the rect reads clearly against the candles/background.
                  ctx.strokeStyle = red ? '#8b0000' : '#0b5e1f'; // dark red / dark green
                  ctx.lineWidth = 1.5 * scope.horizontalPixelRatio;
                  ctx.strokeRect(left, top, right - left, bottom - top);
                  if (selected) {
                    ctx.strokeStyle = '#ffeb3b'; // yellow outline = selected, ready to delete
                    ctx.lineWidth = 2 * scope.horizontalPixelRatio;
                    ctx.strokeRect(left, top, right - left, bottom - top);
                  }
                };
                self._rects.forEach(r => drawRect(r, 0.35, r.selected));
                if (self._preview) drawRect(self._preview, 0.18, false); // lighter while still dragging
              });
            }
          };
        }
      }];
    }
  }

  const rectanglesPrimitive = new RectanglesPrimitive();
  let rectAttached = false;
  let rectArmed = false;
  let rectPending = null; // { time, price } of the first click of the current rectangle

  // Same toggle pattern as DZ/SZ: one click arms it, every 2 chart clicks draws a new rectangle,
  // forever, until pressed again to disarm.
  function toggleRect() {
    if (!rectAttached) { candleSeries.attachPrimitive(rectanglesPrimitive); rectAttached = true; }
    rectArmed = !rectArmed;
    rectPending = null;
    return rectArmed;
  }

  const colorRectPrimitive = new ColorRectPrimitive();
  let colorRectAttached = false;
  let colorRectArmed = false;
  let colorRectPending = null; // { time, price } of the first click of the current rectangle

  // Same single-shot-per-arm toggle as the gray Rect tool above — 2nd click draws and disarms.
  function toggleColorRect() {
    if (!colorRectAttached) { candleSeries.attachPrimitive(colorRectPrimitive); colorRectAttached = true; }
    colorRectArmed = !colorRectArmed;
    colorRectPending = null;
    return colorRectArmed;
  }

  // ---- Gray Rect tool (1h panel): filled gray rectangle marking sideways/consolidation ranges
  // around price+SMAs. Same 2-click draw as the sky-blue Rect above, but each rectangle can also
  // be SELECTED by clicking its border (works whether or not the tool is currently armed) and
  // removed by pressing Delete — the sky-blue Rect tool has no such selection/delete. ----

  class GrayRectPrimitive {
    constructor() { this._rects = []; this._preview = null; this._chart = null; } // [{ t1, p1, t2, p2, selected }, ...]
    attached(param) { this._chart = param.chart; }
    updateAllViews() {}
    paneViews() {
      const self = this;
      return [{
        renderer() {
          return {
            draw(target) {
              if (!self._chart) return;
              target.useBitmapCoordinateSpace(scope => {
                const ctx = scope.context;
                const ts = self._chart.timeScale();
                // Same safe-snap wrapper as RectanglesPrimitive above — timeToCoordinate can throw
                // (not just return null) for a stale/off-bar time, which would otherwise wedge the
                // whole chart's rendering every animation frame.
                const safeX = (t) => {
                  try {
                    const x = safeTimeToCoordinate(ts, t);
                    if (x != null) return x;
                  } catch { /* fall through to snap */ }
                  if (allCandles.length === 0) return null;
                  let floor = null;
                  for (let i = allCandles.length - 1; i >= 0; i--) {
                    if (allCandles[i].time <= t) { floor = allCandles[i].time; break; }
                  }
                  try { return safeTimeToCoordinate(ts, floor ?? allCandles[0].time); } catch { return null; }
                };
                const drawRect = (r, alpha, selected) => {
                  const x1 = safeX(r.t1);
                  const x2 = safeX(r.t2);
                  const y1 = candleSeries.priceToCoordinate(r.p1);
                  const y2 = candleSeries.priceToCoordinate(r.p2);
                  if (x1 == null || x2 == null || y1 == null || y2 == null) return;
                  const left   = Math.min(x1, x2) * scope.horizontalPixelRatio;
                  const right  = Math.max(x1, x2) * scope.horizontalPixelRatio;
                  const top    = Math.min(y1, y2) * scope.verticalPixelRatio;
                  const bottom = Math.max(y1, y2) * scope.verticalPixelRatio;
                  ctx.fillStyle = `rgba(150, 150, 150, ${alpha})`;
                  ctx.fillRect(left, top, right - left, bottom - top);
                  if (selected) {
                    ctx.strokeStyle = '#ffeb3b'; // yellow outline = selected, ready to delete
                    ctx.lineWidth = 2 * scope.horizontalPixelRatio;
                    ctx.strokeRect(left, top, right - left, bottom - top);
                  }
                };
                self._rects.forEach(r => drawRect(r, 0.35, r.selected));
                if (self._preview) drawRect(self._preview, 0.18, false); // lighter while still dragging
              });
            }
          };
        }
      }];
    }
  }

  const grayRectPrimitive = new GrayRectPrimitive();
  let grayRectAttached = false;
  let grayRectArmed = false;
  let grayRectPending = null; // { time, price } of the first click of the current rectangle

  function toggleGrayRect() {
    if (!grayRectAttached) { candleSeries.attachPrimitive(grayRectPrimitive); grayRectAttached = true; }
    grayRectArmed = !grayRectArmed;
    grayRectPending = null;
    return grayRectArmed;
  }

  // Shortest distance from point (px,py) to the line segment (x1,y1)-(x2,y2), in CSS pixels.
  function distToSegment(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const lenSq = dx * dx + dy * dy;
    let t = lenSq === 0 ? 0 : ((px - x1) * dx + (py - y1) * dy) / lenSq;
    t = Math.max(0, Math.min(1, t));
    const cx = x1 + t * dx, cy = y1 + t * dy;
    return Math.hypot(px - cx, py - cy);
  }

  // Returns the index of the gray rect whose BORDER (not interior) is within a few pixels of
  // (px,py), or -1. Checked in CSS-pixel space (param.point from chart.subscribeClick), which is
  // what timeToCoordinate/priceToCoordinate already return outside of the bitmap draw() context.
  // Generic border-click hit-test shared by both rectangle tools (gray + sky blue) — returns the
  // index of the topmost rect (in `rects`) whose border is within a few pixels of (px,py), or -1.
  function findRectBorderIndex(rects, px, py) {
    const ts = chart.timeScale();
    const tolerance = 6;
    for (let i = rects.length - 1; i >= 0; i--) {
      const r = rects[i];
      const x1 = safeTimeToCoordinate(ts, r.t1), x2 = safeTimeToCoordinate(ts, r.t2);
      const y1 = candleSeries.priceToCoordinate(r.p1), y2 = candleSeries.priceToCoordinate(r.p2);
      if (x1 == null || x2 == null || y1 == null || y2 == null) continue;
      const left = Math.min(x1, x2), right = Math.max(x1, x2);
      const top = Math.min(y1, y2), bottom = Math.max(y1, y2);
      const edges = [
        [left, top, right, top], [right, top, right, bottom],
        [right, bottom, left, bottom], [left, bottom, left, top],
      ];
      if (edges.some(([ex1, ey1, ex2, ey2]) => distToSegment(px, py, ex1, ey1, ex2, ey2) <= tolerance)) return i;
    }
    return -1;
  }

  function findGrayRectByBorderClick(px, py) { return findRectBorderIndex(grayRectPrimitive._rects, px, py); }
  function findBlueRectByBorderClick(px, py) { return findRectBorderIndex(rectanglesPrimitive._rects, px, py); }
  function findColorRectByBorderClick(px, py) { return findRectBorderIndex(colorRectPrimitive._rects, px, py); }

  // Returns the index of the T-Line whose segment is within a few pixels of (px,py), or -1.
  // Same distToSegment helper as the gray rect border check above.
  function findTLineByClick(px, py) {
    const ts = chart.timeScale();
    const tolerance = 6;
    for (let i = tLinePrimitive._lines.length - 1; i >= 0; i--) {
      const l = tLinePrimitive._lines[i];
      const x1 = safeTimeToCoordinate(ts, l.t1), x2 = safeTimeToCoordinate(ts, l.t2);
      const y1 = candleSeries.priceToCoordinate(l.p1), y2 = candleSeries.priceToCoordinate(l.p2);
      if (x1 == null || x2 == null || y1 == null || y2 == null) continue;
      if (distToSegment(px, py, x1, y1, x2, y2) <= tolerance) return i;
    }
    return -1;
  }

  // Returns the index of the diagonal Arrow whose shaft is within a few pixels of (px,py), or -1.
  // Same distToSegment helper as T-Line above, using logicalToCoordinate (not timeToCoordinate)
  // to match how ArrowPrimitive itself draws — arrows can extend past the last/first candle.
  function findArrowByClick(px, py) {
    const ts = chart.timeScale();
    const tolerance = 6;
    for (let i = arrowPrimitive._arrows.length - 1; i >= 0; i--) {
      const a = arrowPrimitive._arrows[i];
      const x1 = ts.logicalToCoordinate(a.l1), x2 = ts.logicalToCoordinate(a.l2);
      const y1 = candleSeries.priceToCoordinate(a.p1), y2 = candleSeries.priceToCoordinate(a.p2);
      if (x1 == null || x2 == null || y1 == null || y2 == null) continue;
      if (distToSegment(px, py, x1, y1, x2, y2) <= tolerance) return i;
    }
    return -1;
  }

  // Returns the index of the H-Line whose horizontal segment (click point -> right edge) is
  // within a few pixels of (px,py), or -1. Same distToSegment helper as gray rect/T-Line above.
  function findHLineByClick(px, py) {
    const ts = chart.timeScale();
    const tolerance = 6;
    for (let i = hLinePrimitive._segments.length - 1; i >= 0; i--) {
      const seg = hLinePrimitive._segments[i];
      // Same snap-to-nearest-real-candle fallback HLinePrimitive.draw() uses — without it, the
      // auto-drawn prev-day High/Low lines (whose time comes from 1-minute-granularity C# data,
      // essentially never landing on an exact candle boundary) render fine but can never be
      // click-selected here, since timeToCoordinate returns null for their raw time and this loop
      // just skips them — making them impossible to Delete. Manually-drawn H-Lines are unaffected
      // (their time is always an exact candle's own, captured from the click itself).
      let snappedTime = seg.time;
      if (safeTimeToCoordinate(ts, snappedTime) == null && allCandles.length > 0) {
        let floor = null;
        for (let j = allCandles.length - 1; j >= 0; j--) {
          if (allCandles[j].time <= seg.time) { floor = allCandles[j].time; break; }
        }
        snappedTime = floor ?? allCandles[0].time;
      }
      const x = safeTimeToCoordinate(ts, snappedTime);
      const y = candleSeries.priceToCoordinate(seg.price);
      if (x == null || y == null) continue;
      if (distToSegment(px, py, x, y, chart.timeScale().width(), y) <= tolerance) return i;
    }
    return -1;
  }

  // Returns the index of the DZ/SZ line (demand or supply, click point -> right edge, same shape
  // as H-Line) within a few pixels of (px,py), or -1.
  function findDzSzByClick(px, py) {
    const ts = chart.timeScale();
    const tolerance = 6;
    for (let i = zoneLinesPrimitive._segments.length - 1; i >= 0; i--) {
      const seg = zoneLinesPrimitive._segments[i];
      const x = safeTimeToCoordinate(ts, seg.time);
      const y = candleSeries.priceToCoordinate(seg.price);
      if (x == null || y == null) continue;
      if (distToSegment(px, py, x, y, chart.timeScale().width(), y) <= tolerance) return i;
    }
    return -1;
  }

  // Delete removes whichever gray rect, T-Line, H-Line, or vertical arrow is currently selected
  // (click on its border/line). A deleted T-Line is also reported to C# (TLineStore) so it
  // doesn't come back on the next session.
  window.addEventListener('keydown', e => {
    if (e.key !== 'Delete') return;

    const rectIdx = grayRectPrimitive._rects.findIndex(r => r.selected);
    if (rectIdx !== -1) {
      const removedRect = grayRectPrimitive._rects[rectIdx];
      grayRectPrimitive._rects.splice(rectIdx, 1);
      forceRepaint();
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage({ type: 'rect_delete', t1: removedRect.t1, p1: removedRect.p1, t2: removedRect.t2, p2: removedRect.p2 });
      }
      return;
    }

    const blueRectIdx = rectanglesPrimitive._rects.findIndex(r => r.selected);
    if (blueRectIdx !== -1) {
      const removedRect = rectanglesPrimitive._rects[blueRectIdx];
      rectanglesPrimitive._rects.splice(blueRectIdx, 1);
      forceRepaint();
      // Persisted by C# (RectStore) — see DailyChartForm.cs. "bluerect_*" instead of "rect_*" so
      // it can't collide with the GRAY rect tool's own existing "rect_add" message.
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage({ type: 'bluerect_delete', t1: removedRect.t1, p1: removedRect.p1, t2: removedRect.t2, p2: removedRect.p2 });
      }
      return;
    }

    const colorRectIdx = colorRectPrimitive._rects.findIndex(r => r.selected);
    if (colorRectIdx !== -1) {
      const removedRect = colorRectPrimitive._rects[colorRectIdx];
      colorRectPrimitive._rects.splice(colorRectIdx, 1);
      forceRepaint();
      // Persisted by C# (RectStore, tag "DailyColor") — see DailyChartForm.cs.
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage({ type: 'colorrect_delete', t1: removedRect.t1, p1: removedRect.p1, t2: removedRect.t2, p2: removedRect.p2 });
      }
      return;
    }

    const lineIdx = tLinePrimitive._lines.findIndex(l => l.selected);
    if (lineIdx !== -1) {

      tLinePrimitive._lines.splice(lineIdx, 1);
      forceRepaint();
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage({ type: 'tline_delete', t1: removed.t1, p1: removed.p1, t2: removed.t2, p2: removed.p2 });
      }
      return;
    }

    // H-Line: removed here AND reported to C# (ChartPanel.CoreWebView2_WebMessageReceived), which
    // relays it (by price) to the other 2 panels' removeHLine — covers both manually-drawn H-Lines
    // and the auto-drawn prev-day High/Low (markPrevDayHiLo draws the same price on all 3 panels).
    const hLineIdx = hLinePrimitive._segments.findIndex(s => s.selected);
    if (hLineIdx !== -1) {
      const removed = hLinePrimitive._segments[hLineIdx];
      hLinePrimitive._segments.splice(hLineIdx, 1);
      forceRepaint();
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage({ type: 'hline_delete', price: removed.price });
      }
      return;
    }

    // DZ/SZ: removes the WHOLE zone (both demand+supply lines of the pair the selected line
    // belongs to), not just the one line clicked — pairs are strictly consecutive (2i, 2i+1), so
    // splicing only one would shift the pairing of every zone drawn after it.
    const dzSzIdx = zoneLinesPrimitive._segments.findIndex(s => s.selected);
    if (dzSzIdx !== -1) {
      const pairStart = dzSzIdx % 2 === 0 ? dzSzIdx : dzSzIdx - 1;
      const removedPrice1 = zoneLinesPrimitive._segments[pairStart].price;
      const removedPrice2 = zoneLinesPrimitive._segments[pairStart + 1].price;
      removeZonePairAtIndex(pairStart);
      // Simulator only (SimulatorForm mirrors each DZ/SZ zone onto the sibling RTH/RTH+Overnight
      // chart) — harmless on the live chart, nothing listens for it there. Reported by price
      // (not time) since a mirrored pair shares the same price but not necessarily the same
      // fake-UTC anchor time as the original.
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage({ type: 'dzsz_delete', price1: removedPrice1, price2: removedPrice2 });
      }
      return;
    }

    const deltaSIdx = deltaSPrimitive._labels.findIndex(l => l.selected);
    if (deltaSIdx !== -1) {
      deltaSPrimitive._labels.splice(deltaSIdx, 1);
      forceRepaint();
      return;
    }

    // Stk line: removed here AND reported to C# (ChartPanel.CoreWebView2_WebMessageReceived),
    // which relays it to the other 2 panels' removeStrikeLine so deleting from any one chart
    // removes it from all 3 — markStrike draws the same line on all 3 panels at trade open.
    // Its matching "ΔS=" label (markDeltaS keys it by the SAME strike price) is removed right
    // along with it — per explicit request, deleting the Stk line takes the delta label with it
    // instead of leaving it orphaned on screen.
    const strikeIdx = strikeLinesPrimitive._lines.findIndex(l => l.selected);
    if (strikeIdx !== -1) {
      const removed = strikeLinesPrimitive._lines[strikeIdx];
      strikeLinesPrimitive._lines.splice(strikeIdx, 1);
      deltaSPrimitive._labels = deltaSPrimitive._labels.filter(l => l.price !== removed.price);
      forceRepaint();
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage({ type: 'strike_delete', price: removed.price });
      }
      return;
    }

    const refLineIdx = pisoTechoRefLinePrimitive._lines.findIndex(l => l.selected);
    if (refLineIdx !== -1) {
      pisoTechoRefLinePrimitive._lines.splice(refLineIdx, 1);
      forceRepaint();
      return;
    }

    // SMA watch marker: removed here AND reported to C# (SmaDailyWatchStore) so it stops being
    // monitored and doesn't come back on the next session.
    if (smaWatchPrimitive._selected !== null) {
      const removedPeriod = smaWatchPrimitive._selected;
      smaWatchPrimitive._periods = smaWatchPrimitive._periods.filter(p => p !== removedPeriod);
      smaWatchPrimitive._selected = null;
      forceRepaint();
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage({ type: 'smawatch_delete', period: removedPeriod });
      }
      return;
    }

    const arrowIdx = verticalArrowPrimitive._arrows.findIndex(a => a.selected);
    if (arrowIdx !== -1) {
      const removed = verticalArrowPrimitive._arrows[arrowIdx];
      verticalArrowPrimitive._arrows.splice(arrowIdx, 1);
      forceRepaint();
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage({ type: 'arrow_delete', time: removed.time, price: removed.price, up: removed.up });
      }

    // remove it locally, same as click-text below.
    const diagArrowIdx = arrowPrimitive._arrows.findIndex(a => a.selected);
    if (diagArrowIdx !== -1) {
      arrowPrimitive._arrows.splice(diagArrowIdx, 1);
      forceRepaint();
      return;

    // Click-text: session-only, nothing to report to C# — just remove it locally.
    const textIdx = clickTextPrimitive._labels.findIndex(l => l.selected);
    if (textIdx !== -1) {
      clickTextPrimitive._labels.splice(textIdx, 1);
      forceRepaint();
    }
  });

  // Primitives don't repaint just because their backing data changed — only on an actual chart

  function forceRepaint() {
    candleSeries.applyOptions({});

  chart.subscribeClick(param => {
    if (!param.point) return;
    // Arrow tool handled here, BEFORE the clickTime/price guard below — clickTime falls back to
    // coordinateToTime, which (unlike coordinateToLogical) still returns null in truly empty
    // space (e.g. right of the last candle), which used to make the whole handler return early
    // and silently swallow the 2nd click of an arrow drawn into that space. Self-contained: uses
    // its own logical/price and returns immediately, without falling through to the rest of the
    // click handler (hit-testing for other tools, which arrow doesn't need).
    if (arrowArmed) {

      const arrowPrice = candleSeries.coordinateToPrice(param.point.y);
      if (arrowPrice == null) return;
      if (!arrowPending) {

    if (arrowPrimitive._arrows.length > 0) {

      if (hitIdx !== -1) {

      if (hitIdx !== -1) {

        forceRepaint();
        return;
      }
      const hadColorSelection = colorRectPrimitive._rects.some(r => r.selected);
      if (hadColorSelection) {
        colorRectPrimitive._rects.forEach(r => { r.selected = false; });
        forceRepaint();
      }

    if (tLinePrimitive._lines.length > 0) {

      if (hitIdx !== -1) {
        tLinePrimitive._lines.forEach((l, i) => { l.selected = i === hitIdx; });
        forceRepaint();
        return;

      if (hadLineSelection) {

      }
    }

    // DZ/SZ click selection — same idea as above, regardless of whether DZ/SZ drawing is armed.
    // Delete removes the whole zone (both the demand and supply line of the pair), not just the
    // one line clicked — see the keydown handler below.
    if (zoneLinesPrimitive._segments.length > 0) {
      const hitIdx = findDzSzByClick(param.point.x, param.point.y);
      if (hitIdx !== -1) {
        zoneLinesPrimitive._segments.forEach((s, i) => { s.selected = i === hitIdx; });
        forceRepaint();
        return;
      }
      const hadDzSzSelection = zoneLinesPrimitive._segments.some(s => s.selected);
      if (hadDzSzSelection) {
        zoneLinesPrimitive._segments.forEach(s => { s.selected = false; });
        forceRepaint();
      }
    }

    // ΔS label click selection — same idea as above.
    if (deltaSPrimitive._labels.length > 0) {
      const hitIdx = findDeltaSByClick(param.point.x, param.point.y);
      if (hitIdx !== -1) {
        deltaSPrimitive._labels.forEach((l, i) => { l.selected = i === hitIdx; });
        forceRepaint();
        return;
      }
      const hadDeltaSSelection = deltaSPrimitive._labels.some(l => l.selected);
      if (hadDeltaSSelection) {
        deltaSPrimitive._labels.forEach(l => { l.selected = false; });
        forceRepaint();
      }
    }

    // Piso/Techo reference line click selection — same idea as above.
    if (pisoTechoRefLinePrimitive._lines.length > 0) {
      const hitIdx = findPisoTechoRefLineByClick(param.point.x, param.point.y);
      if (hitIdx !== -1) {
        pisoTechoRefLinePrimitive._lines.forEach((l, i) => { l.selected = i === hitIdx; });
        forceRepaint();
        return;
      }
      const hadRefLineSelection = pisoTechoRefLinePrimitive._lines.some(l => l.selected);
      if (hadRefLineSelection) {
        pisoTechoRefLinePrimitive._lines.forEach(l => { l.selected = false; });
        forceRepaint();
      }
    }

    // SMA watch marker click selection — same idea as above, keyed by period instead of index.
    if (smaWatchPrimitive._periods.length > 0) {
      const hitPeriod = findSmaWatchByClick(param.point.x, param.point.y);
      if (hitPeriod !== -1) {
        smaWatchPrimitive._selected = hitPeriod;
        forceRepaint();
        return;
      }
      if (smaWatchPrimitive._selected !== null) {
        smaWatchPrimitive._selected = null;
        forceRepaint();
      }
    }

    // Click-text click selection — same idea as ΔS above.
    if (clickTextPrimitive._labels.length > 0) {
      const hitIdx = findClickTextByClick(param.point.x, param.point.y);
      if (hitIdx !== -1) {
        clickTextPrimitive._labels.forEach((l, i) => { l.selected = i === hitIdx; });
        forceRepaint();
        return;
      }
      const hadTextSelection = clickTextPrimitive._labels.some(l => l.selected);
      if (hadTextSelection) {
        clickTextPrimitive._labels.forEach(l => { l.selected = false; });
        forceRepaint();
      }
    }

    // Vertical arrow click selection (1h panel) — same idea as gray rect/T-Line above.
    if (verticalArrowPrimitive._arrows.length > 0) {
      const hitIdx = findVerticalArrowByClick(param.point.x, param.point.y);
      if (hitIdx !== -1) {
        verticalArrowPrimitive._arrows.forEach((a, i) => { a.selected = i === hitIdx; });
        forceRepaint();
        return;
      }
      const hadArrowSelection = verticalArrowPrimitive._arrows.some(a => a.selected);
      if (hadArrowSelection) {
        verticalArrowPrimitive._arrows.forEach(a => { a.selected = false; });
        forceRepaint();
      }
    }

    if (dzSzArmed) {
      const color = dzSzNextIsSupply ? '#ef5350' : '#26a69a';

      zoneLinesPrimitive._segments.push({ time: clickTime, price, color, selected: false });

      dzSzAxisLabels.push(candleSeries.createPriceLine({
        price, color, lineWidth: 1, lineVisible: false, axisLabelVisible: true, title: '',
      }));

      dzSzNextIsSupply = !dzSzNextIsSupply;

      // Simulator only (SimulatorForm mirrors each line onto the 15m RTH chart at the same
      // price) — harmless on the live chart, nothing listens for it there.
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage({ type: 'dzsz', time: clickTime, price, color });
      }
    }

    if (rectArmed) {
      if (!rectPending) {
        rectPending = { time: clickTime, price };
      } else {
        rectanglesPrimitive._rects.push({ t1: rectPending.time, p1: rectPending.price, t2: clickTime, p2: price });
        rectanglesPrimitive._preview = null;
        rectPending = null;
        forceRepaint();
        // Single-shot per arm — completing one rectangle (2nd click) disarms the tool instead of
        // staying armed for another, per explicit request. Same pattern as T-Line.
        rectArmed = false;
        if (window.chrome && window.chrome.webview) {
          window.chrome.webview.postMessage({ type: 'rect_placed' });
          // Persisted by C# (RectStore) — see DailyChartForm.cs.
          const addedRect = rectanglesPrimitive._rects[rectanglesPrimitive._rects.length - 1];
          window.chrome.webview.postMessage({ type: 'bluerect_add', t1: addedRect.t1, p1: addedRect.p1, t2: addedRect.t2, p2: addedRect.p2 });
        }
      }
    }

    if (colorRectArmed) {
      if (!colorRectPending) {
        colorRectPending = { time: clickTime, price };
      } else {
        colorRectPrimitive._rects.push({ t1: colorRectPending.time, p1: colorRectPending.price, t2: clickTime, p2: price, selected: false });
        colorRectPrimitive._preview = null;
        colorRectPending = null;
        forceRepaint();
        // Single-shot per arm, same pattern as the gray Rect tool.
        colorRectArmed = false;
        if (window.chrome && window.chrome.webview) {
          window.chrome.webview.postMessage({ type: 'colorrect_placed' });
          // Persisted by C# (RectStore, tag "DailyColor") — see DailyChartForm.cs.
          const addedRect = colorRectPrimitive._rects[colorRectPrimitive._rects.length - 1];
          window.chrome.webview.postMessage({ type: 'colorrect_add', t1: addedRect.t1, p1: addedRect.p1, t2: addedRect.t2, p2: addedRect.p2 });
        }
      }
    }

    if (grayRectArmed) {
      if (!grayRectPending) {
        grayRectPending = { time: clickTime, price };
      } else {
        const rect = { t1: grayRectPending.time, p1: grayRectPending.price, t2: clickTime, p2: price, selected: false };
        grayRectPrimitive._rects.push(rect);
        grayRectPrimitive._preview = null;
        grayRectPending = null;
        forceRepaint();
        // Single-shot per arm — completing one rectangle (2nd click) disarms the tool instead of
        // staying armed for another, per explicit request. Same pattern as the sky-blue rect tool.
        grayRectArmed = false;
        // Persisted per-symbol by C# (RectGrisStore) so it reappears at the same point after
        // closing and reopening the app — see ChartPanel.CoreWebView2_WebMessageReceived.
        if (window.chrome && window.chrome.webview) {
          window.chrome.webview.postMessage({ type: 'rect_add', t1: rect.t1, p1: rect.p1, t2: rect.t2, p2: rect.p2 });
          window.chrome.webview.postMessage({ type: 'rectgris_placed' });
        }
      }
    }

    if (tLineArmed) {
      if (!tLinePending) {
        tLinePending = { time: clickTime, price };
      } else {
        const line = { t1: tLinePending.time, p1: tLinePending.price, t2: clickTime, p2: price };
        tLinePrimitive._lines.push(line);
        tLinePrimitive._preview = null;
        tLinePending = null;
        forceRepaint();
        // Single-shot per arm — completing one T-Line (2nd click) disarms the tool instead of
        // staying armed for more, per explicit request.
        tLineArmed = false;
        // Persisted per-symbol by C# (TLineStore) so it reappears at the same point after
        // closing and reopening the app — see ChartPanel.CoreWebView2_WebMessageReceived.
        if (window.chrome && window.chrome.webview) {
          window.chrome.webview.postMessage({ type: 'tline', ...line });
          window.chrome.webview.postMessage({ type: 'tline_placed' });
        }
      }
    }

    if (hLineArmed) {
      hLinePrimitive._segments.push({ time: clickTime, price, selected: false });
      // Reported to C# (ChartPanel.CoreWebView2_WebMessageReceived) so it can mirror this H-Line
      // onto the other 2 panels — see addMirroredHLine below.
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage({ type: 'hline_add', time: clickTime, price });
      }
      forceRepaint();
    }

    if (textArmed && pendingTextValue) {
      clickTextPrimitive._labels.push({ time: clickTime, price, text: pendingTextValue, selected: false });
      forceRepaint();
      // Single-shot per arm — placing one label disarms the tool instead of staying armed for
      // more, per explicit request. Reported to C# so the "Text" button's color resets on all 3
      // panels (see ChartPanel/MultiChartForm's text_placed handling), same as this button armed
      // all 3 in the first place.
      textArmed = false;
      pendingTextValue = '';
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage({ type: 'text_placed' });
      }
    }

    if (greenArrowArmed) {
      const arrow = { time: clickTime, price, up: true, selected: false };
      verticalArrowPrimitive._arrows.push(arrow);
      forceRepaint();
      // Single-shot per arm — placing one arrow disarms the tool instead of staying armed for
      // more, per explicit request. Persisted per-symbol by C# (VerticalArrowStore) — see
      // ChartPanel.CoreWebView2_WebMessageReceived.
      greenArrowArmed = false;
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage({ type: 'arrow_add', time: arrow.time, price: arrow.price, up: arrow.up });
        window.chrome.webview.postMessage({ type: 'arrow_placed', up: true });
      }
    }
    if (redArrowArmed) {
      const arrow = { time: clickTime, price, up: false, selected: false };
      verticalArrowPrimitive._arrows.push(arrow);
      forceRepaint();
      redArrowArmed = false;
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage({ type: 'arrow_add', time: arrow.time, price: arrow.price, up: arrow.up });
        window.chrome.webview.postMessage({ type: 'arrow_placed', up: false });
      }
    }
  });

  // Live preview of the rectangle/T-Line while the mouse moves between the 1st and 2nd click.
  chart.subscribeCrosshairMove(param => {
    if (!rectArmed || !rectPending) {
      if (rectanglesPrimitive._preview) { rectanglesPrimitive._preview = null; forceRepaint(); }
    } else if (param.point && param.time !== undefined) {
      const price = candleSeries.coordinateToPrice(param.point.y);
      if (price != null) {
        rectanglesPrimitive._preview = { t1: rectPending.time, p1: rectPending.price, t2: param.time, p2: price };
        forceRepaint();
      }
    }

    if (!grayRectArmed || !grayRectPending) {
      if (grayRectPrimitive._preview) { grayRectPrimitive._preview = null; forceRepaint(); }
    } else if (param.point && param.time !== undefined) {
      const price = candleSeries.coordinateToPrice(param.point.y);
      if (price != null) {
        grayRectPrimitive._preview = { t1: grayRectPending.time, p1: grayRectPending.price, t2: param.time, p2: price };
        forceRepaint();
      }
    }

    if (!colorRectArmed || !colorRectPending) {
      if (colorRectPrimitive._preview) { colorRectPrimitive._preview = null; forceRepaint(); }
    } else if (param.point && param.time !== undefined) {
      const price = candleSeries.coordinateToPrice(param.point.y);
      if (price != null) {
        colorRectPrimitive._preview = { t1: colorRectPending.time, p1: colorRectPending.price, t2: param.time, p2: price };
        forceRepaint();
      }
    }

    if (!tLineArmed || !tLinePending) {
      if (tLinePrimitive._preview) { tLinePrimitive._preview = null; forceRepaint(); }
    } else if (param.point && param.time !== undefined) {
      const price = candleSeries.coordinateToPrice(param.point.y);
      if (price != null) {
        tLinePrimitive._preview = { t1: tLinePending.time, p1: tLinePending.price, t2: param.time, p2: price };
        forceRepaint();
      }
    }

    if (!arrowArmed || !arrowPending) {
      if (arrowPrimitive._preview) { arrowPrimitive._preview = null; forceRepaint(); }
    } else if (param.point) {
      // No param.time !== undefined gate here (unlike the other tools' previews) — the preview
      // must keep following the cursor into the empty space beyond the last candle too.
      const price = candleSeries.coordinateToPrice(param.point.y);
      if (price != null) {
        const logicalX = chart.timeScale().coordinateToLogical(param.point.x);
        const red = arrowPending.price > price;
        arrowPrimitive._preview = { l1: arrowPending.logical, p1: arrowPending.price, l2: logicalX, p2: price, red };
        forceRepaint();
      }
    }
  });

  // ---- T-Line tool: orange line segment between 2 clicks (not extended to the edges) ----

  class TLinePrimitive {
    constructor() { this._lines = []; this._preview = null; this._chart = null; } // [{ t1, p1, t2, p2 }, ...]
    attached(param) { this._chart = param.chart; }
    updateAllViews() {}
    paneViews() {
      const self = this;
      return [{
        renderer() {
          return {
            draw(target) {
              if (!self._chart) return;
              target.useBitmapCoordinateSpace(scope => {
                const ctx = scope.context;
                const ts = self._chart.timeScale();
                // Same safe-snap wrapper as RectanglesPrimitive/GrayRectPrimitive — timeToCoordinate
                // can throw (not just return null) for a stale/off-bar time, which wedges the whole
                // chart's rendering every animation frame (candles keep drawing via a different
                // path, but SMA/Bollinger/other primitives stop).
                const safeX = (t) => {
                  try {
                    const x = safeTimeToCoordinate(ts, t);
                    if (x != null) return x;
                  } catch { /* fall through to snap */ }
                  if (allCandles.length === 0) return null;
                  let floor = null;
                  for (let i = allCandles.length - 1; i >= 0; i--) {
                    if (allCandles[i].time <= t) { floor = allCandles[i].time; break; }
                  }
                  try { return safeTimeToCoordinate(ts, floor ?? allCandles[0].time); } catch { return null; }
                };
                const drawLine = (l, alpha) => {
                  const x1 = safeX(l.t1);
                  const x2 = safeX(l.t2);
                  const y1 = candleSeries.priceToCoordinate(l.p1);
                  const y2 = candleSeries.priceToCoordinate(l.p2);
                  if (x1 == null || x2 == null || y1 == null || y2 == null) return;
                  ctx.strokeStyle = `rgba(255, 152, 0, ${alpha})`; // orange
                  ctx.lineWidth = 2 * scope.horizontalPixelRatio;
                  ctx.beginPath();
                  ctx.moveTo(x1 * scope.horizontalPixelRatio, y1 * scope.verticalPixelRatio);
                  ctx.lineTo(x2 * scope.horizontalPixelRatio, y2 * scope.verticalPixelRatio);
                  ctx.stroke();

                  if (l.selected) {
                    ctx.strokeStyle = '#ffeb3b'; // yellow dashed overlay = selected, ready to delete
                    ctx.lineWidth = 1 * scope.horizontalPixelRatio;
                    ctx.setLineDash([4 * scope.horizontalPixelRatio, 4 * scope.horizontalPixelRatio]);
                    ctx.beginPath();
                    ctx.moveTo(x1 * scope.horizontalPixelRatio, y1 * scope.verticalPixelRatio);
                    ctx.lineTo(x2 * scope.horizontalPixelRatio, y2 * scope.verticalPixelRatio);
                    ctx.stroke();
                    ctx.setLineDash([]);
                  }
                };
                self._lines.forEach(l => drawLine(l, 1));
                if (self._preview) drawLine(self._preview, 0.6);
              });
            }
          };
        }
      }];
    }
  }

  const tLinePrimitive = new TLinePrimitive();
  let tLineAttached = false;
  let tLineArmed = false;
  let tLinePending = null; // { time, price } of the first click of the current segment

  function toggleTLine() {
    if (!tLineAttached) { candleSeries.attachPrimitive(tLinePrimitive); tLineAttached = true; }
    tLineArmed = !tLineArmed;
    tLinePending = null;
    return tLineArmed;
  }

  // Only 1 T-Line is allowed at a time (ChartPanel.cs enforces this and calls this to undo a
  // 2nd one just drawn, after warning the user with a MessageBox).
  function removeLastTLine() {
    tLinePrimitive._lines.pop();
    forceRepaint();
  }

  // ---- H-Line tool: red line from the click point to the right edge of the chart ----

  class HLinePrimitive {
    constructor() { this._segments = []; this._chart = null; } // [{ time, price }, ...]
    attached(param) { this._chart = param.chart; }
    updateAllViews() {}
    paneViews() {
      const self = this;
      return [{
        renderer() {
          return {
            draw(target) {
              if (!self._chart) return;
              target.useBitmapCoordinateSpace(scope => {
                const ctx = scope.context;
                const ts = self._chart.timeScale();
                self._segments.forEach(seg => {
                  // timeToCoordinate requires an EXACT match against a real candle's own time —
                  // markPrevDayHiLo's anchor (built from _rawHistory, 1-minute-granularity data
                  // in C#) essentially never lands on an actual candle boundary on the 1h/15m RTH
                  // panels, so a direct call silently returned null and the line just never drew,
                  // even though C# thought it had (confirmed live via prevday_hilo_debug.log).
                  // Snap to the nearest REAL candle at/before the target instead — same fallback
                  // PisoTechoRefLinePrimitive already uses.
                  let snappedTime = seg.time;
                  if (safeTimeToCoordinate(ts, snappedTime) == null && allCandles.length > 0) {
                    let floor = null;
                    for (let i = allCandles.length - 1; i >= 0; i--) {
                      if (allCandles[i].time <= seg.time) { floor = allCandles[i].time; break; }
                    }
                    snappedTime = floor ?? allCandles[0].time;
                  }
                  const x = safeTimeToCoordinate(ts, snappedTime);
                  const y = candleSeries.priceToCoordinate(seg.price);
                  if (x == null || y == null) return;
                  ctx.strokeStyle = '#ef5350'; // red
                  ctx.lineWidth = 2 * scope.horizontalPixelRatio;
                  ctx.beginPath();
                  ctx.moveTo(x * scope.horizontalPixelRatio, y * scope.verticalPixelRatio);
                  ctx.lineTo(scope.bitmapSize.width, y * scope.verticalPixelRatio);
                  ctx.stroke();

                  if (seg.selected) {
                    ctx.strokeStyle = '#ffeb3b'; // yellow dashed overlay = selected, ready to delete
                    ctx.lineWidth = 1 * scope.horizontalPixelRatio;
                    ctx.setLineDash([4 * scope.horizontalPixelRatio, 4 * scope.horizontalPixelRatio]);
                    ctx.beginPath();
                    ctx.moveTo(x * scope.horizontalPixelRatio, y * scope.verticalPixelRatio);
                    ctx.lineTo(scope.bitmapSize.width, y * scope.verticalPixelRatio);
                    ctx.stroke();
                    ctx.setLineDash([]);
                  }
                });
              });
            }
          };
        }
      }];
    }
  }

  const hLinePrimitive = new HLinePrimitive();
  let hLineAttached = false;
  let hLineArmed = false;

  function toggleHLine() {
    if (!hLineAttached) { candleSeries.attachPrimitive(hLinePrimitive); hLineAttached = true; }
    hLineArmed = !hLineArmed;
    return hLineArmed;
  }

  // Called by C# to remove an H-Line at the given price as the ECHO of a deletion that happened
  // on a SIBLING panel (see the 'hline_delete' postMessage above) — no postMessage sent back out
  // from here, so the 3 panels don't ping-pong the same delete forever. Removes every matching
  // line at that price (there's normally at most one, but this stays correct even if two happen
  // to coincide, e.g. a manual H-Line drawn at the same price as the auto prev-day high/low).
  function removeHLine(price) {
    // Tolerance instead of strict equality — the incoming `price` round-tripped through a C#
    // decimal (Math.Round-ish precision), while a manually-clicked H-Line's stored price came
    // straight from a pixel->price conversion with many more floating-point digits. Confirmed
    // live: deleting a manually-drawn H-Line on one panel left it undeleted on the other 2,
    // because `s.price !== price` never matched despite both being "the same" price visually.
    hLinePrimitive._segments = hLinePrimitive._segments.filter(s => Math.abs(s.price - price) >= 0.005);
    forceRepaint();
  }

  // Mirrors an H-Line drawn on ANOTHER panel onto this one — additive, no postMessage sent back
  // out (unlike the click-driven push above), so the 3 panels don't ping-pong the same draw
  // forever. Same idea as addMirroredTLine.
  function addMirroredHLine(time, price) {
    if (!hLineAttached) { candleSeries.attachPrimitive(hLinePrimitive); hLineAttached = true; }
    hLinePrimitive._segments.push({ time, price, selected: false });
    forceRepaint();
  }

  // Auto-drawn previous-day High/Low — same red H-Line primitive as the manual tool above (same
  // color, same "anchor to right edge" rendering, same click-select + Delete behavior), just
  // pushed programmatically by C# instead of via a user click. Either argument can be null (the
  // reference price already broke through that side, e.g. a gap-open above yesterday's high), in
  // which case that line is simply not added.
  function markPrevDayHiLo(highTime, highPrice, lowTime, lowPrice) {
    if (!hLineAttached) { candleSeries.attachPrimitive(hLinePrimitive); hLineAttached = true; }
    if (highTime != null && highPrice != null) hLinePrimitive._segments.push({ time: highTime, price: highPrice, selected: false });
    if (lowTime != null && lowPrice != null) hLinePrimitive._segments.push({ time: lowTime, price: lowPrice, selected: false });
    forceRepaint();
  }

  // All-Time High reference line — solid, full-width (a built-in price line, not a custom
  // primitive like the other H-Lines, since this one never needs click-select/Delete/mirroring —
  // it's a single read-only reference per panel, sourced from AllTimeHighStore). Called once on
  // chart open with the persisted value, and again whenever C# updates it (a new ATH saved at the
  // 4pm close). Yellow normally; recolored green (see updateAllTimeHighBroken) while the live
  // price is trading above it, so an intraday break is visible before the file itself gets
  // updated. Visible only when BOTH the toolbar checkbox is on AND the live price is within
  // AthProximityThreshold of the ATH value (updateAllTimeHighNear, driven by
  // ChartPanel.EvaluateAllTimeHighLive on every tick) — far from the level, the line just clutters
  // the chart, per explicit request.
  let athPriceLine = null;
  // Remembered separately from the price line object itself — markAllTimeHigh recreates that
  // object from scratch every call (e.g. when a new ATH is saved at the close), which would
  // otherwise silently reset a user's "hidden"/"far away" state back to visible.
  let athVisible = true;
  let athNear = false;
  function athComputeVisible() { return athVisible && athNear; }

  function markAllTimeHigh(price) {
    if (athPriceLine) candleSeries.removePriceLine(athPriceLine);
    const visible = athComputeVisible();
    athPriceLine = candleSeries.createPriceLine({
      price, color: '#ffff00', lineWidth: 2, lineStyle: LightweightCharts.LineStyle.Solid,
      axisLabelVisible: visible, lineVisible: visible, title: 'ATH'
    });
  }

  // Toolbar checkbox — a master on/off; when on, actual visibility still depends on athNear.
  function setAllTimeHighVisible(show) {
    athVisible = show;
    if (!athPriceLine) return;
    const visible = athComputeVisible();
    athPriceLine.applyOptions({ lineVisible: visible, axisLabelVisible: visible });
  }

  // near=true while the live price is within AthProximityThreshold of the ATH value — called on
  // every tick from C#. Re-applies the combined visibility (checkbox AND proximity) each time.
  function updateAllTimeHighNear(near) {
    athNear = near;
    if (!athPriceLine) return;
    const visible = athComputeVisible();
    athPriceLine.applyOptions({ lineVisible: visible, axisLabelVisible: visible });
  }

  // show=true while the live price is currently above the ATH line — purely visual, re-evaluated
  // on every tick, no state kept here (C# tracks the actual "did today's high beat it" decision).
  function updateAllTimeHighBroken(show) {
    if (!athPriceLine) return;
    athPriceLine.applyOptions({ color: show ? '#00e676' : '#ffff00' });
  }

  // Previous day's close — dashed red line, no label, anchored at the time of the previous day's
  // closing candle and running rightward to the edge (same "anchor at a specific candle, extend
  // right" convention as the premarket blue line), instead of a full-width axis line — so it
  // visually "starts" where that candle sits rather than spanning the whole chart. A custom
  // primitive (not createPriceLine) is needed for that partial-width behavior. Persists through
  // the whole RTH session — nothing ever removes it once drawn, same as the premarket line.
  class PrevDayCloseLinePrimitive {
    constructor() { this._time = null; this._price = null; this._chart = null; }
    attached(param) { this._chart = param.chart; }
    updateAllViews() {}
    paneViews() {
      const self = this;
      return [{
        renderer() {
          return {
            draw(target) {
              if (!self._chart || self._time == null || self._price == null) return;
              target.useBitmapCoordinateSpace(scope => {
                const ctx = scope.context;
                const ts = self._chart.timeScale();
                // Same snap-to-nearest-real-candle fallback HLinePrimitive uses — falling back to
                // x=0 (the left edge, potentially several days back) whenever self._time doesn't
                // land on an exact candle made the line appear anchored on the wrong day entirely
                // instead of at/near yesterday's actual close, confirmed live (NFLX, premarket).
                let snappedTime = self._time;
                if (safeTimeToCoordinate(ts, snappedTime) == null && allCandles.length > 0) {
                  let floor = null;
                  for (let i = allCandles.length - 1; i >= 0; i--) {
                    if (allCandles[i].time <= self._time) { floor = allCandles[i].time; break; }
                  }
                  snappedTime = floor ?? allCandles[0].time;
                }
                const xRaw = safeTimeToCoordinate(ts, snappedTime);
                const x = xRaw == null ? 0 : xRaw;
                const y = candleSeries.priceToCoordinate(self._price);
                if (y == null) return;
                ctx.strokeStyle = '#ef5350';
                ctx.lineWidth = 1 * scope.horizontalPixelRatio;
                ctx.setLineDash([6 * scope.horizontalPixelRatio, 4 * scope.horizontalPixelRatio]);
                ctx.beginPath();
                ctx.moveTo(x * scope.horizontalPixelRatio, y * scope.verticalPixelRatio);
                ctx.lineTo(scope.bitmapSize.width, y * scope.verticalPixelRatio);
                ctx.stroke();
                ctx.setLineDash([]);

                // "C" label — right edge of the line, just above it.
                ctx.fillStyle = '#ef5350';
                ctx.font = `${12 * scope.verticalPixelRatio}px sans-serif`;
                ctx.textAlign = 'right';
                ctx.textBaseline = 'bottom';
                ctx.fillText('C', scope.bitmapSize.width - 4 * scope.horizontalPixelRatio, y * scope.verticalPixelRatio - 2 * scope.verticalPixelRatio);
              });
            }
          };
        }
      }];
    }
  }

  const prevDayCloseLinePrimitive = new PrevDayCloseLinePrimitive();
  let prevDayCloseLineAttached = false;

  // Daily "PM" (SMA20) reference line — solid yellow, all 3 panels, same partial-width "anchor at
  // a time, extend right" convention as PrevDayCloseLinePrimitive above (just solid instead of
  // dashed, and no "C" label). Value comes from ChartPanel.EvaluateDailyPmAndBb (computed on the
  // 1h panel only) and is relayed to all 3 panels by MultiChartForm, same as the mirrored H-Lines.
  class DailyPmLinePrimitive {
    constructor() { this._time = null; this._price = null; this._chart = null; }
    attached(param) { this._chart = param.chart; }
    updateAllViews() {}
    paneViews() {
      const self = this;
      return [{
        renderer() {
          return {
            draw(target) {
              if (!self._chart || self._time == null || self._price == null) return;
              target.useBitmapCoordinateSpace(scope => {
                const ctx = scope.context;
                const ts = self._chart.timeScale();
                // Same snap-to-nearest-real-candle fallback as PrevDayCloseLinePrimitive above.
                let snappedTime = self._time;
                if (safeTimeToCoordinate(ts, snappedTime) == null && allCandles.length > 0) {
                  let floor = null;
                  for (let i = allCandles.length - 1; i >= 0; i--) {
                    if (allCandles[i].time <= self._time) { floor = allCandles[i].time; break; }
                  }
                  snappedTime = floor ?? allCandles[0].time;
                }
                const xRaw = safeTimeToCoordinate(ts, snappedTime);
                const x = xRaw == null ? 0 : xRaw;
                const y = candleSeries.priceToCoordinate(self._price);
                if (y == null) return;
                ctx.strokeStyle = '#ffeb3b';
                ctx.lineWidth = 1 * scope.horizontalPixelRatio;
                ctx.beginPath();
                ctx.moveTo(x * scope.horizontalPixelRatio, y * scope.verticalPixelRatio);
                ctx.lineTo(scope.bitmapSize.width, y * scope.verticalPixelRatio);
                ctx.stroke();

                // "D" label — right edge, BELOW the line when price is currently above it, ABOVE
                // the line when price is currently below it (i.e. always on the far side from
                // price, out of the candles' way) — per explicit request.
                if (allCandles.length > 0) {
                  const lastPrice = allCandles[allCandles.length - 1].close;
                  const priceAbove = lastPrice > self._price;
                  ctx.fillStyle = '#ffeb3b';
                  ctx.font = `${12 * scope.verticalPixelRatio}px sans-serif`;
                  ctx.textAlign = 'right';
                  ctx.textBaseline = priceAbove ? 'top' : 'bottom';
                  const labelY = y * scope.verticalPixelRatio + (priceAbove ? 2 : -2) * scope.verticalPixelRatio;
                  ctx.fillText('D', scope.bitmapSize.width - 4 * scope.horizontalPixelRatio, labelY);
                  ctx.textAlign = 'left';
                  ctx.textBaseline = 'middle';
                }
              });
            }
          };
        }
      }];
    }
  }

  const dailyPmLinePrimitive = new DailyPmLinePrimitive();
  let dailyPmLineAttached = false;

  function markDailyPmLine(time, price) {
    if (!dailyPmLineAttached) { candleSeries.attachPrimitive(dailyPmLinePrimitive); dailyPmLineAttached = true; }
    dailyPmLinePrimitive._time = time;
    dailyPmLinePrimitive._price = price;
    forceRepaint();
  }

  // Finds the last candle of the most recent PRIOR day directly from allCandles — the same array
  // actually rendered — instead of C# separately computing which candle that is and sending a
  // time to match against. Two different aggregation paths (1h vs 15m RTH, each with their own
  // history-fetch/bucketing quirks) trying to agree on "the same" candle kept drifting apart in
  // various ways (a phantom extra bucket at the 4pm boundary, HourlyCandleStore contamination,
  // etc.) — every one of those was a symptom of the SAME root issue: two sources of truth for
  // what "yesterday's last candle" even is. This has exactly one now.
  function findPrevDayLastCandle() {
    if (allCandles.length === 0) return null;
    // The REAL current day (not "the day of the last loaded candle") — before today's first RTH/
    // premarket tick has landed, the last candle in allCandles still belongs to yesterday, which
    // made this land on the day BEFORE that (confirmed live: showing Wednesday's close instead of
    // Thursday's, premarket Friday). nowAsFakeUtcSeconds() is already in the same disguised-UTC
    // scheme candle.time/dayStartOf use, so it compares directly.
    const today = dayStartOf(nowAsFakeUtcSeconds());
    // isRthTime filters out overnight/after-hours ticks — a no-op for the 1h/15m RTH panels (every
    // candle there already IS RTH), but required on the 15m RTH+Overnight panel, where the
    // literal last candle of the prior day is often an overnight tick, not the real 4pm close
