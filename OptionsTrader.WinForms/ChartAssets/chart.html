    // (confirmed live, AAPL: panel 3 anchored on the wrong point vs. panels 1/2 without this).
    for (let i = allCandles.length - 1; i >= 0; i--) {
      if (dayStartOf(allCandles[i].time) < today && isRthTime(allCandles[i].time)) return allCandles[i];
    }
    return null; // only today loaded so far — nothing prior to anchor on yet
  }

  // time/price are now OPTIONAL. Omitted (1h/15m RTH panels — see ChartPanel.DrawPrevDayCloseAsync):
  // computed here from allCandles itself (findPrevDayLastCandle) every time this is called, so it
  // can never disagree with what's actually rendered — every "yesterday's close anchored on the
  // wrong candle" bug so far was really two different sources of truth (C#'s aggregation vs. this
  // chart's own allCandles) disagreeing in some new way. Explicit (15m RTH+Overnight panel only):
  // that panel's allCandles legitimately extends past 16:00 (overnight/after-hours ticks), where
  // "the last candle of the prior day" is NOT the real RTH close — C# still has to single that out.
  function markPrevDayClose(time, price) {
    let anchorTime = time, anchorPrice = price;
    if (anchorTime == null || anchorPrice == null) {
      const c = findPrevDayLastCandle();
      if (!c) return;
      anchorTime = c.time;
      anchorPrice = c.close;
    }
    if (!prevDayCloseLineAttached) { candleSeries.attachPrimitive(prevDayCloseLinePrimitive); prevDayCloseLineAttached = true; }
    prevDayCloseLinePrimitive._time = anchorTime;
    prevDayCloseLinePrimitive._price = anchorPrice;
    forceRepaint();
  }

  // Simulator only (panel 3, RTH+Overnight): white line marking the underlying spot price at the
  // exact moment a demo trade was opened, bounded to just that one candle's own width — computed
  // from the candle's center x (timeToCoordinate) +/- half the chart's current bar spacing, NOT a
  // 2nd timeToCoordinate call for a "next candle" time (that time doesn't necessarily match an
  // actual data point exactly, and a non-matching time silently falls back to the chart edge,
  // which is what previously made the line stretch across most of the visible chart instead of
  // sitting over just the one candle). Accumulates, one segment per trade opened — never removed.
  class EntrySpotLinePrimitive {
    constructor() { this._lines = []; this._chart = null; } // [{ time, price }, ...]
    attached(param) { this._chart = param.chart; }
    updateAllViews() {}
    paneViews() {
      const self = this;
      return [{
        renderer() {
          return {
            draw(target) {
              if (!self._chart) return;
              target.useBitmapCoordinateSpace(scope => {
                const ctx = scope.context;
                const ts = self._chart.timeScale();
                const barSpacing = ts.options().barSpacing; // CSS px per bar, current zoom level
                self._lines.forEach(l => {
                  const centerXRaw = safeTimeToCoordinate(ts, l.time);
                  if (centerXRaw == null) return; // candle scrolled out of the loaded range
                  const y = candleSeries.priceToCoordinate(l.price);
                  if (y == null) return;
                  // 3 bar-widths total, centered on the entry candle: the previous candle, the
                  // entry candle itself, and the space where the next (future) one will form.
                  const x1 = (centerXRaw - barSpacing * 1.5) * scope.horizontalPixelRatio;
                  const x2 = (centerXRaw + barSpacing * 1.5) * scope.horizontalPixelRatio;
                  ctx.strokeStyle = '#ffffff';
                  ctx.lineWidth = 2 * scope.horizontalPixelRatio;
                  ctx.beginPath();
                  ctx.moveTo(x1, y * scope.verticalPixelRatio);
                  ctx.lineTo(x2, y * scope.verticalPixelRatio);
                  ctx.stroke();
                });
              });
            }
          };
        }
      }];
    }
  }

  const entrySpotLinePrimitive = new EntrySpotLinePrimitive();
  let entrySpotLineAttached = false;

  // time omitted (the live-tick call site, opening a trade right now) — anchors to whichever
  // candle is CURRENTLY last in the series (the one actually forming), same "anchor at the last
  // loaded candle" convention markStrike/the premarket line already use. Snapshotted into the
  // stored line entry at push time, so it stays put even as later candles get added.
  //
  // time given (replaying a PREVIOUS day's still-open trade from OpenTradesStore on chart load —
  // see ChartPanel.ReplayPersistedEntryMarkersAsync) — snapped to the nearest real candle at/before
  // it, same fallback HLinePrimitive uses, since a raw C# timestamp essentially never lands on an
  // exact candle boundary. This is what lets BOTH entry lines show (yesterday's and today's) when a
  // trade opened yesterday is still open today.
  function markEntrySpot(price, time) {
    if (!entrySpotLineAttached) { candleSeries.attachPrimitive(entrySpotLinePrimitive); entrySpotLineAttached = true; }
    if (allCandles.length === 0) return;
    let anchorTime = allCandles[allCandles.length - 1].time;
    if (time !== undefined && time !== null) {
      let floor = null;
      for (let i = allCandles.length - 1; i >= 0; i--) {
        if (allCandles[i].time <= time) { floor = allCandles[i].time; break; }
      }
      anchorTime = floor ?? allCandles[0].time;
    }
    // Dedup by (anchorTime, price) — ReplayPersistedEntryMarkersAsync calls this again on every
    // LoadHistoryAsync (e.g. reopening the Live Chart window), which would otherwise push a fresh
    // duplicate segment each time instead of just re-establishing the same one.
    const alreadyMarked = entrySpotLinePrimitive._lines.some(l => l.time === anchorTime && l.price === price);
    if (!alreadyMarked) entrySpotLinePrimitive._lines.push({ time: anchorTime, price });
    forceRepaint();
  }

  // ---- Pre-market line (1h and 15m RTH panels): blue line from the LAST candle currently
  // loaded (yesterday's close, since the market hasn't opened today yet) to the right edge,
  // following the live price tick by tick until the market opens at 9:30 — after that C# simply
  // stops sending updates, so it freezes in place on its own. Same "anchor at the last loaded
  // candle" convention as markStrike's green Stk= line. Not persisted anywhere; a fresh
  // startPreMarketLine() call replaces it entirely. ----

  class PreMarketLinePrimitive {
    constructor() { this._armed = false; this._price = null; this._exposed = null; this._time = null; this._chart = null; } // _exposed: null | 'above' | 'below'
    attached(param) { this._chart = param.chart; }
    updateAllViews() {}
    paneViews() {
      const self = this;
      return [{
        renderer() {
          return {
            draw(target) {
              if (!self._chart || !self._armed || self._price == null || allCandles.length === 0) return;
              target.useBitmapCoordinateSpace(scope => {
                const ctx = scope.context;
                const ts = self._chart.timeScale();
                const y = candleSeries.priceToCoordinate(self._price);
                if (y == null) return;
                // Anchored to the session's actual open time (self._time, set once by
                // startPreMarketLine) instead of "whatever candle is currently last" — the latter
                // kept dragging this line's left edge rightward all through RTH as new candles
                // formed, even though the price itself had already frozen at 9:30. Same
                // snap-to-nearest-real-candle fallback DailyPmLinePrimitive uses.
                let snappedTime = self._time ?? allCandles[allCandles.length - 1].time;
                if (safeTimeToCoordinate(ts, snappedTime) == null) {
                  let floor = null;
                  for (let i = allCandles.length - 1; i >= 0; i--) {
                    if (allCandles[i].time <= snappedTime) { floor = allCandles[i].time; break; }
                  }
                  snappedTime = floor ?? allCandles[0].time;
                }
                const xRaw = safeTimeToCoordinate(ts, snappedTime);
                const x = xRaw == null ? 0 : xRaw;
                ctx.strokeStyle = '#2196f3'; // blue
                ctx.lineWidth = 2 * scope.horizontalPixelRatio;
                ctx.beginPath();
                ctx.moveTo(x * scope.horizontalPixelRatio, y * scope.verticalPixelRatio);
                ctx.lineTo(scope.bitmapSize.width, y * scope.verticalPixelRatio);
                ctx.stroke();

                if (self._exposed === 'above' || self._exposed === 'below') {
                  ctx.font = `bold ${13 * scope.verticalPixelRatio}px sans-serif`;
                  ctx.fillStyle = '#2196f3';
                  ctx.textAlign = 'center';
                  ctx.textBaseline = self._exposed === 'above' ? 'bottom' : 'top';
                  // Follows the line's own anchor (x, recomputed every frame from the last-loaded
                  // candle's time coordinate) instead of a fixed screen-pixel position — otherwise
                  // the text stays visually pinned to the canvas center while panning/zooming moves
                  // the line itself. Clamped so it stays on-screen if that anchor pans off-canvas.
                  const labelMargin = 40 * scope.horizontalPixelRatio;
                  const labelX = Math.min(
                    Math.max(x * scope.horizontalPixelRatio + labelMargin, labelMargin),
                    scope.bitmapSize.width - labelMargin
                  );
                  const labelY = (y * scope.verticalPixelRatio) + (self._exposed === 'above' ? -6 * scope.verticalPixelRatio : 6 * scope.verticalPixelRatio);
                  ctx.fillText('Expuesto', labelX, labelY);
                }
              });
            }
          };
        }
      }];
    }
  }

  const preMarketLinePrimitive = new PreMarketLinePrimitive();
  let preMarketLineAttached = false;

  // Called once, right when the chart opens, only if it's before 9:30 AM ET that day.
  // anchorTime (optional, same "ET digits disguised as UTC" epoch every other reference line
  // uses) is today's actual session-open time — pins the line's left edge there instead of
  // wherever the last-loaded candle happens to be, so it doesn't drift right through RTH. Falls
  // back to the old (buggy) "last candle" behavior if omitted, so any caller not yet updated to
  // pass it doesn't just silently stop drawing the line.
  function startPreMarketLine(anchorTime) {
    if (!preMarketLineAttached) { candleSeries.attachPrimitive(preMarketLinePrimitive); preMarketLineAttached = true; }
    preMarketLinePrimitive._armed = true;
    preMarketLinePrimitive._price = null;
    preMarketLinePrimitive._time = anchorTime ?? null;
    forceRepaint();
  }

  // Called on every pre-market tick until 9:30 AM ET; C# stops calling this once the market
  // opens, which is what makes the line freeze in place with no extra logic needed here.
  function updatePreMarketLine(price, exposed) {
    if (!preMarketLinePrimitive._armed) return; // startPreMarketLine wasn't called this session
    preMarketLinePrimitive._price = price;
    preMarketLinePrimitive._exposed = exposed || null;
    forceRepaint();
  }

  // ---- Arrow tool: line + arrowhead between 2 clicks — red if the 1st click is ABOVE (higher
  // price than) the 2nd click, green otherwise ----

  class ArrowPrimitive {
    constructor() { this._arrows = []; this._preview = null; this._chart = null; } // [{ l1, p1, l2, p2, red }, ...]
    attached(param) { this._chart = param.chart; }
    updateAllViews() {}
    paneViews() {
      const self = this;
      return [{
        renderer() {
          return {
            draw(target) {
              if (!self._chart) return;
              target.useBitmapCoordinateSpace(scope => {
                const ctx = scope.context;
                const ts = self._chart.timeScale();
                const drawArrow = (a, alpha) => {
                  // logicalToCoordinate (not timeToCoordinate) — extrapolates past the last/first
                  // candle, so the arrow renders correctly even into space with no bar underneath.
                  const x1 = ts.logicalToCoordinate(a.l1);
                  const x2 = ts.logicalToCoordinate(a.l2);
                  const y1 = candleSeries.priceToCoordinate(a.p1);
                  const y2 = candleSeries.priceToCoordinate(a.p2);
                  if (x1 == null || x2 == null || y1 == null || y2 == null) return;

                  const X1 = x1 * scope.horizontalPixelRatio, Y1 = y1 * scope.verticalPixelRatio;
                  const X2 = x2 * scope.horizontalPixelRatio, Y2 = y2 * scope.verticalPixelRatio;
                  const color = a.red ? `rgba(239, 83, 80, ${alpha})` : `rgba(38, 166, 154, ${alpha})`;

                  ctx.strokeStyle = color;
                  ctx.fillStyle = color;
                  ctx.lineWidth = 2 * scope.horizontalPixelRatio;
                  ctx.beginPath();
                  ctx.moveTo(X1, Y1);
                  ctx.lineTo(X2, Y2);
                  ctx.stroke();

                  // Arrowhead at the 2nd click, pointing along the line's direction.
                  const angle = Math.atan2(Y2 - Y1, X2 - X1);
                  const headLen = 10 * scope.horizontalPixelRatio;
                  const headAngle = Math.PI / 7;
                  ctx.beginPath();
                  ctx.moveTo(X2, Y2);
                  ctx.lineTo(X2 - headLen * Math.cos(angle - headAngle), Y2 - headLen * Math.sin(angle - headAngle));
                  ctx.lineTo(X2 - headLen * Math.cos(angle + headAngle), Y2 - headLen * Math.sin(angle + headAngle));
                  ctx.closePath();
                  ctx.fill();

                  if (a.selected) {
                    ctx.strokeStyle = '#ffeb3b'; // yellow overlay = selected, ready to delete
                    ctx.lineWidth = 1 * scope.horizontalPixelRatio;
                    ctx.setLineDash([4 * scope.horizontalPixelRatio, 4 * scope.horizontalPixelRatio]);
                    ctx.beginPath();
                    ctx.moveTo(X1, Y1);
                    ctx.lineTo(X2, Y2);
                    ctx.stroke();
                    ctx.setLineDash([]);
                  }
                };
                self._arrows.forEach(a => drawArrow(a, 1));
                if (self._preview) drawArrow(self._preview, 0.6);
              });
            }
          };
        }
      }];
    }
  }

  const arrowPrimitive = new ArrowPrimitive();
  let arrowAttached = false;
  let arrowArmed = false;
  let arrowPending = null; // { time, price } of the first click of the current arrow

  function toggleArrow() {
    if (!arrowAttached) { candleSeries.attachPrimitive(arrowPrimitive); arrowAttached = true; }
    arrowArmed = !arrowArmed;
    arrowPending = null;
    return arrowArmed;
  }

  // ---- Vertical arrow tool (1h panel): single click places a fixed-length vertical arrow, tip
  // at the clicked point — green pointing UP (tail below), red pointing DOWN (tail above).
  // Selectable by clicking the shaft, removable with Delete (same pattern as gray Rect/T-Line). ----

  const VERTICAL_ARROW_LENGTH = 40; // CSS pixels, fixed regardless of zoom

  class VerticalArrowPrimitive {
    constructor() { this._arrows = []; this._chart = null; } // [{ time, price, up, selected }, ...]
    attached(param) { this._chart = param.chart; }
    updateAllViews() {}
    paneViews() {
      const self = this;
      return [{
        renderer() {
          return {
            draw(target) {
              if (!self._chart) return;
              target.useBitmapCoordinateSpace(scope => {
                const ctx = scope.context;
                const ts = self._chart.timeScale();
                self._arrows.forEach(a => {
                  const x = safeTimeToCoordinate(ts, a.time);
                  const yTip = candleSeries.priceToCoordinate(a.price);
                  if (x == null || yTip == null) return;

                  const X = x * scope.horizontalPixelRatio;
                  const YTip = yTip * scope.verticalPixelRatio;
                  const lengthPx = VERTICAL_ARROW_LENGTH * scope.verticalPixelRatio;
                  const YTail = a.up ? YTip + lengthPx : YTip - lengthPx;
                  const color = a.up ? '#26a69a' : '#ef5350';

                  ctx.strokeStyle = color;
                  ctx.fillStyle = color;
                  ctx.lineWidth = 2 * scope.horizontalPixelRatio;
                  ctx.beginPath();
                  ctx.moveTo(X, YTail);
                  ctx.lineTo(X, YTip);
                  ctx.stroke();

                  const headLen = 8 * scope.verticalPixelRatio;
                  const headWidth = 5 * scope.horizontalPixelRatio;
                  const headBackY = a.up ? YTip + headLen : YTip - headLen;
                  ctx.beginPath();
                  ctx.moveTo(X, YTip);
                  ctx.lineTo(X - headWidth, headBackY);
                  ctx.lineTo(X + headWidth, headBackY);
                  ctx.closePath();
                  ctx.fill();

                  if (a.selected) {
                    ctx.strokeStyle = '#ffeb3b';
                    ctx.lineWidth = 1 * scope.horizontalPixelRatio;
                    ctx.setLineDash([4 * scope.horizontalPixelRatio, 4 * scope.horizontalPixelRatio]);
                    ctx.beginPath();
                    ctx.moveTo(X, YTail);
                    ctx.lineTo(X, YTip);
                    ctx.stroke();
                    ctx.setLineDash([]);
                  }
                });
              });
            }
          };
        }
      }];
    }
  }

  const verticalArrowPrimitive = new VerticalArrowPrimitive();
  let verticalArrowAttached = false;
  let greenArrowArmed = false;
  let redArrowArmed = false;

  function toggleGreenArrow() {
    if (!verticalArrowAttached) { candleSeries.attachPrimitive(verticalArrowPrimitive); verticalArrowAttached = true; }
    greenArrowArmed = !greenArrowArmed;
    return greenArrowArmed;
  }

  function toggleRedArrow() {
    if (!verticalArrowAttached) { candleSeries.attachPrimitive(verticalArrowPrimitive); verticalArrowAttached = true; }
    redArrowArmed = !redArrowArmed;
    return redArrowArmed;
  }

  // CSS-pixel endpoints of a vertical arrow's shaft, for hit-testing (same space as
  // chart.subscribeClick's param.point). Returns null if either coordinate is off-screen.
  function verticalArrowEndpoints(a) {
    const ts = chart.timeScale();
    const x = safeTimeToCoordinate(ts, a.time);
    const yTip = candleSeries.priceToCoordinate(a.price);
    if (x == null || yTip == null) return null;
    const yTail = a.up ? yTip + VERTICAL_ARROW_LENGTH : yTip - VERTICAL_ARROW_LENGTH;
    return { x, yTip, yTail };
  }

  function findVerticalArrowByClick(px, py) {
    const tolerance = 6;
    for (let i = verticalArrowPrimitive._arrows.length - 1; i >= 0; i--) {
      const pts = verticalArrowEndpoints(verticalArrowPrimitive._arrows[i]);
      if (!pts) continue;
      if (distToSegment(px, py, pts.x, pts.yTip, pts.x, pts.yTail) <= tolerance) return i;
    }
    return -1;
  }

  // ---- Dragging a selected vertical arrow ----
  // mousedown on an already-selected arrow's shaft starts a drag instead of letting the chart pan;
  // mousemove while dragging updates the arrow's tip (time/price) to follow the cursor;
  // mouseup ends it and restores normal chart pan/zoom.
  let draggingArrowIdx = -1;
  let draggingArrowOriginal = null; // { time, price, up } captured at mousedown, to report the move

  container.addEventListener('mousedown', ev => {
    const idx = verticalArrowPrimitive._arrows.findIndex(a => a.selected);
    if (idx === -1) return;
    const rect = container.getBoundingClientRect();
    const px = ev.clientX - rect.left, py = ev.clientY - rect.top;
    const pts = verticalArrowEndpoints(verticalArrowPrimitive._arrows[idx]);
    if (!pts || distToSegment(px, py, pts.x, pts.yTip, pts.x, pts.yTail) > 6) return;

    draggingArrowIdx = idx;
    const a = verticalArrowPrimitive._arrows[idx];
    draggingArrowOriginal = { time: a.time, price: a.price, up: a.up };
    chart.applyOptions({ handleScroll: false, handleScale: false }); // don't pan/zoom the chart while dragging
    ev.preventDefault();
    ev.stopPropagation();
  });

  container.addEventListener('mousemove', ev => {
    if (draggingArrowIdx === -1) return;
    const rect = container.getBoundingClientRect();
    const px = ev.clientX - rect.left, py = ev.clientY - rect.top;
    const time = chart.timeScale().coordinateToTime(px);
    const price = candleSeries.coordinateToPrice(py);
    if (time == null || price == null) return;
    verticalArrowPrimitive._arrows[draggingArrowIdx].time = time;
    verticalArrowPrimitive._arrows[draggingArrowIdx].price = price;
    forceRepaint();
  });

  window.addEventListener('mouseup', () => {
    if (draggingArrowIdx === -1) return;
    const a = verticalArrowPrimitive._arrows[draggingArrowIdx];
    const moved = draggingArrowOriginal && (a.time !== draggingArrowOriginal.time || a.price !== draggingArrowOriginal.price);
    if (moved && window.chrome && window.chrome.webview) {
      window.chrome.webview.postMessage({
        type: 'arrow_move',
        oldTime: draggingArrowOriginal.time, oldPrice: draggingArrowOriginal.price, up: draggingArrowOriginal.up,
        newTime: a.time, newPrice: a.price,
      });
    }
    draggingArrowIdx = -1;
    draggingArrowOriginal = null;
    chart.applyOptions({ handleScroll: true, handleScale: true });
  });

  // ---- Piso/Techo tool: writes orange text at the clicked point (1h panel) — single click per
  // label, no pairing (unlike the 2-click tools above) ----

  class TextLabelsPrimitive {
    constructor() { this._labels = []; this._chart = null; } // [{ time, price, text }, ...]
    attached(param) { this._chart = param.chart; }
    updateAllViews() {}
    paneViews() {
      const self = this;
      return [{
        renderer() {
          return {
            draw(target) {
              if (!self._chart) return;
              target.useBitmapCoordinateSpace(scope => {
                const ctx = scope.context;
                const ts = self._chart.timeScale();
                ctx.font = `${12 * scope.verticalPixelRatio}px sans-serif`;
                ctx.textBaseline = 'middle';
                self._labels.forEach(l => {
                  ctx.fillStyle = l.color || '#ff9800'; // orange default (Piso/Techo)
                  const size = l.fontSize || (l.bold ? 14 : 12);
                  ctx.font = l.bold ? `bold ${size * scope.verticalPixelRatio}px sans-serif` : `${size * scope.verticalPixelRatio}px sans-serif`;

                  // Fixed at the top-center of the chart pane, ignoring pan/zoom/price entirely —
                  // used for markExpired, which needs to stay put and readable regardless of where
                  // the last candle's price happens to be.
                  if (l.fixedTop) {
                    ctx.textAlign = 'center';
                    ctx.fillText(l.text, scope.bitmapSize.width / 2, (70 - (l.offsetY || 0)) * scope.verticalPixelRatio);
                    ctx.textAlign = 'left';
                    return;
                  }

                  // Same idea as fixedTop, but anchored near the bottom-center instead.
                  if (l.fixedBottom) {
                    ctx.textAlign = 'center';
                    ctx.fillText(l.text, scope.bitmapSize.width / 2, scope.bitmapSize.height - 16 * scope.verticalPixelRatio);
                    ctx.textAlign = 'left';
                    return;
                  }

                  // Same idea, bottom-LEFT — used for "PM" (Punto Medio / SMA20 slope), moved out
                  // here so it doesn't sit on top of "1er Rebote: 90%" (fixedBottomRight below).
                  // Optional offsetX (in un-scaled px) lets a second label — "BB" — sit right next
                  // to "PM" instead of on top of it. Optional offsetY (positive = further UP, since
                  // this is measured from the bottom) stacks a second ROW above the first — used by
                  // "D.PM"/"BB" (Daily), which sit directly above the hourly "PM"/"BB" instead of
                  // fighting them for horizontal room on a narrow panel.
                  if (l.fixedBottomLeft) {
                    ctx.textAlign = 'left';
                    ctx.fillText(l.text, (10 + (l.offsetX || 0)) * scope.horizontalPixelRatio,
                      scope.bitmapSize.height - (16 + (l.offsetY || 0)) * scope.verticalPixelRatio);
                    return;
                  }

                  // Same idea, bottom-RIGHT instead — used for "1er Rebote: 90%".
                  if (l.fixedBottomRight) {
                    ctx.textAlign = 'right';
                    ctx.fillText(l.text, scope.bitmapSize.width - 10 * scope.horizontalPixelRatio, scope.bitmapSize.height - 16 * scope.verticalPixelRatio);
                    ctx.textAlign = 'left';
                    return;
                  }

                  const x = safeTimeToCoordinate(ts, l.time);
                  const y = candleSeries.priceToCoordinate(l.price);
                  if (x == null || y == null) return;
                  if (l.above) {
                    // Anchored at/near the LAST candle (e.g. markExpired) sits right where
                    // Lightweight Charts draws its own "last price" label box, on the same y —
                    // the default right-of-point placement below gets hidden behind it. Draw
                    // above and ending AT the point instead, clear of that label.
                    ctx.textAlign = 'right';
                    ctx.fillText(l.text, x * scope.horizontalPixelRatio, y * scope.verticalPixelRatio - 14 * scope.verticalPixelRatio);
                    ctx.textAlign = 'left';
                  } else {
                    ctx.fillText(l.text, x * scope.horizontalPixelRatio + 4, y * scope.verticalPixelRatio);
                  }
                });
              });
            }
          };
        }
      }];
    }
  }

  const textLabelsPrimitive = new TextLabelsPrimitive();
  let textLabelsAttached = false;

  // ---- Piso/Techo AUTO label (1h panel only): programmatic (markPisoTecho, called once by C#
  // from the pre-market SMA pair analysis — independently for the 20/40 pair and the 100/200
  // pair) and tracks the CURRENT last point of each SMA line on every repaint — via smaLastPoint,
  // updated by recalculateSmas() — so each label moves right alongside its SMA all session long
  // instead of staying pinned to where it was first drawn. ----

  class PisoTechoAutoLabelPrimitive {
    constructor() { this._entries = []; this._chart = null; } // [{ period, text }, ...]
    attached(param) { this._chart = param.chart; }
    updateAllViews() {}
    paneViews() {
      const self = this;
      return [{
        renderer() {
          return {
            draw(target) {
              if (!self._chart || self._entries.length === 0) return;
              target.useBitmapCoordinateSpace(scope => {
                const ctx = scope.context;
                const ts = self._chart.timeScale();
                ctx.fillStyle = '#ff9800'; // orange
                ctx.font = `${12 * scope.verticalPixelRatio}px sans-serif`;
                ctx.textBaseline = 'middle';
                self._entries.forEach(({ period, text }) => {
                  const pt = smaLastPoint[period];
                  if (!pt) return;
                  // timeToCoordinate can THROW (not just return null) for an off-bar time — and
                  // since this primitive typically attaches before the drawing-tool primitives
                  // (Rect/T-Line etc.), an uncaught throw here every animation frame silently kept
                  // THOSE from ever painting too, even though their own data was added correctly.
                  let x;
                  try { x = safeTimeToCoordinate(ts, pt.time); } catch { x = null; }
                  const y = candleSeries.priceToCoordinate(pt.value);
                  if (x == null || y == null) return;
                  ctx.fillText(text, x * scope.horizontalPixelRatio + 4, y * scope.verticalPixelRatio);
                });
              });
            }
          };
        }
      }];
    }
  }

  const pisoTechoAutoLabelPrimitive = new PisoTechoAutoLabelPrimitive();
  let pisoTechoAutoLabelAttached = false;

  // ---- SMA cross watch marker (Daily tab only) — an eye icon over the current point of whatever
  // SMA20/40/100/200 the user armed via DailyChartForm's "SMA Watch" buttons. Purely visual + a
  // click-to-select/Delete convenience here; the actual live-price-cross monitoring, Telegram
  // push, and event log all happen in C# (ChartPanel.EvaluateSmaCrossWatches), independent of
  // whether this window is even open — see SmaDailyWatchStore.cs. ----

  class SmaWatchPrimitive {
    constructor() { this._periods = []; this._selected = null; this._chart = null; } // periods: [20, 40, ...]
    attached(param) { this._chart = param.chart; }
    updateAllViews() {}
    paneViews() {
      const self = this;
      return [{
        renderer() {
          return {
            draw(target) {
              if (!self._chart || self._periods.length === 0) return;
              target.useBitmapCoordinateSpace(scope => {
                const ctx = scope.context;
                const ts = self._chart.timeScale();
                ctx.font = `${13 * scope.verticalPixelRatio}px sans-serif`;
                ctx.textBaseline = 'middle';
                self._periods.forEach(period => {
                  const pt = smaLastPoint[period];
                  if (!pt) return;
                  let x;
                  try { x = safeTimeToCoordinate(ts, pt.time); } catch { x = null; }
                  const y = candleSeries.priceToCoordinate(pt.value);
                  if (x == null || y == null) return;
                  ctx.fillStyle = period === self._selected ? '#ffeb3b' : '#ffffff';
                  ctx.fillText('\u{1F441}', x * scope.horizontalPixelRatio - 20 * scope.horizontalPixelRatio, y * scope.verticalPixelRatio);
                });
              });
            }
          };
        }
      }];
    }
  }

  const smaWatchPrimitive = new SmaWatchPrimitive();
  let smaWatchAttached = false;

  // Called by C# on open (replaying SmaDailyWatchStore) and whenever a watch is armed/removed via
  // the toolbar buttons — always the FULL current list, same "replace, not append" convention
  // loadRects/loadTLines use.
  function loadSmaWatches(periods) {
    if (!smaWatchAttached) { candleSeries.attachPrimitive(smaWatchPrimitive); smaWatchAttached = true; }
    smaWatchPrimitive._periods = periods || [];
    forceRepaint();
  }

  function findSmaWatchByClick(px, py) {
    const tolerance = 10;
    for (let i = smaWatchPrimitive._periods.length - 1; i >= 0; i--) {
      const period = smaWatchPrimitive._periods[i];
      const pt = smaLastPoint[period];
      if (!pt) continue;
      const ts = chart.timeScale();
      let x;
      try { x = safeTimeToCoordinate(ts, pt.time); } catch { x = null; }
      const y = candleSeries.priceToCoordinate(pt.value);
      if (x == null || y == null) continue;
      const markerX = x - 20, markerY = y;
      if (Math.hypot(px - markerX, py - markerY) <= tolerance) return period;
    }
    return -1;
  }

  // Green hint lines overlaid at the bottom of the chart itself (not a WinForms Label docked
  // below it) — so an empty hint reserves no layout space and every panel stays the same height
  // regardless of which hints are active. Called by ChartPanel via ExecuteScriptAsync.
  function setTLineHint(text) { document.getElementById('hintTLine').textContent = text || ''; }
  function setDailyBounceHint(text) { document.getElementById('hintDailyBounce').textContent = text || ''; }

  // Premarket Bollinger-exposure banner — shown when C# (MultiChartForm) determines the premarket
  // price broke the SAME side of the Bollinger band (upper or lower) on Daily, 1h, AND 15m RTH
  // simultaneously. Re-evaluated on every premarket tick, so hideExposureBanner is called just as
  // often once the condition stops holding.
  function showExposureBanner(text) {
    const el = document.getElementById('exposureBanner');
    el.textContent = text;
    el.style.display = 'block';
  }
  function hideExposureBanner() {
    document.getElementById('exposureBanner').style.display = 'none';
  }

  // Called once per SMA pair by C# after the pre-market read (see ChartPanel's one-time
  // analysis) — periodA/periodB identify which pair (20+40 or 100+200). textA/textB are each
  // independently 'Piso', 'Techo', or null (no signal for THAT specific SMA — e.g. price opened
  // between the two, so only the slower one still counts) — no longer forced to match each other.
  // Safe to call again on every Live Chart reopen with the SAME remembered text — it just
  // re-renders, the position always comes from smaLastPoint at draw time.
  function markPisoTecho(periodA, textA, periodB, textB) {
    if (!pisoTechoAutoLabelAttached) { candleSeries.attachPrimitive(pisoTechoAutoLabelPrimitive); pisoTechoAutoLabelAttached = true; }
    pisoTechoAutoLabelPrimitive._entries = pisoTechoAutoLabelPrimitive._entries.filter(e => e.period !== periodA && e.period !== periodB);
    if (textA) pisoTechoAutoLabelPrimitive._entries.push({ period: periodA, text: textA });
    if (textB) pisoTechoAutoLabelPrimitive._entries.push({ period: periodB, text: textB });
    forceRepaint();
  }

  // Called by C# (ValidatePisoTechoAgainstOpen) when the actual market-open price already broke
  // a single SMA's Piso/Techo label — removes just that one period's entry, leaving the other
  // SMA of the pair (if any) untouched.
  function removePisoTechoLabel(period) {
    pisoTechoAutoLabelPrimitive._entries = pisoTechoAutoLabelPrimitive._entries.filter(e => e.period !== period);
    forceRepaint();
  }

  // Programmatic (not click-driven) red "Expired!!!" marker — fixed at the top-center of the
  // chart pane (see TextLabelsPrimitive's fixedTop handling), triggered from C# when a trade
  // auto-closes at 4pm ET because it expired today. Not anchored to price/time, so it stays
  // readable regardless of where the last candle happens to sit.
  function markExpired() {
    if (!textLabelsAttached) { candleSeries.attachPrimitive(textLabelsPrimitive); textLabelsAttached = true; }
    if (allCandles.length === 0) return false;
    textLabelsPrimitive._labels.push({ text: 'Expired!!!', color: '#ff0000', bold: true, fixedTop: true });
    forceRepaint();
    return true;
  }

  // "PM" (Punto Medio / SMA20 slope) live indicator — 1h and 15m RTH panels only, updated on every
  // live tick from C# (EvaluatePuntoMedioSlope). Green when the SMA20 is tilting up, red when
  // tilting down. Unlike markExpired's one-shot label, this REPLACES its own previous entry each
  // call instead of accumulating — only ever one "PM" label showing at a time.
  // `large` (set by MultiChartForm when BOTH panels' PM currently agree) is still passed but no
  // longer changes the font size — PM/BB/Δ must always render at the SAME fixed size (14px) so
  // their spacing (offsetX 0/28/56) and character size stay visually consistent whether or not
  // they happen to agree, instead of PM jumping to 20px and throwing the row out of alignment.
  function updatePuntoMedio(bullish, large) {
    if (!textLabelsAttached) { candleSeries.attachPrimitive(textLabelsPrimitive); textLabelsAttached = true; }
    textLabelsPrimitive._labels = textLabelsPrimitive._labels.filter(l => l.id !== 'pm');
    textLabelsPrimitive._labels.push({
      id: 'pm', text: 'PM', color: bullish ? '#4caf50' : '#ef5350', bold: true, fixedBottomLeft: true,
      fontSize: 14
    });
    forceRepaint();
  }

  // "BB" — 15m RTH panel only, sits right next to "PM" (bottom-left, offset over). Shown while the
  // Bollinger Bands are CURRENTLY widening (see ChartPanel.EvaluateBollingerWideningLabel) —
  // purely visual, not tied to whether a Cruce/Rebote watch is armed. Colored to match this
  // panel's own PM. show=false removes it instead of pushing an empty label.
  function updateBollingerWidening(show, bullish) {
    if (!textLabelsAttached) { candleSeries.attachPrimitive(textLabelsPrimitive); textLabelsAttached = true; }
    textLabelsPrimitive._labels = textLabelsPrimitive._labels.filter(l => l.id !== 'bb');
    if (show) {
      textLabelsPrimitive._labels.push({
        id: 'bb', text: 'BB', color: bullish ? '#4caf50' : '#ef5350', bold: true, fixedBottomLeft: true,
        fontSize: 14, offsetX: 28 // clears "PM" at the same fixed 14px font size
      });
    }
    forceRepaint();
  }

  // "Spot fuera de BB" — 15m RTH panel only, red text fixed at the top-center of the pane (same
  // fixedTop convention as markExpired). Shown while the live price is currently outside this
  // panel's own Bollinger(20,2) band, RTH only (see ChartPanel.EvaluateSpotOutsideBollinger) —
  // hidden the moment price is back inside. Replace-not-accumulate, same as PM/BB/Δ.
  function updateSpotOutsideBB(show) {
    if (!textLabelsAttached) { candleSeries.attachPrimitive(textLabelsPrimitive); textLabelsAttached = true; }
    textLabelsPrimitive._labels = textLabelsPrimitive._labels.filter(l => l.id !== 'spotOutsideBB');
    if (show) {
      textLabelsPrimitive._labels.push({
        id: 'spotOutsideBB', text: 'Spot fuera de BB', color: '#ff0000', bold: true, fixedTop: true,
        offsetY: 45 // higher up than the default fixedTop position — was sitting right on top of the upper Bollinger band
      });
    }
    forceRepaint();
  }

  // "Δ0.42" — sits right next to "BB" (bottom-left, offset further over). Shown while price is
  // still between the widening Bollinger Bands (see ChartPanel.EvaluateBollingerWideningLabel) —
  // the live distance to whichever band is closer. Hidden the moment BB itself hides, or price
  // actually breaks a band. Same replace-not-accumulate pattern as PM/BB.
  function updateBollingerDelta(show, delta, bullish) {
    if (!textLabelsAttached) { candleSeries.attachPrimitive(textLabelsPrimitive); textLabelsAttached = true; }
    textLabelsPrimitive._labels = textLabelsPrimitive._labels.filter(l => l.id !== 'bbdelta');
    if (show) {
      textLabelsPrimitive._labels.push({
        id: 'bbdelta', text: `Δ${delta.toFixed(2)}`, color: bullish ? '#4caf50' : '#ef5350', bold: true, fixedBottomLeft: true,
        fontSize: 14, offsetX: 56 // clears "PM" + "BB" at the same fixed 14px font size
      });
    }
    forceRepaint();
  }

  // "D.PM" — 1h panel only, sits directly ABOVE "PM" (same X, a row higher via offsetY) — see
  // ChartPanel.EvaluateDailyPmAndBb. SMA20 slope of the DAILY chart (today, using the live price
  // as today's still-forming close, vs 2 closed days ago) — a separate, slower-timeframe signal
  // from the hourly "PM" right below it, not a replacement for it. Same replace-not-accumulate
  // pattern as the others.
  function updateDailyPuntoMedio(bullish) {
    if (!textLabelsAttached) { candleSeries.attachPrimitive(textLabelsPrimitive); textLabelsAttached = true; }
    textLabelsPrimitive._labels = textLabelsPrimitive._labels.filter(l => l.id !== 'dailyPm');
    textLabelsPrimitive._labels.push({
      id: 'dailyPm', text: 'D.PM', color: bullish ? '#4caf50' : '#ef5350', bold: true, fixedBottomLeft: true,
      fontSize: 14, offsetY: 20 // one row above "PM" (offsetX 0, same column)
    });
    forceRepaint();
  }

  // "BB" (Daily) — 1h panel only, sits next to "D.PM" (same row, one row above the hourly "BB").
  // Always shown (unlike the hourly "BB", which only appears while actively widening) — green
  // while the DAILY Bollinger(20,2) bands are open (both moving outward, today live vs
  // yesterday's closed bar), red while closed/contracting.
  function updateDailyBb(open) {
    if (!textLabelsAttached) { candleSeries.attachPrimitive(textLabelsPrimitive); textLabelsAttached = true; }
    textLabelsPrimitive._labels = textLabelsPrimitive._labels.filter(l => l.id !== 'dailyBb');
    textLabelsPrimitive._labels.push({
      id: 'dailyBb', text: 'BB', color: open ? '#4caf50' : '#ef5350', bold: true, fixedBottomLeft: true,
      fontSize: 14, offsetX: 50, offsetY: 20 // clears "D.PM" (wider than PM/BB/Δ), same row
    });
    forceRepaint();
  }

  // "1er Rebote: 90%" — 1h panel only, bottom-right, yellow. Shown while SMA20 and SMA40 are both
  // Techo and SMA20 hasn't been touched/resolved yet (see ChartPanel.EvaluateFirstReboundLabel).
  // Same replace-not-accumulate pattern as updatePuntoMedio.
  function updateFirstRebound(show) {
    if (!textLabelsAttached) { candleSeries.attachPrimitive(textLabelsPrimitive); textLabelsAttached = true; }
    textLabelsPrimitive._labels = textLabelsPrimitive._labels.filter(l => l.id !== 'firstRebound');
    if (show) {
      textLabelsPrimitive._labels.push({
        id: 'firstRebound', text: '1er Rebote: 90%', color: '#ffeb3b', bold: true, fixedBottomRight: true
      });
    }
    forceRepaint();
  }

  // ---- Strike marker: full-width green line + "Stk=xxx" label, drawn programmatically when a
  // trade (demo or real) opens — see markStrike below. Accumulates, one per trade, never removed
  // automatically (stays as a historical reference even after the trade closes). ----

  class StrikeLinesPrimitive {
    constructor() { this._lines = []; this._chart = null; } // [{ time, price, label, selected }, ...]
    attached(param) { this._chart = param.chart; }
    updateAllViews() {}
    paneViews() {
      const self = this;
      return [{
        renderer() {
          return {
            draw(target) {
              if (!self._chart) return;
              target.useBitmapCoordinateSpace(scope => {
                const ctx = scope.context;
                const ts = self._chart.timeScale();
                self._lines.forEach(l => {
                  const y = candleSeries.priceToCoordinate(l.price);
                  // xRaw is null once the entry candle scrolls out of the loaded range (e.g. a
                  // multi-day context) — start from the left edge instead of skipping the line.
                  const xRaw = safeTimeToCoordinate(ts, l.time);
                  const x = xRaw == null ? 0 : xRaw;
                  if (y == null) return;
                  ctx.strokeStyle = '#00c853'; // green
                  ctx.lineWidth = 2 * scope.horizontalPixelRatio;
                  ctx.beginPath();
                  ctx.moveTo(x * scope.horizontalPixelRatio, y * scope.verticalPixelRatio);
                  ctx.lineTo(scope.bitmapSize.width, y * scope.verticalPixelRatio);
                  ctx.stroke();

                  ctx.fillStyle = '#00c853';
                  ctx.font = `bold ${12 * scope.verticalPixelRatio}px sans-serif`;
                  ctx.textBaseline = 'bottom';
                  ctx.textAlign = 'right';
                  ctx.fillText(l.label, scope.bitmapSize.width - 4, y * scope.verticalPixelRatio - 2);
                  ctx.textAlign = 'left'; // reset — other primitives assume the default

                  if (l.selected) {
                    ctx.save();
                    ctx.strokeStyle = '#ffeb3b';
                    ctx.lineWidth = 2 * scope.horizontalPixelRatio;
                    ctx.setLineDash([6 * scope.horizontalPixelRatio, 4 * scope.horizontalPixelRatio]);
                    ctx.beginPath();
                    ctx.moveTo(x * scope.horizontalPixelRatio, y * scope.verticalPixelRatio + 3 * scope.verticalPixelRatio);
                    ctx.lineTo(scope.bitmapSize.width, y * scope.verticalPixelRatio + 3 * scope.verticalPixelRatio);
                    ctx.stroke();
                    ctx.restore();
                  }
                });
              });
            }
          };
        }
      }];
    }
  }

  const strikeLinesPrimitive = new StrikeLinesPrimitive();
  let strikeLinesAttached = false;

  // Anchors at the LAST candle currently loaded (i.e. "now", the moment the trade opened) instead
  // of the left edge — same "current candle to the right edge" convention as the H-Line tool.
  // label is optional — defaults to "Stk={price}"; TimeframeViewerForm's "5 OTM strikes on
  // rebote" feature passes a custom "Stk={price}   Ask={ask}" label instead.
  function markStrike(price, label) {
    if (!strikeLinesAttached) { candleSeries.attachPrimitive(strikeLinesPrimitive); strikeLinesAttached = true; }
    if (allCandles.length === 0) return;
    const anchorTime = allCandles[allCandles.length - 1].time;
    strikeLinesPrimitive._lines.push({ time: anchorTime, price, label: label || `Stk=${price}`, selected: false });
    forceRepaint();
  }

  // Called by C# to remove a Stk line pushed here as the ECHO of a deletion that happened on a
  // SIBLING panel (see the 'strike_delete' postMessage in the keydown handler below) — no
  // postMessage sent back out from here, so the 3 panels don't ping-pong the same delete forever.
  function removeStrikeLine(price) {
    strikeLinesPrimitive._lines = strikeLinesPrimitive._lines.filter(l => l.price !== price);
    // Same cross-removal as the local Delete-key path — matters on this panel if it's the one
    // (15m RTH+Overnight) that actually has a ΔS label for this strike; a no-op elsewhere.
    deltaSPrimitive._labels = deltaSPrimitive._labels.filter(l => l.price !== price);
    forceRepaint();
  }

  // Appends text to an existing Stk line's label in place (doesn't remove/redraw the line) — used
  // by TimeframeViewerForm to add "   Bid=xxx" to the "Stk=xxx   Ask=xxx" label once the SpotPrice
  // cross confirms, keeping the original line exactly where it was.
  function appendStrikeLineLabel(price, extraText) {
    strikeLinesPrimitive._lines.forEach(l => { if (l.price === price) l.label += extraText; });
    forceRepaint();
  }

  // Returns the index of the Stk line (full-width, click point -> right edge, same shape as
  // H-Line) within a few pixels of (px,py), or -1.
  function findStrikeLineByClick(px, py) {
    const ts = chart.timeScale();
    const tolerance = 6;
    for (let i = strikeLinesPrimitive._lines.length - 1; i >= 0; i--) {
      const l = strikeLinesPrimitive._lines[i];
      const xRaw = safeTimeToCoordinate(ts, l.time);
      const x = xRaw == null ? 0 : xRaw;
      const y = candleSeries.priceToCoordinate(l.price);
      if (y == null) continue;
      if (distToSegment(px, py, x, y, chart.timeScale().width(), y) <= tolerance) return i;
    }
    return -1;
  }

  // ---- "ΔS=value" label at trade close — own dedicated primitive (not TextLabelsPrimitive,
  // which has no selection) so it can be click-selected and removed with Delete, same as the
  // other drawing tools. value is the absolute move of the underlying between entry and close (no
  // sign, magnitude only). Δ is the actual Greek delta character (a triangle), per request,
  // instead of spelling out "Delta". Anchored at the trade's STRIKE price (same y as its green
  // "Stk=xxx" line) and drawn right-aligned at the right edge, just BELOW that line — mirrors
  // StrikeLinesPrimitive's own label, which sits just above it. ----

  class DeltaSPrimitive {
    constructor() { this._labels = []; this._chart = null; } // [{ price, text, selected }, ...]
    attached(param) { this._chart = param.chart; }
    updateAllViews() {}
    paneViews() {
      const self = this;
      return [{
        renderer() {
          return {
            draw(target) {
              if (!self._chart) return;
              target.useBitmapCoordinateSpace(scope => {
                const ctx = scope.context;
                self._labels.forEach(l => {
                  const y = candleSeries.priceToCoordinate(l.price);
                  if (y == null) return;

                  ctx.font = `bold ${12 * scope.verticalPixelRatio}px sans-serif`;
                  ctx.textBaseline = 'top';
                  ctx.textAlign = 'right';
                  const textX = scope.bitmapSize.width - 4 * scope.horizontalPixelRatio;
                  const textY = y * scope.verticalPixelRatio + 2 * scope.verticalPixelRatio;

                  if (l.selected) {
                    const width = ctx.measureText(l.text).width;
                    const height = 14 * scope.verticalPixelRatio;
                    ctx.save();
                    ctx.strokeStyle = '#ffeb3b';
                    ctx.setLineDash([6 * scope.horizontalPixelRatio, 4 * scope.horizontalPixelRatio]);
                    ctx.strokeRect(textX - width - 2, textY - 2, width + 4, height + 4);
                    ctx.restore();
                  }

                  ctx.fillStyle = '#ffeb3b';
                  ctx.fillText(l.text, textX, textY);
                  ctx.textAlign = 'left';
                });
              });
            }
          };
        }
      }];
    }
  }

  const deltaSPrimitive = new DeltaSPrimitive();
  let deltaSAttached = false;

  function markDeltaS(entrySpot, closeSpot, strike) {
    if (!deltaSAttached) { candleSeries.attachPrimitive(deltaSPrimitive); deltaSAttached = true; }
    const delta = Math.abs(closeSpot - entrySpot);
    deltaSPrimitive._labels.push({ price: strike, text: `ΔS=${delta.toFixed(2)}`, selected: false });
    forceRepaint();
  }

  // Approximate CSS-pixel hit box for a right-aligned ΔS label (no exact ctx.measureText
  // available outside the bitmap draw() context) — same tolerance-based approach as the other
  // click hit-tests in this file.
  function findDeltaSByClick(px, py) {
    const chartWidthCss = chart.timeScale().width();
    const tolerance = 4;
    for (let i = deltaSPrimitive._labels.length - 1; i >= 0; i--) {
      const l = deltaSPrimitive._labels[i];
      const y = candleSeries.priceToCoordinate(l.price);
      if (y == null) continue;
      const approxWidth = l.text.length * 7 + 8;
      if (px >= chartWidthCss - 4 - approxWidth - tolerance && px <= chartWidthCss + tolerance &&
          py >= y + 2 - tolerance && py <= y + 2 + 14 + tolerance) {
        return i;
      }
    }
    return -1;
  }

  // ---- "Text" tool — a single button (over panel 2) arms this on all 3 panels at once, same
  // convention as H-Line above. Each click places whatever text was captured from the Windows
  // clipboard at the moment the button was pressed (see ChartPanel.ToggleTextModeAsync), anchored
  // at that click's own (time, price) point. Session-only — no persistence, no mirroring across
  // panels (each panel only places text where IT was clicked). ----

  // Max paragraph width in CSS px before wrapping to a new line — kept in one place so both the
  // draw() word-wrap below and findClickTextByClick's hit-test estimate agree on it.
  const ClickTextMaxWidthCss = 180;

  // Greedy word-wrap: fits as many whole words per line as measureText allows under maxWidthPx
  // (bitmap px, already scaled by pixelRatio) — a single word longer than the max width is left
  // on its own line rather than broken mid-word.
  function wrapClickText(ctx, text, maxWidthPx) {
    const words = text.split(/\s+/).filter(w => w.length > 0);
    if (words.length === 0) return [''];
    const lines = [];
    let current = words[0];
    for (let i = 1; i < words.length; i++) {
      const candidate = `${current} ${words[i]}`;
      if (ctx.measureText(candidate).width <= maxWidthPx) {
        current = candidate;
      } else {
        lines.push(current);
        current = words[i];
      }
    }
    lines.push(current);
    return lines;
  }

  class ClickTextPrimitive {
    constructor() { this._labels = []; this._chart = null; } // [{ time, price, text, selected }, ...]
    attached(param) { this._chart = param.chart; }
    updateAllViews() {}
    paneViews() {
      const self = this;
      return [{
        renderer() {
          return {
            draw(target) {
              if (!self._chart) return;
              target.useBitmapCoordinateSpace(scope => {
                const ctx = scope.context;
                const ts = self._chart.timeScale();
                self._labels.forEach(l => {
                  const x = safeTimeToCoordinate(ts, l.time);
                  const y = candleSeries.priceToCoordinate(l.price);
                  if (x == null || y == null) return;

                  ctx.font = `bold ${12 * scope.verticalPixelRatio}px sans-serif`;
                  ctx.textBaseline = 'top';
                  ctx.textAlign = 'left';
                  const textX = x * scope.horizontalPixelRatio + 4 * scope.horizontalPixelRatio;
                  const textY = y * scope.verticalPixelRatio + 4 * scope.verticalPixelRatio;
                  const lineHeight = 15 * scope.verticalPixelRatio;
                  const maxWidthPx = ClickTextMaxWidthCss * scope.horizontalPixelRatio;

                  const lines = wrapClickText(ctx, l.text, maxWidthPx);

                  if (l.selected) {
                    const width = Math.max(...lines.map(line => ctx.measureText(line).width));
                    const height = lines.length * lineHeight;
                    ctx.save();
                    ctx.strokeStyle = '#ffeb3b';
                    ctx.setLineDash([6 * scope.horizontalPixelRatio, 4 * scope.horizontalPixelRatio]);
                    ctx.strokeRect(textX - 2, textY - 2, width + 4, height + 4);
                    ctx.restore();
                  }

                  ctx.fillStyle = '#ffffff';
                  lines.forEach((line, i) => ctx.fillText(line, textX, textY + i * lineHeight));
                });
              });
            }
          };
        }
      }];
    }
  }

  const clickTextPrimitive = new ClickTextPrimitive();
  let clickTextAttached = false;
  let textArmed = false;
  let pendingTextValue = '';

  // Arms/disarms the tool and captures the text to place on every subsequent click while armed —
  // called fresh each time the button is pressed (re-reads the clipboard C# side), so toggling
  // off and back on again picks up whatever's on the clipboard NOW.
  function toggleTextMode(text) {
    if (!clickTextAttached) { candleSeries.attachPrimitive(clickTextPrimitive); clickTextAttached = true; }
    textArmed = !textArmed;
    pendingTextValue = text || '';
    return textArmed;
  }

  // Same tolerance-based approach as findDeltaSByClick — no exact ctx.measureText available
  // outside the bitmap draw() context.
  function findClickTextByClick(px, py) {
    const ts = chart.timeScale();
    const tolerance = 4;
    // Same greedy word-wrap the draw() call uses, just to count how many lines this label
    // occupies for the hit box's height — width stays the fixed max (good enough for hit-testing,
    // same "approximate, not exact" convention as the other tools' click hit-tests here).
    const approxCharsPerLine = Math.max(1, Math.floor(ClickTextMaxWidthCss / 7));
    for (let i = clickTextPrimitive._labels.length - 1; i >= 0; i--) {
      const l = clickTextPrimitive._labels[i];
      const x = safeTimeToCoordinate(ts, l.time);
      const y = candleSeries.priceToCoordinate(l.price);
      if (x == null || y == null) continue;
      const words = l.text.split(/\s+/).filter(w => w.length > 0);
      let lineCount = 1, lineLen = 0;
      words.forEach(w => {
        if (lineLen > 0 && lineLen + 1 + w.length > approxCharsPerLine) { lineCount++; lineLen = w.length; }
        else { lineLen += (lineLen > 0 ? 1 : 0) + w.length; }
      });
      const approxWidth = Math.min(l.text.length, approxCharsPerLine) * 7 + 8;
      const approxHeight = lineCount * 15;
      if (px >= x + 4 - tolerance && px <= x + 4 + approxWidth + tolerance &&
          py >= y + 4 - tolerance && py <= y + 4 + approxHeight + tolerance) {
        return i;
      }
    }
    return -1;
  }

  // ---- Piso/Techo reference line (15m RTH / 15m RTH+Overnight panels only) — dashed horizontal
  // line at a Piso/Techo SMA's pre-market level, same color as that SMA on the 1h panel
  // (smaColors), so it's visible on the RTH charts as "how far price could go and bounce" without
  // needing the 1h panel open. Drawn once pre-market by ChartPanel (1h) pushing the value here via
  // MultiChartForm, removed either by the user (click + Delete, same as every other tool) or
  // automatically if the market-open gap invalidates that SMA's Piso/Techo (removePisoTechoRefLine,
  // called from ChartPanel.ValidatePisoTechoAgainstOpen). Anchored at the last loaded candle (same
  // "anchor to last candle, extend right" convention as markStrike/H-Line), so it covers the RTH
  // price action from whenever it was drawn (pre-market) onward. ----

  class PisoTechoRefLinePrimitive {
    constructor() { this._lines = []; this._chart = null; } // [{ period, time, timeEnd, price, color, selected }, ...]
    attached(param) { this._chart = param.chart; }
    updateAllViews() {}
    paneViews() {
      const self = this;
      return [{
        renderer() {
          return {
            draw(target) {
              if (!self._chart) return;
              target.useBitmapCoordinateSpace(scope => {
                const ctx = scope.context;
                const ts = self._chart.timeScale();
                // timeToCoordinate requires an EXACT match against a real candle's own time — the
                // C#-computed session start (yesterday's close) essentially never lands on an
                // actual candle boundary, so a direct call silently returns null. Snap to the
                // nearest REAL candle at/after the target instead — same idea as markPrevDayClose,
                // and (per explicit request) same "ray to the right edge" ending too, instead of
                // bounding the segment to whatever of today happens to be loaded so far — that
                // bounded approach made the line render as a near-invisible sliver right at market
                // open (start and end both snapping to the single just-opened candle) confirmed
                // live via allCandles inspection.
                const snapStart = target => {
                  for (let i = 0; i < allCandles.length; i++) if (allCandles[i].time >= target) return allCandles[i].time;
                  return null;
                };

                self._lines.forEach(l => {
                  if (allCandles.length === 0) return;
                  const snappedStart = snapStart(l.time) ?? allCandles[allCandles.length - 1].time;
                  const xCss = safeTimeToCoordinate(ts, snappedStart);
                  if (xCss == null) return;
                  const x = xCss * scope.horizontalPixelRatio;
                  const x2Bitmap = scope.bitmapSize.width;

                  const y = candleSeries.priceToCoordinate(l.price);
                  if (y == null) return;

                  ctx.strokeStyle = l.color;
                  ctx.lineWidth = 1.5 * scope.horizontalPixelRatio;
                  ctx.setLineDash([6 * scope.horizontalPixelRatio, 4 * scope.horizontalPixelRatio]);
                  ctx.beginPath();
                  ctx.moveTo(x, y * scope.verticalPixelRatio);
                  ctx.lineTo(x2Bitmap, y * scope.verticalPixelRatio);
                  ctx.stroke();

                  if (l.selected) {
                    ctx.save();
                    ctx.strokeStyle = '#ffeb3b';
                    ctx.lineWidth = 1.5 * scope.horizontalPixelRatio;
                    ctx.setLineDash([6 * scope.horizontalPixelRatio, 4 * scope.horizontalPixelRatio]);
                    ctx.beginPath();
                    ctx.moveTo(x, y * scope.verticalPixelRatio - 2 * scope.verticalPixelRatio);
                    ctx.lineTo(x2Bitmap, y * scope.verticalPixelRatio - 2 * scope.verticalPixelRatio);
                    ctx.stroke();
                    ctx.restore();
                  }
                });
                ctx.setLineDash([]);
              });
            }
          };
        }
      }];
    }
  }

  const pisoTechoRefLinePrimitive = new PisoTechoRefLinePrimitive();
  let pisoTechoRefLineAttached = false;

  // sessionStartTime/sessionEndTime are the RTH session's own 9:30/16:00 ET anchors, computed in
  // C# (ChartPanel/SimulatedChartPanel.ToFakeUtcEpochSeconds) — NOT derived from allCandles (unlike
  // markStrike), since this gets called right after a day/history load, before allCandles is
  // necessarily populated yet (SimulatorForm calls EvaluatePisoTecho before RenderCurrentStep, and
  // both are fire-and-forget into the WebView, so the order isn't guaranteed). Fixed, independently
  // computed timestamps sidestep that race entirely.
  function markPisoTechoRefLine(period, price, sessionStartTime, sessionEndTime) {
    if (!pisoTechoRefLineAttached) { candleSeries.attachPrimitive(pisoTechoRefLinePrimitive); pisoTechoRefLineAttached = true; }
    pisoTechoRefLinePrimitive._lines = pisoTechoRefLinePrimitive._lines.filter(l => l.period !== period);
    pisoTechoRefLinePrimitive._lines.push({ period, time: sessionStartTime, timeEnd: sessionEndTime, price, color: smaColors[period] || '#888888', selected: false });
    forceRepaint();
  }

  function removePisoTechoRefLine(period) {
    pisoTechoRefLinePrimitive._lines = pisoTechoRefLinePrimitive._lines.filter(l => l.period !== period);
    forceRepaint();
  }

  function findPisoTechoRefLineByClick(px, py) {
    const ts = chart.timeScale();
    const tolerance = 6;
    for (let i = pisoTechoRefLinePrimitive._lines.length - 1; i >= 0; i--) {
      const l = pisoTechoRefLinePrimitive._lines[i];
      const xRaw = safeTimeToCoordinate(ts, l.time);
      const x = xRaw == null ? 0 : xRaw;
      const y = candleSeries.priceToCoordinate(l.price);
      if (y == null) continue;
      if (distToSegment(px, py, x, y, chart.timeScale().width(), y) <= tolerance) return i;
    }
    return -1;
  }

  // ---- SMA overlay (optional — only enabled on panels that call configureSmas) ----

  let allCandles = [];           // mirrors what's on the candle series, kept sorted by time
  let smaSeries = {};            // period -> LineSeries
  let smaPeriods = [];
  let smaLastPoint = {};         // period -> { time, value } of that SMA's current last point (see markPisoTecho)

  const smaColors = { 20: '#f5a623', 40: '#ef5350', 100: '#26a69a', 200: '#a259ff' };
  const smaWidths = { 20: 1, 40: 1, 100: 2, 200: 2 };

  function configureSmas(periods) {
    periods.forEach(p => {
      if (!smaSeries[p]) {
        smaSeries[p] = chart.addLineSeries({
          color: smaColors[p] || '#888888',
          lineWidth: smaWidths[p] || 1,
          priceLineVisible: false,
          lastValueVisible: false,
          crosshairMarkerVisible: false, // no dot on the SMA line when hovering
          // Never contribute to the shared price scale's autoscale — its own data (recalculateSmas)
          // spans the FULL history, not just the visible window, so its default autoscale
          // contribution could pull the price range toward months-old values, overriding
          // candleSeries' custom autoscaleInfoProvider (the one actually meant to drive this).
          autoscaleInfoProvider: () => null,
        });
      }
    });
    smaPeriods = periods;
    recalculateSmas();
  }

  function recalculateSmas() {
    // Full daily history (not the ~50-bar displaySeries()) so long lookbacks like SMA200 stay
    // accurate — only the portion of the resulting line that falls within the visible time range
    // actually gets drawn, so this doesn't show anything beyond what displaySeries() shows.
    const source = dailyMode ? dailySeriesFull() : allCandles;
    smaPeriods.forEach(p => {
      if (source.length < p) { smaSeries[p].setData([]); smaLastPoint[p] = null; return; }
      const data = [];
      let sum = 0;
      for (let i = 0; i < source.length; i++) {
        sum += source[i].close;
        if (i >= p) sum -= source[i - p].close;
        if (i >= p - 1) data.push({ time: source[i].time, value: sum / p });
      }
      smaSeries[p].setData(data);
      smaLastPoint[p] = data.length > 0 ? data[data.length - 1] : null;
    });
  }

  function upsertCandle(candle) {
    const idx = allCandles.findIndex(c => c.time === candle.time);
    if (idx >= 0) allCandles[idx] = candle;
    else allCandles.push(candle);
  }

  // ---- Daily view toggle (1h panel only, via toggleDaily) — aggregates the full hourly
  // history (allCandles, always kept as the true source) into one bar per ET calendar day.
  // recalculateSmas/applyVisibleRange/candle rendering all read through displaySeries() so
  // switching modes doesn't need its own separate code path for each. ----
  let dailyMode = false;

  function aggregateToDaily(candles) {
    if (candles.length === 0) return [];
    // Explicitly sorted first — the caller's own order isn't trusted here (this turned out to
    // matter: whatever order `candles` arrived in, the LAST day bucket must genuinely be the most
    // recent one, since renderCandles/setData and the price-centering logic both key off the
    // final element being "today"). Also filters out any day-bucket whose time didn't come out as
    // a finite number, cheap insurance against a single malformed row silently becoming the
    // sorted-last entry and dragging the whole chart's scale toward some months-old price.
    const sorted = candles.slice().sort((a, b) => a.time - b.time);
    const byDay = new Map(); // dayStart -> aggregated bar
    for (const c of sorted) {
      const day = dayStartOf(c.time);
      if (!Number.isFinite(day)) continue;
      const bucket = byDay.get(day);
      if (!bucket) {
        byDay.set(day, { time: day, open: c.open, high: c.high, low: c.low, close: c.close });
      } else {
        bucket.high = Math.max(bucket.high, c.high);
        bucket.low = Math.min(bucket.low, c.low);
        bucket.close = c.close;
      }
    }
    return Array.from(byDay.values()).sort((a, b) => a.time - b.time);
  }

  // Daily candles rendered are capped to the last ~50 — SMAs still need the FULL daily history for
  // an accurate lookback (see recalculateSmas, which uses dailySeriesFull() instead), but the
  // candlestick series itself only ever needs to actually show a reasonable recent window. This
  // also sidesteps a real repaint bug: swapping candleSeries between a small hourly array (~45
  // bars) and the FULL ~200+ day daily array, then narrowing the visible range back down via
  // setVisibleLogicalRange, left the candles invisible until a manual scroll/zoom forced a real
  // repaint — fitContent/forceRepaint/resize/a synthetic wheel event none reliably fixed it.
  // Feeding candleSeries an already right-sized ~50-bar array outright avoids the whole situation.
  const DailyCandlesShown = 50;

  function dailySeriesFull() {
    return aggregateToDaily(allCandles);
  }

  function displaySeries() {
    return dailyMode ? dailySeriesFull().slice(-DailyCandlesShown) : allCandles;
  }

  function renderCandles() {
    candleSeries.setData(displaySeries());
  }

  // Toggle: Daily shows the last ~50 daily bars (see DailyCandlesShown/displaySeries) built from
  // up to ~200 trading days of persisted hourly history — SMAs still use the full history for an
  // accurate lookback (see recalculateSmas). H1 goes back to plain hourly bars (last 7 days by
  // default). Drawings (T-Line, arrows, etc.) aren't touched — they're anchored to real
  // timestamps, which stay valid regardless of which series is currently rendered.
  function toggleDaily() {
    dailyMode = !dailyMode;
    visibleDays = dailyMode ? DailyCandlesShown : 7; // daily: show the whole (already ~50-bar) displaySeries()
    userHasInteracted = false; // each mode gets its own fresh default view, not the other's manual pan/zoom

    // Update lastAppliedRange to the NEW mode's indices BEFORE renderCandles() — see
    // computeVisibleRange's comment for why (setData's own synchronous autoscale pass would
    // otherwise run against the previous mode's stale range first).
    const range = computeVisibleRange();
    if (range) lastAppliedRange = range;

    renderCandles();
    chart.timeScale().fitContent();
    applyVisibleRange();
    recalculateSmas();

    // Nothing programmatic through Lightweight Charts' own API (fitContent, forceRepaint, resize,
    // a synthetic wheel event) has reliably forced a repaint here — only an actual manual
    // scroll/zoom does. Forcing a real DOM/CSS reflow instead, independent of the charting library
    // entirely: toggling display off and back on forces the browser engine to discard and rebuild
    // layout for the whole container, which drags the canvas repaint along with it.
    container.style.display = 'none';
    void container.offsetHeight; // reading a layout property forces the reflow to happen NOW, synchronously
    container.style.display = '';

    return dailyMode;
  }

  // ---- Bollinger Bands overlay (optional — only enabled on panels that call configureBollinger) ----

  let bollingerConfig = null; // { period, mult }
  let bollingerSeries = null; // { upper, middle, lower }

  // Panel 2 (15m RTH), both Simulator and Live Chart: white markers over the CURRENT Bollinger
  // upper/lower band values, bounded to just the forming (last) candle's width — a quick visual of
  // exactly where the bands sit right now, updated every step/tick alongside recalculateBollinger
  // itself. Enabled via enableBollingerEdgeMarkers(), called from both SimulatedChartPanel and
  // ChartPanel's Fifteen_RTH setup.
  let bollingerEdgeMarkersEnabled = false;
  function enableBollingerEdgeMarkers() { bollingerEdgeMarkersEnabled = true; }

  // Separate from bollingerEdgeMarkersEnabled above — that one gates whether the values get
  // computed at all (set once, per panel, at load); this one is the user-facing show/hide toggle
  // (a checkbox in the toolbar), checked only in draw() so calculation keeps running underneath
  // even while hidden (cheap, and means it's already up to date the moment it's shown again).
  let bollingerEdgeMarkersVisible = true;
  function setBollingerEdgeMarkersVisible(show) { bollingerEdgeMarkersVisible = show; forceRepaint(); }

  // Each band's marker is a 2-point segment (previous candle -> forming candle), NOT a fixed-width
  // horizontal mark — so its slope visually shows the band opening outward, moving sideways, or
  // closing inward between those two candles, which a horizontal-only mark couldn't show.
  class BollingerEdgeMarkerPrimitive {
    constructor() { this._upper = null; this._lower = null; this._chart = null; } // { prev:{time,price}, curr:{time,price} } | null
    attached(param) { this._chart = param.chart; }
    updateAllViews() {}
    paneViews() {
      const self = this;
      return [{
        renderer() {
          return {
            draw(target) {
              if (!self._chart || !bollingerEdgeMarkersVisible) return;
              target.useBitmapCoordinateSpace(scope => {
                const ctx = scope.context;
                const ts = self._chart.timeScale();
                const drawOne = (segment) => {
                  if (!segment) return;
                  const x1Raw = safeTimeToCoordinate(ts, segment.prev.time);
                  const x2Raw = safeTimeToCoordinate(ts, segment.curr.time);
                  if (x1Raw == null || x2Raw == null) return;
                  const y1 = candleSeries.priceToCoordinate(segment.prev.price);
                  const y2 = candleSeries.priceToCoordinate(segment.curr.price);
                  if (y1 == null || y2 == null) return;
                  ctx.strokeStyle = '#ffffff';
                  ctx.lineWidth = 2 * scope.horizontalPixelRatio;
                  ctx.beginPath();
                  ctx.moveTo(x1Raw * scope.horizontalPixelRatio, y1 * scope.verticalPixelRatio);
                  ctx.lineTo(x2Raw * scope.horizontalPixelRatio, y2 * scope.verticalPixelRatio);
                  ctx.stroke();
                };
                drawOne(self._upper);
                drawOne(self._lower);
              });
            }
          };
        }
      }];
    }
  }

  const bollingerEdgeMarkerPrimitive = new BollingerEdgeMarkerPrimitive();
  let bollingerEdgeMarkerAttached = false;

  function configureBollinger(period, deviations, middleSolid) {
    bollingerConfig = { period: period, mult: deviations };
    if (!bollingerSeries) {
      // Same reasoning as smaSeries — never contribute to the shared price scale's autoscale.
      const opts = { lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false, autoscaleInfoProvider: () => null };
      bollingerSeries = {
        upper:  chart.addLineSeries({ ...opts, color: '#787b86' }),
        middle: chart.addLineSeries({ ...opts, color: '#FFD700', lineStyle: middleSolid ? LightweightCharts.LineStyle.Solid : LightweightCharts.LineStyle.Dashed }),
        lower:  chart.addLineSeries({ ...opts, color: '#787b86' }),
      };
    }
    recalculateBollinger();
  }

  function recalculateBollinger() {
    if (!bollingerConfig || !bollingerSeries) return;
    const { period: p, mult } = bollingerConfig;
    if (allCandles.length < p) {
      bollingerSeries.upper.setData([]);
      bollingerSeries.middle.setData([]);
      bollingerSeries.lower.setData([]);
      if (bollingerEdgeMarkersEnabled) {
        bollingerEdgeMarkerPrimitive._upper = null;
        bollingerEdgeMarkerPrimitive._lower = null;
      }
      return;
    }
    const upperData = [], midData = [], lowerData = [];
    for (let i = p - 1; i < allCandles.length; i++) {
      let sum = 0;
      for (let j = i - p + 1; j <= i; j++) sum += allCandles[j].close;
      const mean = sum / p;
      let variance = 0;
      for (let j = i - p + 1; j <= i; j++) variance += Math.pow(allCandles[j].close - mean, 2);
      const stdDev = Math.sqrt(variance / p);
      const t = allCandles[i].time;
      upperData.push({ time: t, value: mean + mult * stdDev });
      midData.push({ time: t, value: mean });
      lowerData.push({ time: t, value: mean - mult * stdDev });
    }
    bollingerSeries.upper.setData(upperData);
    bollingerSeries.middle.setData(midData);
    bollingerSeries.lower.setData(lowerData);

    // White edge markers (see enableBollingerEdgeMarkers) — a 2-point segment from the PREVIOUS
    // candle's band value to the forming candle's, re-set every recalculation, so its slope shows
    // the band opening/closing/going sideways between those two candles.
    if (bollingerEdgeMarkersEnabled && upperData.length >= 2) {
      if (!bollingerEdgeMarkerAttached) { candleSeries.attachPrimitive(bollingerEdgeMarkerPrimitive); bollingerEdgeMarkerAttached = true; }
      const prevUpper = upperData[upperData.length - 2], currUpper = upperData[upperData.length - 1];
      const prevLower = lowerData[lowerData.length - 2], currLower = lowerData[lowerData.length - 1];
      bollingerEdgeMarkerPrimitive._upper = {
        prev: { time: prevUpper.time, price: prevUpper.value }, curr: { time: currUpper.time, price: currUpper.value }
      };
      bollingerEdgeMarkerPrimitive._lower = {
        prev: { time: prevLower.time, price: prevLower.value }, curr: { time: currLower.time, price: currLower.value }
      };
      forceRepaint();
    }
  }

  // ---- Overnight shading (optional — only enabled on panels that call configureOvernightBands) ----
  // Draws a gray rectangle behind the candles for each gap between one day's RTH close (4:00 PM
  // ET) and the next available day's RTH open (9:30 AM ET) — highlights overnight/weekend gaps,
  // like the reference screenshot. Uses the Series Primitives API (custom canvas overlay), since
  // Lightweight Charts has no built-in "shade this time range" feature.
  let overnightBandsEnabled = false;

  class OvernightBandsPrimitive {
    constructor() { this._bands = []; this._chart = null; }
    attached(param) { this._chart = param.chart; }
    updateAllViews() {}
    paneViews() {
      const self = this;
      return [{
        renderer() {
          return {
            draw(target) {
              if (!self._chart) return;
              target.useBitmapCoordinateSpace(scope => {
                const ctx = scope.context;
                const ts = self._chart.timeScale();
                ctx.fillStyle = 'rgba(150, 150, 150, 0.18)';
                self._bands.forEach(b => {
                  const x1 = safeTimeToCoordinate(ts, b.from);
                  if (x1 == null) return;
                  // b.to can be a still-future time (the in-progress overnight band's end, before
                  // any candle at/after that point exists) — timeToCoordinate returns null for
                  // anything outside the currently visible range, so clip to the chart's right
                  // edge instead of silently skipping the whole band (same pattern H-Line uses).
                  const x2 = safeTimeToCoordinate(ts, b.to);
                  const leftPx  = x1 * scope.horizontalPixelRatio;
                  const rightPx = x2 == null ? scope.bitmapSize.width : x2 * scope.horizontalPixelRatio;
                  const left  = Math.min(leftPx, rightPx);
                  const width = Math.abs(rightPx - leftPx);
                  ctx.fillRect(left, 0, width, scope.bitmapSize.height);
                });
              });
            }
          };
        }
      }];
    }
  }

  const overnightPrimitive = new OvernightBandsPrimitive();

  // ---- Day dividers (1h panel only — see ChartPanel.ToggleDayDividersAsync) ----
  // Dashed vertical line at the start of each of the last 4 days present in allCandles, so the 7
  // hourly candles (9:30-10:00 slot + 6 clock-hour slots) belonging to one trading day are
  // visually separated from the next. Deliberately only the last 4 — that separates the last 5
  // days without drawing a line for "today" itself, so today's candles just sit to the right of
  // the most recent line with nothing bounding them on the right (still mid-session).
  let dayDividersEnabled = false;

  class DayDividerPrimitive {
    constructor() { this._times = []; this._chart = null; }
    attached(param) { this._chart = param.chart; }
    updateAllViews() {}
    paneViews() {
      const self = this;
      return [{
        renderer() {
          return {
            draw(target) {
              if (!self._chart) return;
              target.useBitmapCoordinateSpace(scope => {
                const ctx = scope.context;
                const ts = self._chart.timeScale();
                ctx.strokeStyle = '#787b86';
                ctx.lineWidth = 1 * scope.horizontalPixelRatio;
                ctx.setLineDash([4 * scope.horizontalPixelRatio, 4 * scope.horizontalPixelRatio]);
                self._times.forEach(t => {
                  const x = safeTimeToCoordinate(ts, t);
                  if (x == null) return;
                  ctx.beginPath();
                  ctx.moveTo(x * scope.horizontalPixelRatio, 0);
                  ctx.lineTo(x * scope.horizontalPixelRatio, scope.bitmapSize.height);
                  ctx.stroke();
                });
                ctx.setLineDash([]);
              });
            }
          };
        }
      }];
    }
  }

  const dayDividerPrimitive = new DayDividerPrimitive();

  function toggleDayDividers() {
    dayDividersEnabled = !dayDividersEnabled;
    if (dayDividersEnabled) {
      candleSeries.attachPrimitive(dayDividerPrimitive);
      recalculateDayDividers();
    } else {
      dayDividerPrimitive._times = [];
      forceRepaint();
    }
    return dayDividersEnabled;
  }

  // Unconditional "turn on" (unlike toggleDayDividers, which flips) — called once at chart load
