  // "anchor to last candle, extend right" convention as markStrike/H-Line), so it covers the RTH
  // price action from whenever it was drawn (pre-market) onward. ----

  class PisoTechoRefLinePrimitive {
    constructor() { this._lines = []; this._chart = null; } // [{ period, time, price, color, selected }, ...]
    attached(param) { this._chart = param.chart; }
    updateAllViews() {}
    paneViews() {
      const self = this;
      return [{
        renderer() {
          return {
            draw(target) {
              if (!self._chart) return;
              target.useBitmapCoordinateSpace(scope => {
                const ctx = scope.context;
                const ts = self._chart.timeScale();
                self._lines.forEach(l => {
                  const xRaw = ts.timeToCoordinate(l.time);
                  const x = xRaw == null ? 0 : xRaw; // falls back to left edge until session-start time is in range
                  const y = candleSeries.priceToCoordinate(l.price);
                  if (y == null) return;

                  ctx.strokeStyle = l.color;
                  ctx.lineWidth = 1.5 * scope.horizontalPixelRatio;
                  ctx.setLineDash([6 * scope.horizontalPixelRatio, 4 * scope.horizontalPixelRatio]);
                  ctx.beginPath();
                  ctx.moveTo(x * scope.horizontalPixelRatio, y * scope.verticalPixelRatio);
                  ctx.lineTo(scope.bitmapSize.width, y * scope.verticalPixelRatio);
                  ctx.stroke();

                  if (l.selected) {
                    ctx.save();
                    ctx.strokeStyle = '#ffeb3b';
                    ctx.lineWidth = 1.5 * scope.horizontalPixelRatio;
                    ctx.setLineDash([6 * scope.horizontalPixelRatio, 4 * scope.horizontalPixelRatio]);
                    ctx.beginPath();
                    ctx.moveTo(x * scope.horizontalPixelRatio, y * scope.verticalPixelRatio - 2 * scope.verticalPixelRatio);
                    ctx.lineTo(scope.bitmapSize.width, y * scope.verticalPixelRatio - 2 * scope.verticalPixelRatio);
                    ctx.stroke();
                    ctx.restore();
                  }
                });
                ctx.setLineDash([]);
              });
            }
          };
        }
      }];
    }
  }

  const pisoTechoRefLinePrimitive = new PisoTechoRefLinePrimitive();
  let pisoTechoRefLineAttached = false;

  // sessionStartTime is the RTH session's own 9:30 ET anchor, computed in C# (ChartPanel/
  // SimulatedChartPanel.ToFakeUtcEpochSeconds) — NOT derived from allCandles (unlike markStrike),
  // since this gets called right after a day/history load, before allCandles is necessarily
  // populated yet (SimulatorForm calls EvaluatePisoTecho before RenderCurrentStep, and both are
  // fire-and-forget into the WebView, so the order isn't guaranteed). A fixed, independently
  // computed timestamp sidesteps that race entirely.
  function markPisoTechoRefLine(period, price, sessionStartTime) {
    if (!pisoTechoRefLineAttached) { candleSeries.attachPrimitive(pisoTechoRefLinePrimitive); pisoTechoRefLineAttached = true; }
    pisoTechoRefLinePrimitive._lines = pisoTechoRefLinePrimitive._lines.filter(l => l.period !== period);
    pisoTechoRefLinePrimitive._lines.push({ period, time: sessionStartTime, price, color: smaColors[period] || '#888888', selected: false });
    forceRepaint();
  }

  function removePisoTechoRefLine(period) {
    pisoTechoRefLinePrimitive._lines = pisoTechoRefLinePrimitive._lines.filter(l => l.period !== period);
    forceRepaint();
  }

  function findPisoTechoRefLineByClick(px, py) {
    const ts = chart.timeScale();
    const tolerance = 6;
    for (let i = pisoTechoRefLinePrimitive._lines.length - 1; i >= 0; i--) {
      const l = pisoTechoRefLinePrimitive._lines[i];
      const xRaw = ts.timeToCoordinate(l.time);
      const x = xRaw == null ? 0 : xRaw;
      const y = candleSeries.priceToCoordinate(l.price);
      if (y == null) continue;
      if (distToSegment(px, py, x, y, chart.timeScale().width(), y) <= tolerance) return i;
    }
    return -1;
  }

  // ---- SMA overlay (optional — only enabled on panels that call configureSmas) ----

  let allCandles = [];           // mirrors what's on the candle series, kept sorted by time
  let smaSeries = {};            // period -> LineSeries
  let smaPeriods = [];
  let smaLastPoint = {};         // period -> { time, value } of that SMA's current last point (see markPisoTecho)

  const smaColors = { 20: '#f5a623', 40: '#ef5350', 100: '#26a69a', 200: '#a259ff' };
  const smaWidths = { 20: 1, 40: 1, 100: 2, 200: 2 };

  function configureSmas(periods) {
    periods.forEach(p => {
      if (!smaSeries[p]) {
        smaSeries[p] = chart.addLineSeries({
          color: smaColors[p] || '#888888',
          lineWidth: smaWidths[p] || 1,
          priceLineVisible: false,
          lastValueVisible: false,
          crosshairMarkerVisible: false, // no dot on the SMA line when hovering
        });
      }
    });
    smaPeriods = periods;
    recalculateSmas();
  }

  function recalculateSmas() {
    const source = displaySeries();
    smaPeriods.forEach(p => {
      if (source.length < p) { smaSeries[p].setData([]); smaLastPoint[p] = null; return; }
      const data = [];
      let sum = 0;
      for (let i = 0; i < source.length; i++) {
        sum += source[i].close;
        if (i >= p) sum -= source[i - p].close;
        if (i >= p - 1) data.push({ time: source[i].time, value: sum / p });
      }
      smaSeries[p].setData(data);
      smaLastPoint[p] = data.length > 0 ? data[data.length - 1] : null;
    });
  }

  function upsertCandle(candle) {
    const idx = allCandles.findIndex(c => c.time === candle.time);
    if (idx >= 0) allCandles[idx] = candle;
    else allCandles.push(candle);
  }

  // ---- Daily view toggle (1h panel only, via toggleDaily) — aggregates the full hourly
  // history (allCandles, always kept as the true source) into one bar per ET calendar day.
  // recalculateSmas/applyVisibleRange/candle rendering all read through displaySeries() so
  // switching modes doesn't need its own separate code path for each. ----
  let dailyMode = false;

  function aggregateToDaily(candles) {
    if (candles.length === 0) return [];
    const byDay = new Map(); // dayStart -> aggregated bar
    for (const c of candles) {
      const day = dayStartOf(c.time);
      const bucket = byDay.get(day);
      if (!bucket) {
        byDay.set(day, { time: day, open: c.open, high: c.high, low: c.low, close: c.close });
      } else {
        bucket.high = Math.max(bucket.high, c.high);
        bucket.low = Math.min(bucket.low, c.low);
        bucket.close = c.close;
      }
    }
    return Array.from(byDay.values()).sort((a, b) => a.time - b.time);
  }

  function displaySeries() {
    return dailyMode ? aggregateToDaily(allCandles) : allCandles;
  }

  function renderCandles() {
    candleSeries.setData(displaySeries());
  }

  // Toggle: Daily shows one bar per day (last 20 by default) built from up to ~200 trading days
  // of persisted hourly history; H1 goes back to plain hourly bars (last 7 days by default).
  // Drawings (T-Line, arrows, etc.) aren't touched — they're anchored to real timestamps, which
  // stay valid regardless of which series is currently rendered.
  function toggleDaily() {
    dailyMode = !dailyMode;
    visibleDays = dailyMode ? 20 : 7;
    userHasInteracted = false; // each mode gets its own fresh default view, not the other's manual pan/zoom
    renderCandles();
    applyVisibleRange();
    recalculateSmas();
    return dailyMode;
  }

  // ---- Bollinger Bands overlay (optional — only enabled on panels that call configureBollinger) ----

  let bollingerConfig = null; // { period, mult }
  let bollingerSeries = null; // { upper, middle, lower }

  function configureBollinger(period, deviations) {
    bollingerConfig = { period: period, mult: deviations };
    if (!bollingerSeries) {
      const opts = { lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false };
      bollingerSeries = {
        upper:  chart.addLineSeries({ ...opts, color: '#787b86' }),
        middle: chart.addLineSeries({ ...opts, color: '#787b86', lineStyle: LightweightCharts.LineStyle.Dashed }),
        lower:  chart.addLineSeries({ ...opts, color: '#787b86' }),
      };
    }
    recalculateBollinger();
  }

  function recalculateBollinger() {
    if (!bollingerConfig || !bollingerSeries) return;
    const { period: p, mult } = bollingerConfig;
    if (allCandles.length < p) {
      bollingerSeries.upper.setData([]);
      bollingerSeries.middle.setData([]);
      bollingerSeries.lower.setData([]);
      return;
    }
    const upperData = [], midData = [], lowerData = [];
    for (let i = p - 1; i < allCandles.length; i++) {
      let sum = 0;
      for (let j = i - p + 1; j <= i; j++) sum += allCandles[j].close;
      const mean = sum / p;
      let variance = 0;
      for (let j = i - p + 1; j <= i; j++) variance += Math.pow(allCandles[j].close - mean, 2);
      const stdDev = Math.sqrt(variance / p);
      const t = allCandles[i].time;
      upperData.push({ time: t, value: mean + mult * stdDev });
      midData.push({ time: t, value: mean });
      lowerData.push({ time: t, value: mean - mult * stdDev });
    }
    bollingerSeries.upper.setData(upperData);
    bollingerSeries.middle.setData(midData);
    bollingerSeries.lower.setData(lowerData);
  }

  // ---- Overnight shading (optional — only enabled on panels that call configureOvernightBands) ----
  // Draws a gray rectangle behind the candles for each gap between one day's RTH close (4:00 PM
  // ET) and the next available day's RTH open (9:30 AM ET) — highlights overnight/weekend gaps,
  // like the reference screenshot. Uses the Series Primitives API (custom canvas overlay), since
  // Lightweight Charts has no built-in "shade this time range" feature.
  let overnightBandsEnabled = false;

  class OvernightBandsPrimitive {
    constructor() { this._bands = []; this._chart = null; }
    attached(param) { this._chart = param.chart; }
    updateAllViews() {}
    paneViews() {
      const self = this;
      return [{
        renderer() {
          return {
            draw(target) {
              if (!self._chart) return;
              target.useBitmapCoordinateSpace(scope => {
                const ctx = scope.context;
                const ts = self._chart.timeScale();
                ctx.fillStyle = 'rgba(150, 150, 150, 0.18)';
                self._bands.forEach(b => {
                  const x1 = ts.timeToCoordinate(b.from);
                  if (x1 == null) return;
                  // b.to can be a still-future time (the in-progress overnight band's end, before
                  // any candle at/after that point exists) — timeToCoordinate returns null for
                  // anything outside the currently visible range, so clip to the chart's right
                  // edge instead of silently skipping the whole band (same pattern H-Line uses).
                  const x2 = ts.timeToCoordinate(b.to);
                  const leftPx  = x1 * scope.horizontalPixelRatio;
                  const rightPx = x2 == null ? scope.bitmapSize.width : x2 * scope.horizontalPixelRatio;
                  const left  = Math.min(leftPx, rightPx);
                  const width = Math.abs(rightPx - leftPx);
                  ctx.fillRect(left, 0, width, scope.bitmapSize.height);
                });
              });
            }
          };
        }
      }];
    }
  }

  const overnightPrimitive = new OvernightBandsPrimitive();

  // ---- Day dividers (1h panel only — see ChartPanel.ToggleDayDividersAsync) ----
  // Dashed vertical line at the start of each of the last 4 days present in allCandles, so the 7
  // hourly candles (9:30-10:00 slot + 6 clock-hour slots) belonging to one trading day are
  // visually separated from the next. Deliberately only the last 4 — that separates the last 5
  // days without drawing a line for "today" itself, so today's candles just sit to the right of
  // the most recent line with nothing bounding them on the right (still mid-session).
  let dayDividersEnabled = false;

  class DayDividerPrimitive {
    constructor() { this._times = []; this._chart = null; }
    attached(param) { this._chart = param.chart; }
    updateAllViews() {}
    paneViews() {
      const self = this;
      return [{
        renderer() {
          return {
            draw(target) {
              if (!self._chart) return;
              target.useBitmapCoordinateSpace(scope => {
                const ctx = scope.context;
                const ts = self._chart.timeScale();
                ctx.strokeStyle = '#787b86';
                ctx.lineWidth = 1 * scope.horizontalPixelRatio;
                ctx.setLineDash([4 * scope.horizontalPixelRatio, 4 * scope.horizontalPixelRatio]);
                self._times.forEach(t => {
                  const x = ts.timeToCoordinate(t);
                  if (x == null) return;
                  ctx.beginPath();
                  ctx.moveTo(x * scope.horizontalPixelRatio, 0);
                  ctx.lineTo(x * scope.horizontalPixelRatio, scope.bitmapSize.height);
                  ctx.stroke();
                });
                ctx.setLineDash([]);
              });
            }
          };
        }
      }];
    }
  }

  const dayDividerPrimitive = new DayDividerPrimitive();

  function toggleDayDividers() {
    dayDividersEnabled = !dayDividersEnabled;
    if (dayDividersEnabled) {
      candleSeries.attachPrimitive(dayDividerPrimitive);
      recalculateDayDividers();
    } else {
      dayDividerPrimitive._times = [];
      forceRepaint();
    }
    return dayDividersEnabled;
  }

  // Unconditional "turn on" (unlike toggleDayDividers, which flips) — called once at chart load
  // so the day dividers are on by default, matching the "Día" checkbox's default checked state.
  function enableDayDividers() {
    if (dayDividersEnabled) return;
    toggleDayDividers();
  }

  function recalculateDayDividers() {
    if (!dayDividersEnabled || allCandles.length === 0) { dayDividerPrimitive._times = []; return; }

    // First candle's time per distinct day, in order — dayStartOf's own value works fine as the
    // divider's x-position too (every day's first candle lands at/after its own dayStartOf).
    const dayStarts = [];
    let lastDay = null;
    for (const c of allCandles) {
      const day = dayStartOf(c.time);
      if (day !== lastDay) { dayStarts.push(c.time); lastDay = day; }
    }

    // Last 4 boundaries = separates the last 5 days; drop the very first one of those 5 (that's
    // the START of the oldest of the 5 days, not a divider BETWEEN two of them).
    dayDividerPrimitive._times = dayStarts.slice(-5).slice(1);
    forceRepaint();
  }

  function configureOvernightBands() {
    overnightBandsEnabled = true;
    candleSeries.attachPrimitive(overnightPrimitive);
    recalculateOvernightBands();
  }

  // Real current time, converted to the same "ET digits disguised as UTC" seconds scheme the
  // candle data uses (see ToChartJson in ChartPanel.cs), so it can be compared directly against
  // dayStart()/candle.time values.
  function nowAsFakeUtcSeconds() {
    const parts = new Intl.DateTimeFormat('en-US', {
      timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
    }).formatToParts(new Date());
    const get = type => parseInt(parts.find(p => p.type === type).value, 10);
    let hour = get('hour');
    if (hour === 24) hour = 0; // some locales report midnight as "24"
    return Date.UTC(get('year'), get('month') - 1, get('day'), hour, get('minute'), get('second')) / 1000;
  }

  // Each candle's "time" is already ET wall-clock digits disguised as UTC (see C# ToChartJson) —
  // read it back with the UTC getters to recover the real ET date/hour cheaply, no library.
  function dayStartOf(t) {
    const d = new Date(t * 1000);
    return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) / 1000;
  }

  function isRthTime(t) {
    const d = new Date(t * 1000);
    const minutesOfDay = d.getUTCHours() * 60 + d.getUTCMinutes();
    return minutesOfDay >= 9 * 60 + 30 && minutesOfDay < 16 * 60;
  }

  // Next 9:30 AM strictly after `t` (skips to the next calendar day if `t` is already past that
  // day's 9:30), skipping Saturday/Sunday.
  function next930After(t) {
    let day = dayStartOf(t);
    let candidate = day + 9.5 * 3600;
    if (candidate <= t) { day += 24 * 3600; candidate = day + 9.5 * 3600; }
    while (true) {
      const weekday = new Date(candidate * 1000).getUTCDay(); // 0=Sun, 6=Sat
      if (weekday !== 0 && weekday !== 6) break;
      day += 24 * 3600;
      candidate = day + 9.5 * 3600;
    }
    return candidate;
  }

  // Shades every stretch where the ACTUAL candles fall outside RTH hours (9:30 AM-4:00 PM ET) —
  // driven directly by real candle timestamps rather than inferred from a "days present" list,
  // so it can't accidentally shade a day that's entirely within RTH due to a day-boundary mixup.
  function recalculateOvernightBands() {
    if (!overnightBandsEnabled || allCandles.length === 0) return;

    const bands = [];
    let bandStart = null;
    for (const c of allCandles) {
      if (!isRthTime(c.time)) {
        if (bandStart == null) bandStart = c.time;
      } else if (bandStart != null) {
        bands.push({ from: bandStart, to: c.time });
        bandStart = null;
      }
    }

    const lastCandle = allCandles[allCandles.length - 1];
    if (bandStart != null) {
      // Real overnight/weekend ticks are already coming in right now — extend that open band up
      // to the next RTH open instead of stopping at the last tick received so far.
      bands.push({ from: bandStart, to: next930After(lastCandle.time) });
    } else {
      // Last candle was RTH. If that day's session has genuinely closed (real now past 4:00 PM
      // ET) but no overnight ticks have arrived yet, anticipate the gap instead of waiting for
      // the first one — same reasoning as before, just no longer tied to a "days" list.
      const assumedClose = dayStartOf(lastCandle.time) + 16 * 3600;
      if (nowAsFakeUtcSeconds() >= assumedClose) {
        const from = Math.max(assumedClose, lastCandle.time);
        bands.push({ from, to: next930After(lastCandle.time) });
      }
    }

    overnightPrimitive._bands = bands;
  }

  // ---- Functions called from C# via WebView2.ExecuteScriptAsync ----

  // Seeds T-Line drawings persisted from a previous session (1h panel only — see TLineStore.cs).
  function loadTLines(lines) {
    if (!tLineAttached) { candleSeries.attachPrimitive(tLinePrimitive); tLineAttached = true; }
    tLinePrimitive._lines = (lines || []).map(l => ({ t1: l.t1, p1: l.p1, t2: l.t2, p2: l.p2 }));
    forceRepaint();
  }

  // Seeds vertical arrows persisted from a previous session (1h panel only — see VerticalArrowStore.cs).
  function loadArrows(arrows) {
    if (!verticalArrowAttached) { candleSeries.attachPrimitive(verticalArrowPrimitive); verticalArrowAttached = true; }
    verticalArrowPrimitive._arrows = (arrows || []).map(a => ({ time: a.time, price: a.price, up: a.up, selected: false }));
    forceRepaint();
  }

  // Replaces the whole dataset — used once at startup to seed historical candles on the live
  // chart, but called on EVERY step by the simulator (SimulatedChartPanel.CargarHastaPasoAsync
  // recomputes and resends the full candle list each ◀/▶ click instead of incrementally updating
  // like the live chart does). Only force the default view on the very first call; after that,
  // behave like a live update (reapplyVisibleRangeIfLive) so a manual pan/zoom survives.
  let historyLoadedOnce = false;

  // Called by the simulator (SimulatedChartPanel.ResetViewForNewDay) whenever the user loads a
  // DIFFERENT simulation day, as opposed to just stepping ◀/▶ within the same day. Without this,
  // historyLoadedOnce/userHasInteracted stay stuck forever on this WebView instance (it's reused
  // across day loads, unlike the live chart which is created once per session) — the OLD day's
  // pan/zoom window would keep being reapplied to the NEW day's candles, making e.g. the new
  // day's 9:30 candle land wherever the old view's edge used to be instead of at the real open.
  function resetViewForNewDay() {
    historyLoadedOnce = false;
    userHasInteracted = false;
    lastAppliedRange = null;
  }

  function loadHistory(candles) {
    allCandles = candles.slice().sort((a, b) => a.time - b.time);
    renderCandles();
    if (!historyLoadedOnce) {
      if (visibleDays) applyVisibleRange(); else chart.timeScale().fitContent();
      historyLoadedOnce = true;
    } else {
      reapplyVisibleRangeIfLive();
    }
    recalculateSmas();
    recalculateBollinger();
    recalculateOvernightBands();
    recalculateDayDividers();
  }

  // Updates the still-forming candle (same Time as the last one) without redrawing everything.
  // In Daily mode there's no single "last bar" to hand to candleSeries.update() — the live
  // hourly tick just extends whichever day it falls in, so re-render the whole (cheap, ~200-bar)
  // daily series instead.
  function updateLastCandle(candle) {
    upsertCandle(candle);
    if (dailyMode) renderCandles(); else candleSeries.update(candle);
    recalculateSmas();
    recalculateBollinger();
    recalculateOvernightBands();
    recalculateDayDividers();
    // series.update()/setData() can auto-scroll the time scale to keep following the latest bar,
    // which eats into the right-edge margin set at load time — reapply it on every live tick so
    // it sticks, but only while the user is actually following the live edge (see
    // reapplyVisibleRangeIfLive): otherwise a manual pan to the left would get overridden by
    // the very next tick.
    reapplyVisibleRangeIfLive();
  }

  // A new candle period started — same call as update; Lightweight Charts appends automatically
  // when the Time is newer than the last point.
  function addFullCandle(candle) {
    upsertCandle(candle);
    if (dailyMode) renderCandles(); else candleSeries.update(candle);
    recalculateSmas();
    recalculateBollinger();
    recalculateOvernightBands();
    recalculateDayDividers();
    reapplyVisibleRangeIfLive();
  }

  // Same idea as addFullCandle, but for the 15m RTH panel's overnight-gap day reset (see
  // ChartPanel.Streamer_OnNewCandle) — the new candle's time is often MANY hours away from the
  // previous one (yesterday's last RTH bar to today's 9:30 open), and candleSeries.update()'s
  // incremental path doesn't always recompute that single bar's width/spacing correctly across
  // such a large gap, visually "stretching" it. A full candleSeries.setData() (via renderCandles)
  // forces Lightweight Charts to rebuild layout from scratch instead, which doesn't have that
  // issue — more expensive than update(), but this only runs once per day, not per tick.
  function resetToNewDayCandle(candle) {
    upsertCandle(candle);
    renderCandles();
    recalculateSmas();
    recalculateBollinger();
    recalculateOvernightBands();
    recalculateDayDividers();
    reapplyVisibleRangeIfLive();
  }
</script>
</body>
</html>
